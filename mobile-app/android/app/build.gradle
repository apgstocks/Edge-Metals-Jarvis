apply plugin: 'com.android.application'

// ── Release signing ────────────────────────────────────────────────────────
// Reads from keystore.properties, which is GITIGNORED and must never be
// committed. Play identifies an app by its signing key forever: lose it and
// you can no longer publish an update to this listing, at all, under any
// circumstances. Back the .jks file and these credentials up somewhere that
// survives a laptop dying.
//
// A missing keystore.properties is not an error — the debug build and every
// existing `assembleDebug` workflow keep working untouched, and only
// `bundleRelease` needs it. That way nobody has to set up signing to keep
// sideloading test builds, which is still the fastest way to try a change.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace "com.edgemetals.loads"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.edgemetals.loads"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 51
        versionName "6.8"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        // ── Debug installs alongside the real app, not over it ─────────────
        // Apsara, 2026-09-02: "package conflicts with existing package".
        //
        // That is Android refusing an install, and it is working as intended.
        // The release APK is signed with edge-yard-release.jks
        // (CN=Edge Trading); a debug APK is signed with the throwaway Android
        // debug key (CN=Android Debug). Android will not let an APK replace an
        // installed one signed by a DIFFERENT key — that check is the whole
        // reason nobody can push a fake update over your app — and with both
        // builds sharing applicationId "com.edgemetals.loads" the only way to
        // sideload a debug build was to uninstall the real app first, taking
        // its data with it.
        //
        // Suffixing the debug applicationId makes them two separate apps, so
        // both sit on the phone at once and the real one is never at risk.
        //
        // Checked before doing this, because an applicationId change breaks
        // anything that hardcodes the package name:
        //   • AndroidManifest's FileProvider uses ${applicationId}.fileprovider
        //     — a placeholder, so it follows this automatically and the two
        //     apps cannot clash over the provider authority.
        //   • No google-services.json, so no package-bound Google config.
        //   • The Java namespace (com.edgemetals.loads) is unaffected —
        //     applicationId and namespace are separate settings.
        // The RELEASE build is deliberately untouched: it keeps the exact
        // applicationId the Play listing and every installed phone expects.
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            // The launcher name is overridden in src/debug/res/values/strings.xml
            // rather than with resValue here: app_name already exists in the
            // main source set, and resValue would generate a SECOND definition
            // of it and fail the build on a duplicate resource. A debug source
            // set overrides main cleanly, which is what it is for.
        }
        release {
            // Only attach the signing config when the properties actually
            // exist — referencing an unconfigured one makes the whole Gradle
            // project fail to configure, which would break assembleDebug too.
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // ── On-device wake word ────────────────────────────────────────────────
    // Picovoice Porcupine. Replaces eleven builds of SpeechRecognizer driven in
    // a restart loop — see docs/voice-wake-word-research.md for why that could
    // never work and what the literature says instead.
    //
    // "Jarvis" is a BUILT-IN keyword, so it needs no model file and no custom
    // training. A custom word ("Scout") is a .ppn dropped into src/main/assets
    // and is picked up automatically by WakeWordPlugin.
    implementation 'ai.picovoice:porcupine-android:3.0.2'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
