<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quote Requests — Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Same design tokens as dashboard/address-book.html / index.html — kept in
   sync by hand since this is a standalone page. If the main dashboard's
   theme changes, mirror the change here too. */
:root {
  --steel-950: #0C0E10; --steel-900: #14181B; --steel-800: #1E2429; --steel-700: #2B3239;
  --steel-600: #3C454D; --steel-500: #57616A; --steel-400: #7E8891; --steel-300: #A7B0B7;
  --steel-200: #CBD1D6; --steel-100: #E5E9EC; --steel-50: #F3F5F7; --white: #FFFFFF;
  --leaf-50: #ECF8EA; --leaf-100: #D3F0CD; --leaf-200: #ABE2A1; --leaf-300: #7FD172;
  --leaf-400: #57BE49; --leaf-500: #3DA836; --leaf-600: #2E861F; --leaf-700: #226620; --leaf-800: #194C18;
  --copper-50: #FBF1E9; --copper-100: #F5DCC8; --copper-200: #EDBE99; --copper-300: #E29C68;
  --copper-400: #D77E3D; --copper-500: #C25E22; --copper-600: #A54A17; --copper-700: #813913;
  --green-500: #2F8F57; --amber-500: #D99A2B; --red-500: #C5402F; --blue-500: #3A6EA5;
  --bg-base: #0C0E10; --bg-panel: #0F1214;
  --surface-card: #14181B; --surface-sunken: #0F1214; --surface-hover: #181D21;
  --text-strong: #FFFFFF; --text-body: #CBD1D6; --text-muted: #A7B0B7; --text-faint: #7E8891;
  --accent: var(--leaf-500); --accent-hover: var(--leaf-600); --accent-soft: rgba(87,190,73,.15);
  --accent-onSoft: var(--leaf-300);
  --border-subtle: #1E2429; --border-default: #2B3239;
  --status-success: var(--green-500); --status-warning: var(--amber-500);
  --status-danger: var(--red-500); --status-info: var(--blue-500);
  --ring: var(--leaf-500);
  --font-display: 'Archivo', sans-serif;
  --font-sans: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', monospace;
  --radius-xs: 2px; --radius-sm: 4px; --radius-md: 6px;
  --shadow-xs: 0 1px 2px rgba(0,0,0,.3);
  --dur-fast: 120ms; --ease-out: cubic-bezier(.2,.7,.2,1);
}
* , *::before, *::after { box-sizing: border-box; }
body { margin:0; font-family:var(--font-sans); font-size:1rem; line-height:1.5; color:var(--text-body); background:var(--bg-base); -webkit-font-smoothing:antialiased; min-height:100vh; }
h1,h2 { font-family:var(--font-display); color:var(--text-strong); margin:0; font-weight:900; line-height:1.15; letter-spacing:-.02em; }
a { color:var(--leaf-400); text-decoration:none; }
a:hover { color:var(--leaf-300); text-decoration:underline; text-underline-offset:3px; }
button { font:inherit; }
::selection { background:rgba(87,190,73,.35); color:#fff; }
:focus-visible { outline:2px solid var(--ring); outline-offset:2px; }
.eyebrow { font-family:var(--font-mono); font-size:11px; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--copper-400); margin-bottom:8px; }
.btn { display:inline-flex; align-items:center; gap:8px; justify-content:center; border-radius:var(--radius-xs); font-family:var(--font-mono); font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; border:1px solid transparent; padding:10px 18px; transition:background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out); }
.btn-primary { background:var(--accent); color:#fff; border-color:var(--accent); box-shadow:0 0 22px rgba(61,168,54,.28); }
.btn-primary:hover { background:var(--accent-hover); }
.btn-secondary { background:var(--surface-card); color:var(--text-strong); border-color:var(--border-default); }
.btn-secondary:hover { border-color:var(--steel-600); }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.card { background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:var(--radius-sm); box-shadow:var(--shadow-xs); }
.spinner { display:inline-block; width:13px; height:13px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.hidden { display:none !important; }
.badge { display:inline-flex; align-items:center; padding:2px 8px; border-radius:999px; font-family:var(--font-mono); font-size:10.5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; }
::-webkit-scrollbar { width:10px; height:10px; }
::-webkit-scrollbar-thumb { background:var(--steel-700); border-radius:5px; border:2px solid transparent; background-clip:content-box; }
::-webkit-scrollbar-track { background:transparent; }
table { width:100%; border-collapse:collapse; }
th { text-align:left; font-family:var(--font-mono); font-size:10.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint); padding:8px 10px; border-bottom:1px solid var(--border-subtle); }
td { padding:10px 10px; font-size:13px; border-bottom:1px solid var(--border-subtle); vertical-align:top; }
tr:last-child td { border-bottom:none; }
</style>
</head>
<body>
<section style="max-width:960px; margin:0 auto; padding:38px 40px 80px;">
  <a href="/" style="display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-faint); margin-bottom:20px;">&larr; Back to dashboard</a>
  <div style="display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:8px;">
    <div><div class="eyebrow">// Quotes</div><h2 style="font-size:24px; text-transform:uppercase;">Quote requests</h2></div>
    <button id="btnRefresh" class="btn btn-secondary">Refresh</button>
  </div>
  <div style="font-size:13px; color:var(--text-muted); margin-bottom:22px;">Every "get quote from X to Y" ask, per trucker — who was asked, over which channel, and where each one stands. Sending, reminders, and replies all happen over WhatsApp/email; this page is read-only. Auto-refreshes every 30s.</div>
  <label style="display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-muted); margin-bottom:16px; cursor:pointer;">
    <input id="hideClosedToggle" type="checkbox">
    <span>Hide closed requests (everyone priced or escalated)</span>
  </label>
  <div id="qrList" style="display:flex; flex-direction:column; gap:16px;"></div>
</section>

<script>
// ── QUOTE REQUESTS COMPARISON TABLE ──────────────────────────────────────
// Built 2026-08-05 alongside workflow/quoteRequests.js. Reads GET
// /api/quote-requests (data/quote_requests.json as-is — one row per request,
// each holding an array of per-trucker "legs") and renders one card per
// request with a per-leg table: trucker / channel / status / price / last
// reply / reminders sent. Standalone page, same pattern as
// dashboard/address-book.html — served at /quote-requests (see api.js).
function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
const $ = (id) => document.getElementById(id);

async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (res.status === 401) { location.href = '/login'; throw new Error('unauthorized'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `request failed (${res.status})`);
  return data;
}

const STATUS_LABEL = {
  awaiting_reply: { text: 'Awaiting reply', color: 'var(--status-warning)' },
  price_received: { text: 'Priced', color: 'var(--status-success)' },
  no_response_escalated: { text: 'No response — escalated', color: 'var(--status-danger)' },
};
const CHANNEL_LABEL = { whatsapp_group: 'WhatsApp (group)', whatsapp_individual: 'WhatsApp (DM)', email: 'Email' };

function fmtTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return isNaN(d.getTime()) ? '—' : d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}
function fmtPrice(price) {
  if (!price) return '—';
  return price.amount != null ? `$${price.amount.toLocaleString()}` : price.raw_text || '—';
}

function legRow(leg) {
  const status = STATUS_LABEL[leg.status] || { text: leg.status, color: 'var(--text-muted)' };
  return `
    <tr>
      <td style="font-weight:600; color:var(--text-strong);">${esc(leg.trucker_name)}</td>
      <td>${esc(CHANNEL_LABEL[leg.channel] || leg.channel)}</td>
      <td><span class="badge" style="background:${status.color}22; color:${status.color};">${esc(status.text)}</span></td>
      <td style="font-family:var(--font-mono); font-weight:600; color:var(--text-strong);">${fmtPrice(leg.price)}</td>
      <td style="max-width:220px; color:var(--text-muted);">${esc(leg.last_reply_text || '—')}</td>
      <td style="color:var(--text-faint);">${leg.reminders_sent.length} sent</td>
      <td style="color:var(--text-faint); font-size:11.5px;">${fmtTime(leg.sent_at)}</td>
    </tr>`;
}

function requestCard(r) {
  const closed = r.status === 'closed';
  return `
    <div class="card" style="padding:18px 20px;">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:4px;">
        <div style="font-size:15px; font-weight:700; color:var(--text-strong);">${esc(r.origin_query)} &rarr; ${esc(r.destination_query)}</div>
        <span class="badge" style="background:${closed ? 'rgba(87,97,106,.25)' : 'rgba(61,168,54,.15)'}; color:${closed ? 'var(--text-faint)' : 'var(--leaf-400)'};">${closed ? 'Closed' : 'Active'}</span>
      </div>
      <div style="font-size:11.5px; color:var(--text-faint); margin-bottom:4px;">Asked ${fmtTime(r.created_at)}</div>
      ${r.cargo_details ? `<div style="font-size:12px; color:var(--text-muted); margin-bottom:12px;"><strong style="color:var(--text-body);">Cargo:</strong> ${esc(r.cargo_details)}</div>` : '<div style="margin-bottom:12px;"></div>'}
      <div style="overflow-x:auto;">
        <table>
          <thead><tr><th>Trucker</th><th>Channel</th><th>Status</th><th>Price</th><th>Last reply</th><th>Reminders</th><th>Sent</th></tr></thead>
          <tbody>${r.legs.map(legRow).join('')}</tbody>
        </table>
      </div>
    </div>`;
}

let requestsData = [];

function render() {
  const hideClosed = $('hideClosedToggle').checked;
  const list = requestsData
    .filter((r) => !hideClosed || r.status !== 'closed')
    .slice()
    .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  const el = $('qrList');
  if (!requestsData.length) {
    el.innerHTML = `<div style="font-family:var(--font-mono); font-size:12px; color:var(--text-faint); text-align:center; padding:30px 0;">No quote requests yet — say "get quote from X to Y" on WhatsApp to start one.</div>`;
    return;
  }
  el.innerHTML = list.length
    ? list.map(requestCard).join('')
    : `<div style="font-family:var(--font-mono); font-size:12px; color:var(--text-faint); text-align:center; padding:30px 0;">Nothing to show — every request is closed (uncheck the filter above to see them).</div>`;
}

async function load() {
  try {
    requestsData = await api('/api/quote-requests');
    render();
  } catch (e) {
    $('qrList').innerHTML = `<div style="font-family:var(--font-mono); font-size:11.5px; color:var(--status-danger);">${esc(e.message)}</div>`;
  }
}

$('btnRefresh').addEventListener('click', () => load());
$('hideClosedToggle').addEventListener('change', render);
load();
setInterval(load, 30000);
</script>
</body>
</html>
