      await load();
    } catch (e) { toast(e.message, 'bad'); }
  };
  $('#n_cust', wrap).focus();
}

/* ── scanning a document ──────────────────────────────────────────────────
   Apsara, 2026-10-02: "Add a scan page in claim sheet. When i scan pass it
   across the model, and fill all the details by itself."

   IT FILLS THE FORM AND STOPS. The mail path can check a quoted figure against
   the source text it came from; a photograph has no source text, so there is
   nothing to check against and the only verification is a person reading the
   document next to the form. The words it read sit beside every field for
   exactly that reason, and nothing is created until the button is pressed. */
const SCAN_FIELDS = [
  ['customer', 'Customer'], ['supplier', 'Supplier'],
  ['invoice_no', 'Invoice no'], ['container_no', 'Container no'],
  ['invoice_weight', 'Invoiced weight'], ['claimed_weight', 'Weight received'],
  ['weight_unit', 'Unit'], ['stated_claim_amount', 'Amount they are asking'],
  ['date', 'Date on the document'], ['what_is_claimed', 'What is claimed'],
];
function openScan(){
  const wrap = document.createElement('div');
  wrap.className = 'modal';
  wrap.innerHTML = '<div class="box wide"><h3>Scan a claim document</h3>' +
    '<div class="hint" style="margin-top:0">A surveyor outturn report, a weighbridge ticket or the customer’s own claim letter. Photograph the page, or pick a PDF.</div>' +
    '<label class="f" style="margin-top:12px">Document' +
      '<input id="s_file" type="file" accept="image/*,application/pdf" capture="environment">' +
    '</label>' +
    '<div class="actions"><button class="btn go" id="s_read" type="button">Read it</button>' +
      '<button class="btn" id="s_cancel" type="button">Cancel</button>' +
      '<span class="hint" style="margin:0" id="s_state"></span></div>' +
    '<div id="s_out"></div></div>';
  document.body.appendChild(wrap);
  const close = () => wrap.remove();
  wrap.onclick = (e) => { if (e.target === wrap) close(); };
  $('#s_cancel', wrap).onclick = close;

  let picked = null;
  $('#s_file', wrap).onchange = (e) => { picked = e.target.files[0] || null; $('#s_state', wrap).textContent = picked ? picked.name : ''; };

  $('#s_read', wrap).onclick = async () => {
    if (!picked) { toast('Pick a photo or a PDF first.', 'bad'); return; }
    const btn = $('#s_read', wrap); btn.disabled = true; btn.textContent = 'Reading…';
    $('#s_out', wrap).innerHTML = '';
    try {
      const b64 = await new Promise((res, rej) => {
        const fr = new FileReader();
        fr.onload = () => res(String(fr.result).replace(/^data:[^,]+,/, ''));
        fr.onerror = () => rej(new Error('that file could not be read on this device'));
        fr.readAsDataURL(picked);
      });
      const r = await fetch('/api/claims/scan', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ base64: b64, mimeType: picked.type || 'image/jpeg' }),
      });
      const d = await r.json().catch(() => null);
      if (r.status === 422 && d) { showNotClaim(wrap, d); return; }
      if (!r.ok || !d) throw new Error((d && (d.error || d.reason)) || ('HTTP ' + r.status));
      showScan(wrap, d, close);
    } catch (e) {
      $('#s_out', wrap).innerHTML = '<div class="card"><div class="why">It could not be read — ' + esc(e.message) + '</div></div>';
      toast(e.message, 'bad');
    } finally { btn.disabled = false; btn.textContent = 'Read it'; }
  };
}

function showNotClaim(wrap, d){
  $('#s_out', wrap).innerHTML = '<div class="card"><h3>That does not look like a claim</h3>' +
    '<div class="hint" style="margin-top:0">' + esc(d.why || 'nothing on the page says anything is being claimed') + '</div>' +
    '<div class="hint">Nothing was created. If it IS a claim, photograph the page that states the shortage — the page with the weights on it.</div></div>';
}

function showScan(wrap, d, closeModal){
  const f = d.fields || {}, q = d.quotes || {};
  const row = ([k, label]) => {
    const v = f[k];
    const quoted = q[k];
    return '<label class="f">' + label +
      '<input class="sf' + (k === 'invoice_no' || k === 'container_no' ? ' mono' : '') + '" data-k="' + k + '" value="' + esc(v == null ? '' : v) + '">' +
      '<span class="hint" style="margin-top:4px">' + (quoted ? '“' + esc(quoted) + '”' : 'nothing quoted for this — check it yourself') + '</span></label>';
  };
  const noUnit = !f.weight_unit;
  $('#s_out', wrap).innerHTML =
    '<div class="card"><h3>' + esc(d.docType || 'claim document') + (d.confidence != null ? ' · ' + Math.round(d.confidence * 100) + '% sure' : '') + '</h3>' +
      '<div class="why">' + esc(d.verification) + '</div>' +
      (d.lowConfidence ? '<div class="hint"><b>·</b> It is not confident about this one. Read every figure against the document before you create anything.</div>' : '') +
      ((d.unreadable || []).length ? '<div class="hint"><b>·</b> It could not read: ' + esc(d.unreadable.join(', ')) + '</div>' : '') +
      (noUnit ? '<div class="hint"><b>·</b> the document did not state a unit, so no figure is worked out. A guess between MT and pounds is out by 2204x — set the unit in Confirm the weights.</div>' : '') +
      (d.existing ? '<div class="hint"><b>·</b> ' + esc(d.existing.container_no || d.existing.invoice_no) + ' already has a claim (' + esc(d.existing.status) + '). Creating this makes a SECOND one — only do that if it is a different argument.</div>' : '') +
    '</div>' +
    '<div class="card"><h3>What it read</h3><div class="grid">' + SCAN_FIELDS.map(row).join('') + '</div>' +
      '<div class="hint">Kind: ' + esc(d.kind && d.kind.slug ? kindLabel(d.kind.slug) : 'not worked out — it will be named when the claim is read') + '</div>' +
      '<div class="actions"><button class="btn go" id="s_create" type="button">Create this claim, unverified</button>' +
        '<span class="hint" style="margin:0">Weights and the unit are not stored from a scan — they are entered in Confirm the weights, where the unit is recorded with them.</span></div>' +
    '</div>';

  $('#s_create', wrap).onclick = async () => {
    const get = (k) => { const el = wrap.querySelector('.sf[data-k="' + k + '"]'); return el ? el.value.trim() : ''; };
    if (!get('container_no') && !get('invoice_no')) { toast('A claim needs at least a container number or an invoice number.', 'bad'); return; }
    const btn = $('#s_create', wrap); btn.disabled = true; btn.textContent = 'Creating…';
    try {
      const rec = await api('/api/claims', {
        customer: get('customer'), supplier: get('supplier'),
        invoice_no: get('invoice_no'), container_no: get('container_no'),
        stated_claim_amount: numOf(get('stated_claim_amount')),
        claim_date: get('date'),
        claim_type: (d.kind && d.kind.slug) || '',
        note: get('what_is_claimed'),
        created_by: 'scan',
      });
      // The photograph is the evidence behind the figures. The claim is already
      // created by this point, so a Drive failure costs the document, never the
      // claim — and it says which.
      if (d.scanId) {
        try { await api('/api/claims/' + rec.id + '/evidence', { scanId: d.scanId, by: 'scan' }); }
        catch (e) { toast('Claim created, but the scan could not be filed — ' + e.message, 'bad'); }
      }
      closeModal(); toast('Created, unverified. Confirm the weights next.', 'ok');
      STATE.sel = String(rec.container_no || rec.invoice_no || '—').toUpperCase();
      await load();
    } catch (e) { btn.disabled = false; btn.textContent = 'Create this claim, unverified'; toast(e.message, 'bad'); }
  };
}

/* ── the statement that goes to a supplier ────────────────────────────────
   Apsara, 2026-10-02: "create claim report option where i can download the
   report and share it with supplier".

   An unverified claim is held OUT by default. It is a reading, not a demand,
   and a figure sent to a supplier and then corrected downwards is worth less
   than the same figure sent once. */
function openStatement(pre){
  const wrap = document.createElement('div');
  wrap.className = 'modal';
  wrap.innerHTML = '<div class="box wide"><h3>Claim report for a supplier' + (pre.container ? ' — ' + esc(pre.container) : '') + '</h3>' +
    '<div class="hint" style="margin-top:0">The document a supplier is asked to pay against. It shows what is recoverable from them and nothing about what Edge absorbs.</div>' +
    '<div class="grid" style="margin-top:12px">' +
      '<label class="f">Supplier<select id="r_sup"><option value="">loading…</option></select></label>' +
      '<label class="f">Only claims from<input id="r_from" type="date"></label>' +
      '<label class="f">Up to<input id="r_to" type="date"></label>' +
    '</div>' +
    '<label class="f" style="margin-top:10px"><span><input type="checkbox" id="r_unv"> Include unverified claims</span>' +
      '<span class="hint" style="margin-top:4px">Held back by default — an unverified claim is a reading, not a demand. Included, each one prints “not yet verified” and stays out of the total.</span></label>' +
    '<label class="f"><span><input type="checkbox" id="r_set"> Include ones already settled</span></label>' +
    '<div class="actions">' +
      '<button class="btn go" id="r_pdf" type="button">Download PDF</button>' +
      '<button class="btn" id="r_xls" type="button">Download Excel</button>' +
      '<button class="btn" id="r_prev" type="button">Preview</button>' +
      '<button class="btn" id="r_cancel" type="button">Cancel</button>' +
    '</div>' +
    '<div id="r_out"></div></div>';
  document.body.appendChild(wrap);
  const close = () => wrap.remove();
  wrap.onclick = (e) => { if (e.target === wrap) close(); };
  $('#r_cancel', wrap).onclick = close;

  const qs = () => {
    const p = new URLSearchParams();
    const sup = $('#r_sup', wrap).value;
    if (sup) p.set('supplier', sup);
    if (pre.container) p.set('container', pre.container);
    if ($('#r_from', wrap).value) p.set('from', $('#r_from', wrap).value);
    if ($('#r_to', wrap).value) p.set('to', $('#r_to', wrap).value);
    if ($('#r_unv', wrap).checked) p.set('includeUnverified', '1');
    if ($('#r_set', wrap).checked) p.set('includeSettled', '1');
    return p.toString();
  };

  (async () => {
    try {
      const r = await api('/api/claims/report/suppliers');
      const list = r.suppliers || [];
      $('#r_sup', wrap).innerHTML = '<option value="">every supplier</option>' +
        list.map(s => '<option value="' + esc(s.supplier) + '"' + (pre.supplier === s.supplier ? ' selected' : '') + '>' +
          esc(s.supplier) + ' — ' + money(s.recoverable) + (s.unverified ? ' (' + s.unverified + ' unverified)' : '') + '</option>').join('');
      if (pre.supplier) $('#r_sup', wrap).value = pre.supplier;
      await refresh();
    } catch (e) { $('#r_sup', wrap).innerHTML = '<option value="">could not load suppliers</option>'; toast(e.message, 'bad'); }
  })();

  async function refresh(){
    try {
      const b = await api('/api/claims/report?' + qs());
      $('#r_out', wrap).innerHTML = '<div class="card"><h3>' + b.totals.claims + ' claims · ' + money(b.totals.recoverable) + ' recoverable</h3>' +
        '<div class="hint" style="margin-top:0">To ' + esc(b.addressedTo || 'every supplier on these claims') + ' · ref ' + esc(b.reference) + '</div>' +
        (b.unverifiedCount && !b.includedUnverified ? '<div class="hint"><b>·</b> ' + b.unverifiedCount + ' unverified claim(s) are NOT in this — a reading, not a demand. Tick the box above to include them for information.</div>' : '') +
        ((b.noFigure || []).length ? '<div class="hint"><b>·</b> ' + b.noFigure.length + ' claim(s) have no recovery figure, so they add nothing to the total. Raise the recovery on them first.</div>' : '') +
        ((b.notReconciled || []).length ? '<div class="hint"><b>·</b> ' + b.notReconciled.length + ' line(s) do not reconcile — ' +
          b.notReconciled.map(n => esc(n.container_no || n.invoice_no) + ': ' + money(n.our_claim) + ' recorded, ' + money(n.atRate) + ' at the bill rate').join('; ') +
          '. The rate is left OFF those lines, so the supplier is not handed a contradiction. Fix the figure or the rate if they should agree.</div>' : '') +
        (b.totals.claims ? '' : '<div class="hint"><b>·</b> Nothing to send. Confirm the weights and raise the recovery on at least one claim first.</div>') +
      '</div>';
    } catch (e) { $('#r_out', wrap).innerHTML = '<div class="card"><div class="why">' + esc(e.message) + '</div></div>'; }
  }
  ['#r_sup', '#r_from', '#r_to', '#r_unv', '#r_set'].forEach(sel => { const el = $(sel, wrap); if (el) el.onchange = refresh; });

  $('#r_prev', wrap).onclick = () => window.open('/api/claims/report?' + qs() + '&format=html', '_blank');
  $('#r_pdf', wrap).onclick = () => { toast('Building the PDF…', 'ok'); window.location = '/api/claims/report?' + qs() + '&format=pdf'; };
  $('#r_xls', wrap).onclick = () => { window.location = '/api/claims/report?' + qs() + '&format=xlsx'; };
}

/* ── importing a weight-shortage sheet ────────────────────────────────────
   Two steps on purpose. Reading and classifying writes nothing; the plan stays on
   the server and this page holds only an id, so what you confirm is exactly what
   was computed. Nothing here raises a to-do or sends a WhatsApp — eighty
   historical claims through the normal path would have messaged the team eighty
   times. */
const money0 = (n) => '$' + Math.round(Number(n)||0).toLocaleString('en-US');
function openImport(){
  const wrap = document.createElement('div');
  wrap.className = 'modal';
  wrap.innerHTML = '<div class="box wide"><h3>Import a weight shortage sheet</h3>' +
    '<div class="hint" style="margin-top:0">Upload the sheet, or read the live tab. The model reads every row, names what each claim is actually about, then settles those names into a vocabulary. Nothing is written until you confirm, and no to-do or WhatsApp goes out either way.</div>' +
    '<div class="drop" id="i_drop">Drop a .xlsx or .csv here, or choose one' +
      '<input type="file" id="i_file" accept=".xlsx,.xls,.csv,text/csv">' +
    '</div>' +
    '<div class="actions">' +
      '<button class="btn go" id="i_live" type="button">Read the live tab instead</button>' +
      '<label class="hint" style="margin:0;display:flex;align-items:center;gap:6px"><input type="checkbox" id="i_ai" checked> let the model classify them</label>' +
      '<button class="btn" id="i_close" type="button" style="margin-left:auto">Close</button>' +
    '</div>' +
    '<div id="i_out"></div></div>';
  document.body.appendChild(wrap);
  const close = () => wrap.remove();
  wrap.onclick = (e) => { if (e.target === wrap) close(); };
  $('#i_close', wrap).onclick = close;
  const out = $('#i_out', wrap);
  const useAi = () => $('#i_ai', wrap).checked;

  const busy = (what) => { out.innerHTML = '<div class="imp-sec"><h4><span class="spin"></span> ' + esc(what) + '</h4>' +
    '<div class="hint">Every row is read on its own, so a full sheet takes a minute or two. Leave this open.</div></div>'; };

  const failed = (msg) => {
    // Inline, not only a toast. The toast can be missed, scrolled past or
    // dismissed; the reason the import did not happen belongs where she was
    // looking when it did not happen.
    out.innerHTML = '<div class="imp-sec"><h4 style="color:#f0b3aa">That did not work</h4>' +
      '<div class="hint" style="margin-top:0">' + esc(msg) + '</div>' +
      '<div class="hint">Nothing was written. If it was the live tab, the sheet has to be link-viewable from the server — uploading the file works either way.</div></div>';
    toast(msg, 'bad');
  };

  async function preview(body){
    busy('reading the sheet and working out what each claim is about');
    try { render(await api('/api/claims/import/preview', { ...body, useAi: useAi() })); }
    catch (e) { failed(e.message); }
  }

  $('#i_live', wrap).onclick = () => preview({});
  const fileEl = $('#i_file', wrap);
  fileEl.onchange = () => {
    const f = fileEl.files && fileEl.files[0];
    if (!f) return;
    const r = new FileReader();
    if (/\.csv$/i.test(f.name) || f.type === 'text/csv') {
      r.onerror = () => failed('that file could not be read from disk');
      r.onload = () => preview({ csv: String(r.result), name: f.name });
      r.readAsText(f);
    } else {
      r.onerror = () => failed('that file could not be read from disk');
      r.onload = () => preview({ xlsxBase64: String(r.result).split(',').pop(), name: f.name });
      r.readAsDataURL(f);
    }
  };
  const drop = $('#i_drop', wrap);
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('on'); };
  drop.ondragleave = () => drop.classList.remove('on');
  drop.ondrop = (e) => {
    e.preventDefault(); drop.classList.remove('on');
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (!f) return;
    fileEl.files = e.dataTransfer.files;
    fileEl.onchange();
  };

  function list(title, items){
    if (!items || !items.length) return '';
    return '<div class="imp-sec"><h4>' + title + ' — ' + items.length + '</h4><div class="imp-list">' +
      items.map(x => '<span>' + esc(x) + '</span>').join('') + '</div></div>';
  }

  function render(p){
    const v = p.vocabulary || {};
    out.innerHTML =
      '<div class="imp-sec"><h4>' + esc(p.source) + ' — ' + p.sheetRows + ' rows</h4>' +
        (p.tabs ? '<div class="hint" style="margin-top:0">sheets in the file: ' + esc(p.tabs.join(', ')) + '</div>' : '') +
        (p.start && p.start.marker
          ? '<div class="hint" style="margin-top:0">Starting at row <b>' + (p.start.startRow + 1) + '</b>, just after “' + esc(p.start.marker) + '” — the ' + p.start.ignoredAbove + ' row(s) above it are an earlier year and are not imported.' +
            (p.start.inheritedFrom ? ' The rows under the marker have no header of their own, so the columns come from <b>row ' + p.start.inheritedFrom + '</b>.' : '') + '</div>'
          : (p.start && p.start.startRow
            ? '<div class="hint" style="margin-top:0">Starting at row ' + (p.start.startRow + 1) + ' as asked — ' + p.start.ignoredAbove + ' row(s) above it ignored.</div>'
            : '<div class="hint" style="margin-top:0">No year marker row on this sheet, so every row is read. Add a one-cell row reading e.g. “2027 Claims” to close off a year.</div>')) +
      '</div>' +
      '<div class="imp-sum">' +
        '<div><span class="k">To import</span><span class="v">' + p.count + '</span></div>' +
        '<div><span class="k">Claimed</span><span class="v">' + money0(p.totals.claimed) + '</span></div>' +
        '<div><span class="k">Recovered</span><span class="v">' + money0(p.totals.recovered) + '</span></div>' +
        '<div><span class="k">Absorbed</span><span class="v hi">' + money0(p.totals.net) + '</span></div>' +
        '<div><span class="k">Already in</span><span class="v">' + p.already + '</span></div>' +
        '<div><span class="k">By hand</span><span class="v">' + p.manual.length + '</span></div>' +
      '</div>' +
      '<div class="hint">Claimed is every row on the sheet. The register\'s own exposure figure will be lower, because withdrawn and rejected claims are not exposure.</div>' +

      '<div class="imp-sec"><h4>Where each figure was read from</h4><div class="imp-list">' +
        p.blocks.map(b => '<span>row ' + b.row + (b.legacy ? '  LEGACY  ' : '  ') +
          'claim←"' + esc(b.claimFrom || '(none)') + '"  recovery←"' + esc(b.recoveryFrom || '(none)') + '"  supplier←"' + esc(b.supplierFrom || '(none)') + '"</span>').join('') +
      '</div><div class="hint">In the 2025 block those two money columns are the reverse of every other block, and "Buyer" holds the supplier. If that looks wrong, stop — the totals are wrong too.</div></div>' +

      (v.named && v.named.length ? '<div class="imp-sec"><h4>What the model called them, row by row</h4><div class="imp-list">' +
        v.named.map(n => '<span>' + String(n.count).padStart(3) + '  ' + esc(n.label) + '</span>').join('') + '</div>' +
        (v.settled ? '<div class="hint">Settled into <b>' + v.kinds.map(k => esc(k.label)).join(', ') + '</b>' +
          (v.why ? ' — ' + esc(v.why) : '') + (v.folds && v.folds.length ? '<br>folded: ' + esc(v.folds.join(' · ')) : '') + '</div>'
          : '<div class="hint">The model could not settle these into one vocabulary, so the names it gave row by row are kept.</div>') +
      '</div>' : '') +

      (p.byKind.length ? '<div class="imp-sec"><h4>Kinds</h4><div class="imp-list">' +
        p.byKind.slice().sort((a,b) => b.claims - a.claims).map(k =>
          '<span>' + (k.slug ? '<span class="kind" style="--kh:' + k.hue + '">' + esc(k.label) + '</span>' : '<span class="kind none">not classified yet</span>') +
          '  ' + k.claims + '  ' + money0(k.claimed) + '</span>').join('') +
      '</div></div>' : '') +

      list('Repeated rows, merged into one claim', p.merged.map(m => 'rows ' + m.rows.join('+') + '  ' + m.invoice_no + ' / ' + m.container_no + '  ' + money0(m.claim_amount))) +
      list('One container, more than one claim', p.split.map(m => m.invoice_no + ' / ' + m.container_no + '  ' + money0(m.claim_amount))) +
      list('Not imported — prose where an identifier should be', p.manual.map(m => 'row ' + m.rowNo + '  ' + m.cells)) +
      list('Check these — the figures look like the columns are shifted', (p.misaligned || []).map(m => m.invoice_no + ' / ' + m.container_no + '  ' + m.why)) +
      list('Unit left blank, flagged for a person', p.noUnit.map(m => m.invoice_no + ' / ' + m.container_no + '  ' + m.why)) +
      list('Not classified — nothing guessed', p.unresolved.map(m => (m.container_no || m.invoice_no) + '  ' + m.why)) +

      '<div class="imp-sec"><h4>Every claim this will create</h4><div class="imp-tbl"><table><thead><tr>' +
        ['Container','Invoice','Customer','Supplier','Kind','Claimed','Recovery','Status','Why that kind'].map(h => '<th>' + h + '</th>').join('') +
      '</tr></thead><tbody>' +
        p.preview.map(r => '<tr>' +
          '<td class="mono">' + esc(r.container_no || '—') + '</td>' +
          '<td class="mono">' + esc(r.invoice_no || '—') + '</td>' +
          '<td>' + esc(r.customer || '—') + '</td>' +
          '<td>' + esc(r.supplier || '—') + '</td>' +
          '<td>' + (r.claim_type ? esc(r.kind || r.claim_type) : '<span style="color:var(--amber-500)">not classified</span>') + '</td>' +
          '<td class="mono">' + (r.claim_amount!=null ? money0(r.claim_amount) : '—') + '</td>' +
          '<td class="mono">' + (r.our_claim!=null ? money0(r.our_claim) : '—') + '</td>' +
          '<td>' + esc(r.status) + '</td>' +
          '<td class="w">' + esc(r.why || '') + '</td>' +
        '</tr>').join('') +
      '</tbody></table></div></div>' +

      '<div class="actions">' +
        (p.count ? '<button class="btn go" id="i_go" type="button">Import these ' + p.count + ' claims</button>'
                 : '<span class="hint" style="margin:0">Nothing new to import — every claim on this sheet is already in the register.</span>') +
        '<span class="hint" style="margin:0">No to-do, no WhatsApp.</span>' +
      '</div>';

    const go = $('#i_go', wrap);
    if (go) go.onclick = async () => {
      go.disabled = true; go.textContent = 'Importing…';
      try {
        const r = await api('/api/claims/import/commit', { planId: p.planId });
        close(); toast('Imported ' + r.created + ' claims.', 'ok'); await load();
      } catch (e) { go.disabled = false; go.textContent = 'Import these ' + p.count + ' claims'; toast(e.message, 'bad'); }
    };
  }
}

/* ── the vocabulary, and how to correct it ────────────────────────────────
   Nothing in this app decides which kinds exist — the model names them as it
   meets claims it has not seen before. The cost of that is drift: two names for
   one argument. This is the fix, and it is hers to make, not a synonym table's. */
function openVocab(){
  const kinds = STATE.kinds.slice().sort((a,b) => (b.count||0) - (a.count||0));
  const used = STATE.claims.reduce((o,c) => { const k = c.claim_type || ''; o[k] = (o[k]||0)+1; return o; }, {});
  const wrap = document.createElement('div');
  wrap.className = 'modal';
  wrap.innerHTML = '<div class="box"><h3>Kinds of claim in use</h3>' +
    '<div class="hint" style="margin-top:0">These were named by the model as it read your claims — there is no list of them in the code. Rename one into your own words, or fold two together when they are the same argument.</div>' +
    '<div class="vocab" style="margin-top:14px">' +
      (kinds.length ? kinds.map(k =>
        '<div class="vrow" data-slug="' + esc(k.slug) + '">' +
          '<span class="kind" style="--kh:' + (k.hue||210) + '">' + esc(k.label) + '</span>' +
          '<span class="cnt">' + (used[k.slug]||0) + ' claims</span>' +
          '<span class="act">' +
            '<input class="v_label" value="' + esc(k.label) + '" size="16">' +
            '<button class="btn v_ren" type="button" style="padding:4px 9px;font-size:12px">Rename</button>' +
            '<select class="v_into"><option value="">fold into…</option>' +
              kinds.filter(o => o.slug !== k.slug).map(o => '<option value="' + esc(o.slug) + '">' + esc(o.label) + '</option>').join('') +
            '</select>' +
            '<button class="btn v_mrg" type="button" style="padding:4px 9px;font-size:12px">Merge</button>' +
          '</span>' +
        '</div>').join('')
        : '<div class="hint">Nothing classified yet. Kinds appear here as claims arrive.</div>') +
      (used[''] ? '<div class="vrow"><span class="kind none">not classified yet</span><span class="cnt">' + used[''] + ' claims</span></div>' : '') +
    '</div>' +
    '<div class="actions"><button class="btn" id="v_close" type="button">Close</button></div></div>';
  document.body.appendChild(wrap);
  const close = () => wrap.remove();
  wrap.onclick = (e) => { if (e.target === wrap) close(); };
  $('#v_close', wrap).onclick = close;
  wrap.querySelectorAll('.vrow[data-slug]').forEach(row => {
    const slug = row.dataset.slug;
    const ren = row.querySelector('.v_ren'), mrg = row.querySelector('.v_mrg');
    if (ren) ren.onclick = async () => {
      const label = row.querySelector('.v_label').value.trim();
      if (!label) { toast('Give it a name.', 'bad'); return; }
      try { await api('/api/claim-kinds/rename', { slug, label }); close(); toast('Renamed.', 'ok'); await load(); }
      catch (e) { toast(e.message, 'bad'); }
    };
    if (mrg) mrg.onclick = async () => {
      const into = row.querySelector('.v_into').value;
      if (!into) { toast('Pick which kind to fold it into.', 'bad'); return; }
      try {
        const r = await api('/api/claim-kinds/merge', { from: slug, into });
        close(); toast('Merged — ' + r.moved + ' claim(s) moved over.', 'ok'); await load();
      } catch (e) { toast(e.message, 'bad'); }
    };
  });
}

async function load(announce){
  try {
    const j = await api('/api/claims');
    STATE.claims = j.claims || [];
    STATE.stats = j.stats || {};
    STATE.kinds = j.kinds || [];
    const wide = !(window.matchMedia && window.matchMedia('(max-width:1020px)').matches);
    if (!containers().some(g => g.key === STATE.sel)) STATE.sel = wide ? ((visible()[0] || {}).key || null) : null;
    renderChips(); renderStrip(); renderTabs(); renderRows(); renderDetail();
    if (announce) toast('Up to date.', 'ok');
  } catch (e) { toast('Could not load claims — ' + e.message, 'bad'); }
}

$('#q').oninput = (e) => { STATE.q = e.target.value; renderRows(); };
$('#fabNew').onclick = () => openNew();
$('#backList').onclick = () => { document.body.classList.remove('show-detail'); window.scrollTo(0, 0); };
/* a menu closes when you click away from it, as menus do */
document.addEventListener('click', (e) => {
  document.querySelectorAll('details.menu[open]').forEach(m => { if (!m.contains(e.target)) m.open = false; });
});
load();
</script>
