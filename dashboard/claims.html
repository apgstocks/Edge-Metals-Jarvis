<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claims — Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Design tokens copied from dashboard/quickbooks.html — standalone page, kept
   in sync by hand, same as the others. */
:root{
  --steel-900:#14181B; --steel-800:#1E2429; --steel-700:#2B3239; --steel-600:#3C454D;
  --steel-500:#57616A; --steel-400:#7E8891; --steel-300:#A7B0B7; --steel-200:#CBD1D6;
  --leaf-300:#7FD172; --leaf-400:#57BE49; --leaf-500:#3DA836; --leaf-600:#2E861F;
  --copper-300:#E29C68; --copper-400:#D77E3D;
  --green-500:#2F8F57; --amber-500:#D99A2B; --red-500:#C5402F; --blue-500:#3A6EA5;
  --bg-base:#0C0E10; --surface-card:#14181B; --surface-sunken:#0F1214; --surface-hover:#181D21;
  --text-strong:#FFFFFF; --text-body:#CBD1D6; --text-muted:#A7B0B7; --text-faint:#7E8891;
  --border-subtle:#1E2429; --border-default:#2B3239; --ring:var(--leaf-500);
  --font-display:'Archivo',sans-serif; --font-sans:'IBM Plex Sans',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:var(--font-sans);color:var(--text-body);background:var(--bg-base);-webkit-font-smoothing:antialiased;height:100vh;display:flex;flex-direction:column;overflow:hidden}
h1,h2,h3{font-family:var(--font-display);color:var(--text-strong);margin:0;font-weight:900;letter-spacing:-.02em}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.mono{font-family:var(--font-mono)}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--border-default);background:var(--surface-card);flex:none}
header h1{font-size:17px}
header .back{color:var(--steel-400);font-size:13px;text-decoration:none}
header .back:hover{color:var(--text-body)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center}
.chip{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:3px;border:1px solid var(--border-default);color:var(--text-muted);background:var(--surface-sunken);white-space:nowrap}
.chip.on{color:var(--leaf-300);border-color:var(--leaf-600);background:rgba(87,190,73,.10)}
.chip.warn{color:var(--amber-500);border-color:#5a4416;background:rgba(217,154,43,.10)}
.chip.bad{color:#f0b3aa;border-color:var(--red-500);background:rgba(197,64,47,.12)}
.chip.act{cursor:pointer}
.chip.act:hover{border-color:var(--text-body);color:var(--text-body)}

/* ── exposure strip ─────────────────────────────────────────────────────── */
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border-default);border-bottom:1px solid var(--border-default);flex:none}
.tile{background:var(--surface-card);padding:11px 16px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile .k{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-faint)}
.tile .v{font-family:var(--font-mono);font-size:21px;font-weight:600;color:var(--text-strong);line-height:1.15}
.tile .s{font-size:11.5px;color:var(--text-faint)}
.tile.net .v{color:var(--copper-300)}
.tile.rec .v{color:var(--leaf-300)}
.tile.todo .v{color:var(--amber-500)}

main{flex:1;display:grid;grid-template-columns:330px 1fr;min-height:0}
aside{border-right:1px solid var(--border-default);background:var(--surface-sunken);display:flex;flex-direction:column;min-height:0}
.search{padding:9px;border-bottom:1px solid var(--border-subtle);display:flex;gap:7px}
.search input{flex:1;padding:7px 9px;border-radius:4px;border:1px solid var(--border-default);background:var(--bg-base);color:var(--text-body);font-size:13px}
.search button{padding:7px 10px;border-radius:4px;border:1px solid var(--leaf-600);background:rgba(87,190,73,.14);color:var(--leaf-300);font-size:12px;font-weight:600}
.tabsel{display:flex;gap:4px;padding:0 9px 9px}
.tabsel button{flex:1;padding:5px 2px;border-radius:4px;border:1px solid var(--border-default);background:transparent;color:var(--text-muted);font-size:11px;font-weight:600}
.tabsel button.sel{background:rgba(87,190,73,.14);border-color:var(--leaf-600);color:var(--leaf-300)}
.rows{overflow-y:auto;flex:1;min-height:0}
.prow{padding:9px 12px;border-bottom:1px solid var(--border-subtle);cursor:pointer;display:flex;flex-direction:column;gap:3px}
.prow:hover{background:var(--surface-hover)}
.prow.sel{background:rgba(87,190,73,.09);box-shadow:inset 2px 0 0 var(--leaf-500)}
.prow .t{display:flex;align-items:baseline;gap:7px}
.prow .who{font-size:13px;font-weight:600;color:var(--text-strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .amt{margin-left:auto;font-family:var(--font-mono);font-size:12.5px;color:var(--text-body);white-space:nowrap}
.prow .b{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text-faint)}
.prow .cid{font-family:var(--font-mono);font-size:11px;color:var(--steel-400)}
.empty{padding:30px 16px;text-align:center;color:var(--text-faint);font-size:12.5px}

/* ── claim kind, and the per-container detail ─────────────────────────── */
/* ONE rule, not one per kind. The kinds are named by the model at run time, so
   the colour is derived from the slug (server-side hue) — a kind that first
   appears tonight is legible with no CSS to add. There is deliberately no list
   of kinds in this stylesheet. */
.kind{display:inline-flex;align-items:center;font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:3px;font-weight:600;white-space:nowrap;
  color:hsl(var(--kh,210) 55% 74%);background:hsl(var(--kh,210) 45% 17%);border:1px solid hsl(var(--kh,210) 30% 31%)}
.kind.none{color:var(--amber-500);background:rgba(217,154,43,.12);border-color:#5a4416;font-style:italic}
.vocab{display:flex;flex-direction:column;gap:7px}
.vrow{display:flex;align-items:center;gap:9px;font-size:12.5px}
.vrow .cnt{font-family:var(--font-mono);font-size:11px;color:var(--text-faint)}
.vrow .act{margin-left:auto;display:flex;gap:6px}
.vrow select,.vrow input{padding:4px 7px;border-radius:4px;border:1px solid var(--border-default);background:var(--bg-base);color:var(--text-body);font-size:12px}
/* ── importing a sheet ─────────────────────────────────────────────────── */
.modal .box.wide{max-width:900px}
.drop{border:1px dashed var(--border-default);border-radius:6px;padding:16px;text-align:center;color:var(--text-muted);font-size:13px;background:var(--surface-sunken)}
.drop.on{border-color:var(--leaf-500);color:var(--leaf-300)}
.drop input[type=file]{display:block;margin:9px auto 0;color:var(--text-muted);font-size:12px}
.imp-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--border-default);border:1px solid var(--border-default);border-radius:6px;overflow:hidden;margin-top:12px}
.imp-sum > div{background:var(--surface-card);padding:9px 12px;display:flex;flex-direction:column;gap:2px}
.imp-sum .k{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint)}
.imp-sum .v{font-family:var(--font-mono);font-size:16px;color:var(--text-strong)}
.imp-sum .v.hi{color:var(--copper-300)}
.imp-sec{margin-top:14px}
.imp-sec > h4{margin:0 0 6px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-faint);font-family:var(--font-sans);font-weight:700}
.imp-list{font-family:var(--font-mono);font-size:11.5px;color:var(--text-muted);max-height:150px;overflow-y:auto;display:flex;flex-direction:column;gap:3px}
.imp-tbl{max-height:260px;overflow:auto;border:1px solid var(--border-default);border-radius:6px;margin-top:6px}
.imp-tbl table{border-collapse:collapse;width:100%;font-size:11.5px;min-width:660px}
.imp-tbl th{position:sticky;top:0;background:var(--surface-sunken);text-align:left;padding:6px 8px;border-bottom:1px solid var(--border-default);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-faint)}
.imp-tbl td{padding:5px 8px;border-bottom:1px solid var(--border-subtle);white-space:nowrap}
.imp-tbl td.w{white-space:normal;color:var(--text-faint);font-style:italic;max-width:320px}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--border-default);border-top-color:var(--leaf-500);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
.kinds{display:flex;gap:4px;flex-wrap:wrap}
.csum{display:flex;gap:20px;flex-wrap:wrap;padding:11px 14px;border-radius:6px;background:var(--surface-sunken);border:1px solid var(--border-subtle);margin-top:12px}
.csum div{display:flex;flex-direction:column;gap:2px}
.csum .k{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-faint)}
.csum .v{font-family:var(--font-mono);font-size:15px;color:var(--text-strong)}
.csum .v.hi{color:var(--copper-300)}
.claim{border:1px solid var(--border-default);border-radius:7px;margin-top:14px;overflow:hidden}
.claim > .ch{display:flex;align-items:center;gap:9px;padding:10px 14px;background:var(--surface-sunken);border-bottom:1px solid var(--border-default);flex-wrap:wrap}
.claim > .ch .n{font-family:var(--font-mono);font-size:12px;color:var(--text-faint)}
.claim > .ch .amt{margin-left:auto;font-family:var(--font-mono);font-size:14px;color:var(--text-strong)}
.claim > .cb{padding:2px 14px 14px}
.claim .card{border:0;border-top:1px solid var(--border-subtle);border-radius:0;margin-top:0;padding:14px 0 12px;background:transparent}
.claim .card:first-child{border-top:0}
.why{font-size:11.5px;color:var(--text-faint);font-style:italic}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:3px;font-weight:600;white-space:nowrap}
.pill i{width:4px;height:4px;border-radius:50%;background:currentColor}
.s-unverified{color:var(--amber-500);background:rgba(217,154,43,.13)}
.s-verified{color:var(--blue-500);background:rgba(58,110,165,.16)}
.s-recovery_raised{color:var(--leaf-300);background:rgba(87,190,73,.13)}
.s-settled{color:var(--steel-300);background:rgba(126,136,145,.13)}
.s-rejected,.s-withdrawn{color:var(--steel-400);background:rgba(126,136,145,.09)}

section.detail{overflow-y:auto;min-height:0;padding:18px 22px 40px}
.dhead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--border-default)}
.dhead h2{font-size:20px}
.dhead .sub{font-family:var(--font-mono);font-size:12px;color:var(--text-faint);margin-top:4px}
.dhead .right{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card{background:var(--surface-card);border:1px solid var(--border-default);border-radius:6px;padding:14px 16px;margin-top:14px}
.card > h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);font-family:var(--font-sans);font-weight:700;margin-bottom:10px}
.card.flag{border-left:2px solid var(--amber-500)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-faint)}
label.f input,label.f select{padding:7px 9px;border-radius:4px;border:1px solid var(--border-default);background:var(--bg-base);color:var(--text-body);font-size:13px;font-family:var(--font-mono)}
label.f input:disabled{color:var(--steel-500)}
.units{display:flex;gap:5px}
.units button{flex:1;padding:7px 4px;border-radius:4px;border:1px solid var(--border-default);background:transparent;color:var(--text-muted);font-family:var(--font-mono);font-size:12.5px;font-weight:600}
.units button.sel{background:rgba(87,190,73,.16);border-color:var(--leaf-500);color:var(--leaf-300)}
.units button.need{border-color:var(--amber-500)}
.calc{margin-top:12px;padding:11px 13px;border-radius:5px;background:var(--surface-sunken);border:1px solid var(--border-subtle);display:flex;gap:22px;flex-wrap:wrap}
.calc div{display:flex;flex-direction:column;gap:2px}
.calc .k{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-faint)}
.calc .v{font-family:var(--font-mono);font-size:16px;color:var(--text-strong)}
.calc .v.hi{color:var(--copper-300)}
.calc .v.muted{color:var(--steel-500)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px;align-items:center}
.btn{padding:8px 14px;border-radius:4px;border:1px solid var(--border-default);background:var(--surface-sunken);color:var(--text-body);font-size:13px;font-weight:600}
.btn:hover{border-color:var(--text-muted)}
.btn.go{border-color:var(--leaf-500);background:rgba(87,190,73,.16);color:var(--leaf-300)}
.btn.go:disabled{opacity:.42;cursor:not-allowed}
.btn.warn{border-color:#5a4416;color:var(--amber-500)}
.btn.danger{border-color:var(--red-500);color:#f0b3aa}
.hint{font-size:12px;color:var(--text-faint);margin-top:9px;line-height:1.55}
.hint b{color:var(--amber-500);font-weight:600}

.quotes{display:flex;flex-direction:column;gap:9px}
.q{display:grid;grid-template-columns:132px 1fr;gap:10px;align-items:start}
.q .qk{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-faint);padding-top:2px}
.q .qv{font-size:12.5px;color:var(--text-body);border-left:2px solid var(--border-default);padding-left:10px;font-style:italic}
.trail{display:flex;flex-direction:column;gap:8px}
.mailrow{display:flex;gap:10px;font-size:12px;align-items:baseline}
.mailrow .d{font-family:var(--font-mono);color:var(--steel-400);white-space:nowrap;font-size:11px}
.mailrow .s{color:var(--text-body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mailrow .f{color:var(--text-faint);white-space:nowrap}
.hist{font-size:11.5px;color:var(--text-faint);display:flex;flex-direction:column;gap:4px;font-family:var(--font-mono)}
.blank{display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;height:100%;color:var(--text-faint);font-size:13px}

/* z-index 80, ABOVE .modal's 60. It was 50, which put every error message behind
   the modal that caused it: the import spun, failed, and cleared itself with no
   visible explanation. A failure that looks like nothing happening is worse than
   a failure. */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;padding:10px 16px;border-radius:5px;background:var(--surface-card);border:1px solid var(--border-default);color:var(--text-body);font-size:13px;box-shadow:0 8px 28px rgba(0,0,0,.55);z-index:80;max-width:560px}
.toast.bad{border-color:var(--red-500);color:#f0b3aa}
.toast.ok{border-color:var(--leaf-600);color:var(--leaf-300)}
.modal{position:fixed;inset:0;background:rgba(6,8,9,.72);display:flex;align-items:center;justify-content:center;z-index:60;padding:18px}
.modal .box{background:var(--surface-card);border:1px solid var(--border-default);border-radius:7px;padding:18px 20px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto}
.modal h3{font-family:var(--font-display);font-size:16px;color:var(--text-strong);margin-bottom:12px}

/* ══ THE 2026-10-10 LAYOUT ═══════════════════════════════════════════════════
   Apsara: "Claim page looks very ugly. it is not user friendly right now" and
   "It should be professional, helpful, most user friendly easing the users work
   in every way". Built to the design she approved on the canvas.
   Everything above this line is kept because the modals (new claim, scan,
   import, kinds, report) still use it; the rules below lay out the page. */
body{height:auto;min-height:100vh;overflow:auto;display:block;font-size:14px;line-height:1.5}
.wrap{max-width:1400px;margin:0 auto;padding:26px 28px 60px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:0;border:0;background:transparent;margin-bottom:18px;flex-wrap:wrap}
header.top .back{display:inline-block;margin-bottom:8px;font-size:12.5px}
header.top .eyebrow{font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--copper-300)}
header.top h1{font-size:32px;line-height:1.05;margin-top:4px}
header.top .lede{color:var(--text-muted);font-size:13.5px;margin-top:6px}
.acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.b{height:40px;padding:0 16px;border-radius:4px;border:1px solid var(--border-default);background:var(--surface-card);color:var(--text-body);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.b:hover{border-color:var(--steel-500);color:#fff}
.b.pri{background:var(--leaf-600);border-color:var(--leaf-600);color:#fff;font-weight:700}
.b.pri:hover{background:var(--leaf-500);border-color:var(--leaf-500)}
.b.sm{height:34px;padding:0 12px;font-size:12.5px}
.b.xs{height:30px;padding:0 10px;font-size:12px}
.b:disabled{opacity:.45;cursor:not-allowed}
.b svg{width:16px;height:16px;flex:none}

/* a menu is a <details>: keyboard and screen readers get it for free */
details.menu{position:relative}
details.menu > summary{list-style:none}
details.menu > summary::-webkit-details-marker{display:none}
details.menu .pop{position:absolute;right:0;top:calc(100% + 6px);min-width:250px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:6px;box-shadow:0 14px 34px rgba(0,0,0,.5);padding:6px;z-index:30}
details.menu .pop button,details.menu .pop a{display:block;width:100%;text-align:left;padding:9px 12px;border:0;border-radius:4px;background:transparent;color:var(--text-body);font-size:13px;text-decoration:none}
details.menu .pop button:hover,details.menu .pop a:hover{background:var(--steel-800);color:#fff}
details.menu .pop .sub{display:block;color:var(--text-faint);font-size:11.5px;margin-top:1px}
details.menu .pop hr{border:0;border-top:1px solid var(--border-subtle);margin:4px 0}

.wait{display:flex;align-items:center;justify-content:space-between;gap:14px;border-radius:6px;padding:12px 16px;margin-bottom:16px;flex-wrap:wrap}
.wait.on{background:rgba(194,94,34,.12);border:1px solid rgba(215,126,61,.45)}
.wait.ok{background:rgba(61,168,54,.08);border:1px solid rgba(61,168,54,.35)}
.wait .dot{width:8px;height:8px;border-radius:50%;background:var(--copper-300);flex:none}
.wait.ok .dot{background:var(--leaf-400)}
.wait strong{color:#fff}
.wait .what{color:var(--text-body)}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:6px;padding:15px 18px}
.kpi .k{font-size:12.5px;color:var(--text-muted);font-weight:500}
.kpi .v{font-family:var(--font-mono);font-size:25px;font-weight:600;line-height:1.2;margin-top:6px;color:#fff}
.kpi .s{font-size:12px;color:var(--text-faint);margin-top:3px}
.kpi.got .v{color:var(--leaf-300)}
.kpi.loss .v{color:var(--copper-300)}
.kpi.todo .v{color:var(--amber-500)}

.cols{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px;align-items:start}
.listp{background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:6px;overflow:hidden;position:sticky;top:14px;max-height:calc(100vh - 28px);display:flex;flex-direction:column}
.listp .search{padding:12px;border:0;display:block}
.listp .search input{width:100%;height:40px;padding:0 12px;border-radius:4px;border:1px solid var(--border-default);background:var(--surface-sunken);color:#fff;font-size:13.5px}
.tabs{display:flex;padding:0 10px;border-bottom:1px solid var(--border-subtle);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 9px 9px;font-size:12.5px;font-weight:600;color:var(--text-muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.sel{color:#fff;border-bottom-color:var(--leaf-400)}
.tabs button .n{font-family:var(--font-mono);font-size:11px;padding:1px 6px;border-radius:9px;margin-left:4px;background:var(--steel-800);color:var(--text-muted)}
.tabs button.sel .n{background:var(--leaf-600);color:#fff}
.listp .rows{overflow-y:auto}

<body>

<div class="wrap">
<header class="top">

    <a class="back" href="/">&larr; Jarvis</a>

<main class="cols">
  <aside class="listp">
    <div class="search">
      <input id="q" type="search" placeholder="Search container, invoice, customer, supplier" aria-label="Search claims">
    </div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Which claims"></div>
    <div class="rows" id="rows"></div>
  </aside>
  <section class="detailp">
    <button type="button" class="b sm back2" id="backList">&larr; All claims</button>
    <div id="detail"></div>
  </section>
</main>
</div>

<button type="button" class="b pri" id="fabNew">+ New claim</button>

<script>
/* Claims, grouped the way a container actually is: one container can carry a
   weight shortage AND a grade downgrade AND foreign material, each with its own
   figure, its own supplier recovery and its own status. Apsara, 2026-09-26:
   "Not all the container have same kind of claim .. put it into website per
   container basis." */
const MT = { MT:1, LB:1/2204.62, KG:1/1000 };
const STATE = { claims:[], stats:{}, kinds:[], sel:null, tab:'needs', q:'' };
const $ = (s, root) => (root || document).querySelector(s);
const esc = (s) => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = (n) => (n===null||n===undefined||n==='') ? '—' : '$' + Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const numOf = (v) => { if (v===null||v===undefined||v==='') return null; const n = Number(String(v).replace(/[$,\s]/g,'')); return Number.isFinite(n) ? n : null; };
/* The vocabulary comes from the server, which got it from the model. A slug with
   no entry yet still reads sensibly; a claim with no kind at all says so. */
const kindOf = (t) => STATE.kinds.find(k => k.slug === t) || null;
const kindLabel = (t) => { if (!t) return 'not classified yet'; const k = kindOf(t); return k ? k.label : String(t).replace(/_/g,' '); };
const kindHue = (t) => { const k = kindOf(t); return k && typeof k.hue === 'number' ? k.hue : 210; };

async function api(url, body){
  const r = await fetch(url, body ? { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) } : {});
  const j = await r.json().catch(() => ({ error:'bad response' }));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
let toastTimer = null;
function toast(msg, kind){
  const old = $('.toast'); if (old) old.remove();
  const d = document.createElement('div');
  d.className = 'toast' + (kind ? ' ' + kind : '');
  d.textContent = msg;
  document.body.appendChild(d);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => d.remove(), kind === 'bad' ? 7000 : 3500);
}

/* the shortage maths, mirroring helpers/claims.js verify() so the preview
   cannot disagree with what the server will store */
function compute({ inv, recv, unit, rate, rateUnit }){
  const out = { shortage:null, pct:null, amount:null };
  if (inv===null || recv===null || !unit) return out;
  out.shortage = Math.round((inv - recv) * 1e6) / 1e6;
  if (inv > 0) out.pct = Math.round((out.shortage / inv) * 10000) / 100;
  if (rate !== null && MT[rateUnit]) {
    const inRate = rateUnit === unit ? out.shortage : (out.shortage * MT[unit]) / MT[rateUnit];
    out.amount = Math.round(inRate * rate * 100) / 100;
  }
  return out;
}

/* ── containers ─────────────────────────────────────────────────────────── */
const containerKey = (c) => String(c.container_no || c.invoice_no || '—').toUpperCase();
function containers(){
  const map = new Map();
  for (const c of STATE.claims){
    const k = containerKey(c);
    if (!map.has(k)) map.set(k, { key:k, container:c.container_no||'', claims:[] });
    map.get(k).claims.push(c);
  }
  for (const g of map.values()){
    g.customer = (g.claims.find(c => c.customer) || {}).customer || '';
    g.invoices = [...new Set(g.claims.map(c => c.invoice_no).filter(Boolean))];
    g.suppliers = [...new Set(g.claims.map(c => c.supplier).filter(Boolean))];
    g.kinds = [...new Set(g.claims.map(c => c.claim_type || 'other'))];
    g.claimed = g.claims.reduce((t,c) => t + (numOf(c.claim_amount)||0), 0);
    g.recovered = g.claims.reduce((t,c) => t + (numOf(c.our_claim)||0), 0);
    g.net = g.claimed - g.recovered;
    g.needs = g.claims.filter(c => c.status === 'unverified' || (c.status === 'verified' && !numOf(c.our_claim))).length;
    g.newest = g.claims.map(c => c.created_at || '').sort().pop() || '';
  }
  return [...map.values()];
}

const TABS = [
  { id:'needs',  label:'Needs you' },
  { id:'multi',  label:'2+ claims' },
  { id:'open',   label:'Open' },
  { id:'all',    label:'All' },
];
function inTab(g){
  if (STATE.tab === 'needs') return g.needs > 0;
  if (STATE.tab === 'multi') return g.claims.length > 1;
  if (STATE.tab === 'open')  return g.claims.some(c => !['settled','rejected','withdrawn'].includes(c.status));
  return true;
}
function visible(){
  const q = STATE.q.trim().toLowerCase();
  return containers().filter(g => {
    if (!inTab(g)) return false;
    if (!q) return true;
    const hay = [g.key, g.customer, g.invoices.join(' '), g.suppliers.join(' '), g.kinds.map(kindLabel).join(' '),
      g.claims.map(c => c.note).join(' ')].join(' ').toLowerCase();
    return hay.includes(q);
  }).sort((a,b) => (b.needs - a.needs) || (b.claimed - a.claimed) || b.newest.localeCompare(a.newest));
}

function pill(s){
  const c = s === 'Settled' ? '' : '';
  const cls = s === 'settled' ? 'p-settled' : s === 'unverified' ? 'p-open' : s === 'verified' ? 's-verified' : s === 'recovery_raised' ? 's-recovery_raised' : 'p-dropped';
  const label = s === 'recovery_raised' ? 'recovery raised' : s === 'withdrawn' ? 'withdrawn' : s;
  return '<span class="pill ' + cls + '"><i></i>' + esc(label) + '</span>';
}
const kindChip = (t) => t
  ? '<span class="kind" style="--kh:' + kindHue(t) + '" title="' + esc(kindLabel(t)) + '">' + esc(kindLabel(t)) + '</span>'
  : '<span class="kind none">not classified yet</span>';

/* ══ THE PAGE, 2026-10-10 ═════════════════════════════════════════════════
   Apsara: "It should be professional, helpful, most user friendly easing the
   users work in every way." What that means here, in order:
     · one obvious next step on every claim, with the button for it;
     · nothing worked out by hand — the fair figure and the gap to what the
       customer asked appear as she types;
     · nothing typed is lost when the page refreshes after another action;
     · closing a claim is kept away from the main button and asks twice.
   The maths and the per-container grouping above are unchanged. */

/* ── how the money is worked out: a closed set, kept apart from the KIND ──
   The kind is the model's free-form name (and she renames and merges them);
   the assessment is which arithmetic applies. A claim never assessed is a
   weight claim, which is what every claim before 2026-10-10 was. */
const ASSESS = [
  { id:'weight',        label:'Weight shortage' },
  { id:'contamination', label:'Foreign material' },
  { id:'grade',         label:'Grade downgrade' },
];
const FINDINGS = [
  ['dirt','Dirt / soil'], ['rubber_plastic','Rubber / plastic'], ['iron_attached','Iron or steel attached'],
  ['oil_moisture','Oil / moisture'], ['other_metals','Other metals mixed in'], ['wood_paper','Wood / paper'],
  ['sealed_hazard','Sealed items — radioactive or explosive'],
];
const MEASURED = [
  ['surveyor','Independent surveyor'], ['split_sample','Split sample / lab'],
  ['sorted_weighed','Sorted and weighed'], ['photos_only','Customer photos only'],
];
/* What each method is worth in an argument. An inspector "won't guarantee
   anything they haven't viewed or witnessed" — photos alone rarely hold. */
const STRENGTH = {
  surveyor:       ['Strong', 'good', 'an independent survey settles most disputes'],
  split_sample:   ['Strong', 'good', 'both sides hold the same sample'],
  sorted_weighed: ['Medium', 'warn', 'their own sort — ask to witness it or re-weigh'],
  photos_only:    ['Weak',   'bad',  'photos alone rarely hold — ask for a survey or a split sample'],
};
const QUICK = ['Photos attached', 'Surveyor appointed', 'Asked for a split sample', 'Customer agreed on a call', 'Supplier informed'];

/* Edits she has typed but not saved, per claim, so a refresh caused by
   another action does not wipe them. Cleared once that claim is saved. */
STATE.drafts = {};
STATE.pick = {};

function assessOf(c){
  if (STATE.pick[c.id] && STATE.pick[c.id].assessment) return STATE.pick[c.id].assessment;
  if (c.assessment) return c.assessment;
  /* the last time a claim of this kind was assessed, use the same arithmetic —
     learned from her own choices, never from a list of kind names */
  const prev = STATE.claims.filter(x => x.id !== c.id && x.claim_type && x.claim_type === c.claim_type && x.assessment)
    .sort((a,b) => String(b.updated_at||'').localeCompare(String(a.updated_at||'')))[0];
  return prev ? prev.assessment : 'weight';
}
function pickOf(c){
  if (!STATE.pick[c.id]) STATE.pick[c.id] = {
    findings: Array.isArray(c.findings) ? c.findings.slice() : [],
    measured_by: c.measured_by || null,
    unit: c.weight_unit || null,
  };
  return STATE.pick[c.id];
}

/* the weight maths with an optional contract tolerance — compute() is the
   server's verify() maths and is left exactly as the test lifts it */
function computeWeight(f){
  const r = compute(f);
  r.claimable = null;
  if (r.shortage !== null && f.tol !== null && f.tol !== undefined && f.inv !== null) {
    r.claimable = Math.max(0, Math.round((r.shortage - f.inv * f.tol / 100) * 1e6) / 1e6);
    if (f.rate !== null && MT[f.rateUnit]) {
      const q = f.rateUnit === f.unit ? r.claimable : (r.claimable * MT[f.unit]) / MT[f.rateUnit];
      r.amount = Math.round(q * f.rate * 100) / 100;
    }
  }
  return r;
}
/* mirrors claims.assess() for contamination */
function computeContam({ inv, pct, unit, rate, rateUnit }){
  const out = { weight:null, amount:null };
  if (inv === null || pct === null || !unit) return out;
  out.weight = Math.round(inv * pct / 100 * 1e6) / 1e6;
  if (rate !== null && MT[rateUnit]) {
    const q = rateUnit === unit ? out.weight : (out.weight * MT[unit]) / MT[rateUnit];
    out.amount = Math.round(q * rate * 100) / 100;
  }
  return out;
}
/* mirrors claims.assess() for a downgrade */
function computeGrade({ w, sold, recv }){
  if (w === null || sold === null || recv === null) return { gap:null, amount:null };
  return { gap: Math.round((sold - recv) * 100) / 100, amount: Math.round(w * (sold - recv) * 100) / 100 };
}

const icon = (d) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + d + '"/></svg>';

function renderChips(){
  const s = STATE.stats || {};
  /* The old row of eight look-alike chips became ONE primary action, one
     secondary, and a menu for the occasional ones. */
  $('#chips').innerHTML =
    '<button type="button" class="b scanlbl" id="scanBtn" title="Photograph a surveyor report or a customer claim letter and let the model fill the form">' + icon('M4 8V5a1 1 0 0 1 1-1h3 M16 4h3a1 1 0 0 1 1 1v3 M20 16v3a1 1 0 0 1-1 1h-3 M8 20H5a1 1 0 0 1-1-1v-3 M8 12h8') + 'Scan a document</button>' +
    '<button type="button" class="b pri" id="newBtn" title="Enter a claim that came in by phone or WhatsApp">+ New claim</button>' +
    '<details class="menu" id="moreMenu"><summary class="b" role="button" aria-label="More actions">More ▾</summary><div class="pop">' +
      '<button type="button" id="repBtn">Claim report for a supplier<span class="sub">every claim for one supplier, as a PDF or Excel</span></button>' +
      '<button type="button" id="impBtn">Import sheet</button>' +
      '<button type="button" id="vocab">Kinds of claim (' + (STATE.kinds.length || 0) + ')</button>' +
      '<hr><button type="button" id="refresh">Refresh</button>' +
    '</div></details>';
  const closeMenu = () => { const m = $('#moreMenu'); if (m) m.open = false; };
  $('#scanBtn').onclick = () => { closeMenu(); openScan(); };
  $('#newBtn').onclick = () => openNew();

function renderStrip(){
  const s = STATE.stats || {};
  const todo = (s.unverified || 0) + (s.awaiting_recovery || 0);
  const parts = [];
  if (s.unverified) parts.push(s.unverified + (s.unverified === 1 ? ' claim' : ' claims') + ' to assess');
  if (s.awaiting_recovery) parts.push(s.awaiting_recovery + (s.awaiting_recovery === 1 ? ' recovery' : ' recoveries') + ' not raised with the supplier');
  $('#wait').innerHTML = todo
    ? '<div class="wait on"><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><span class="dot"></span><strong>' + todo + (todo === 1 ? ' thing is' : ' things are') + ' waiting on you</strong><span class="what">' + esc(parts.join(' · ')) + '</span></div>' +
      '<button type="button" class="b sm" id="showMe">Show me</button></div>'
    : '<div class="wait ok"><div style="display:flex;align-items:center;gap:12px"><span class="dot"></span><strong>Nothing is waiting on you</strong><span class="what">every claim has been assessed and every recovery raised</span></div></div>';
  const sm = $('#showMe');
  if (sm) sm.onclick = () => { STATE.tab = 'needs'; renderTabs(); renderRows(); const first = visible()[0]; if (first) pickContainer(first.key); };
  $('#strip').innerHTML = [
    ['Customers claimed', money(s.claimed), (s.containers||0) + ' containers · ' + (s.total||0) + ' claims', ''],
    ['Got back from suppliers', money(s.recovered), (s.recovery_rate||0) + '% of what was claimed', 'got'],
    ['Edge’s loss so far', money(s.net), 'claimed minus got back', 'loss'],
    ['Waiting on you', String(todo), (s.unverified||0) + ' to assess · ' + (s.awaiting_recovery||0) + ' to recover', 'todo'],
  ].map(t => '<div class="kpi ' + t[3] + '"><div class="k">' + t[0] + '</div><div class="v">' + t[1] + '</div><div class="s">' + t[2] + '</div></div>').join('');
}

function renderTabs(){
  const all = containers();
  $('#tabs').innerHTML = TABS.map(t => {
    const keep = STATE.tab; STATE.tab = t.id;
    const n = all.filter(inTab).length;
    STATE.tab = keep;
    return '<button type="button" role="tab" aria-selected="' + (STATE.tab===t.id) + '" data-t="' + t.id + '" class="' + (STATE.tab===t.id?'sel':'') + '">' + t.label + '<span class="n">' + n + '</span></button>';
  }).join('');
  $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => { STATE.tab = b.dataset.t; renderTabs(); renderRows(); });

/* one line of plain English for where a container stands */
function rowStatus(g){
  if (g.claims.every(c => ['settled','rejected','withdrawn'].includes(c.status))) return ['Closed', 'done'];
  const unv = g.claims.filter(c => c.status === 'unverified').length;
  if (unv) return [unv + ' to assess', 'todo'];
  if (g.claims.some(c => c.status === 'verified' && !numOf(c.our_claim))) return ['Recovery not raised', 'todo'];
  return ['Waiting on supplier', 'wait'];
}

function pickContainer(key){
  STATE.sel = key;
  document.body.classList.add('show-detail');
  renderRows(); renderDetail();
  if (window.matchMedia && window.matchMedia('(max-width:1020px)').matches) window.scrollTo(0, 0);
}

function renderRows(){
  const rows = visible();
  if (!rows.length){
    $('#rows').innerHTML = '<div class="empty">' + (STATE.q ? 'Nothing matches “' + esc(STATE.q) + '”.' : STATE.tab === 'needs' ? 'Nothing needs you right now.' : 'No containers here.') + '</div>';
    return;
  }
  $('#rows').innerHTML = rows.map(g => {
    const amt = g.claimed > 0 ? money(g.claimed) : '—';
    const st = rowStatus(g);
    return '<button type="button" class="prow ' + (STATE.sel===g.key?'sel':'') + '" data-k="' + esc(g.key) + '"' + (STATE.sel===g.key?' aria-current="true"':'') + '>' +
      '<span class="t"><span class="who">' + esc(g.customer || 'Customer not named') + '</span><span class="amt">' + amt + '</span></span>' +
      '<span class="m"><span class="cid">' + esc(g.key) + '</span>' +
        (g.claims.length > 1 ? '<span class="cid">· ' + g.claims.length + ' claims</span>' : '') +
        '<span class="st ' + st[1] + '">' + esc(st[0]) + '</span></span>' +
      '<span class="kinds">' + g.kinds.map(kindChip).join('') + '</span>' +
    '</button>';
  }).join('');
  $('#rows').querySelectorAll('.prow').forEach(el => { el.onclick = () => pickContainer(el.dataset.k); });
}

const FLAG_TEXT = {
  unit_not_stated: 'No unit was stated, so nothing is worked out. A guess between MT and pounds is out by 2204x.',
  container_unknown: 'A container number was found but did not match cleanly. Check it against the invoice.',
  figure_changed: 'The customer has moved their own figure since an earlier mail. Read the trail before agreeing anything.',
  supplier_unknown: 'No supplier on this claim, so there is nobody to recover from. The whole amount lands on Edge.',
};

/* where a claim stands, as four steps */
function stage(c){
  if (c.status === 'unverified') return 1;
  if (c.status === 'verified') return 2;
  if (c.status === 'recovery_raised') return 3;
  return 4;
}
function lifeBar(c){
  const steps = ['Received', 'Assess', 'Recover', 'Settle'];
  const now = stage(c);
  const closed = ['rejected','withdrawn'].includes(c.status);
  return '<div class="life" role="img" aria-label="' + (closed ? 'Closed — ' + esc(c.status) : 'Step ' + (now + 1) + ' of 4: ' + steps[Math.min(now,3)]) + '">' +
    steps.map((s, i) => {
      const cls = closed ? (i === 0 ? 'done' : 'closed') : i < now ? 'done' : i === now ? 'now' : '';
      return (i ? '<span class="bar' + (!closed && i <= now ? ' on' : '') + '"></span>' : '') +
        '<span class="stp ' + cls + '"><span class="dot">' + (cls === 'done' ? '✓' : (i + 1)) + '</span><span class="lbl">' + s + '</span></span>';
    }).join('') + '</div>';
}
function nextLine(c){
  if (c.status === 'unverified') return '<b>Next:</b> assess the claim below — the figure is worked out as you type.';
  if (c.status === 'verified' && !numOf(c.our_claim)) return '<b>Next:</b> raise the recovery with ' + esc(c.supplier || 'the supplier') + ' — this is where money is lost when nobody does it.';
  if (c.status === 'verified') return '<b>Next:</b> raise the recovery so it stops showing as unasked.';
  if (c.status === 'recovery_raised') return '<b>Waiting on ' + esc(c.supplier || 'the supplier') + '.</b> Mark it settled when the money is agreed.';
  if (c.status === 'settled') return '<b>Settled.</b> Nothing left to do.';
  return '<b>Closed — ' + esc(c.status) + '.</b>';
}

function snapshotDrafts(){
  document.querySelectorAll('.claim[data-cid]').forEach(el => {
    const d = {};
    el.querySelectorAll('[data-k]').forEach(i => { d[i.dataset.k] = i.value; });
    const open = [...el.querySelectorAll('details.sec[data-sec]')].reduce((o, x) => { o[x.dataset.sec] = x.open; return o; }, {});
    STATE.drafts[el.dataset.cid] = { values: d, open };
  });
}
function restoreDrafts(){
  document.querySelectorAll('.claim[data-cid]').forEach(el => {
    const d = STATE.drafts[el.dataset.cid];
    if (!d) return;
    el.querySelectorAll('[data-k]').forEach(i => { if (d.values[i.dataset.k] !== undefined) i.value = d.values[i.dataset.k]; });
    el.querySelectorAll('details.sec[data-sec]').forEach(x => { if (d.open[x.dataset.sec] !== undefined) x.open = d.open[x.dataset.sec]; });
  });
}
function savedClaim(id){ delete STATE.drafts[id]; delete STATE.pick[id]; }

      (g.claims.length > 1 ? '<div class="why3">' + g.claims.length + ' claims on this container. They are rarely the same kind — three different arguments with the customer and three different recoveries from the supplier — so each is worked out on its own.</div>' : '') +
      '</div>' +
      '<div class="acts">' + reportMenu(g) + '<button type="button" class="b sm" id="addClaim">+ another claim</button></div></div>' +
      '<div class="csum2">' +
        '<div><div class="k">Claims</div><div class="v">' + g.claims.length + '</div></div>' +
        '<div><div class="k">Customer claimed</div><div class="v">' + money(g.claimed) + '</div></div>' +
        '<div><div class="k">Got back</div><div class="v got">' + money(g.recovered) + '</div></div>' +
        '<div><div class="k">Edge’s loss</div><div class="v loss">' + money(g.net) + '</div></div>' +
      '</div></div>' +
    g.claims.map((c, i) => claimCard(c, i, g)).join('');

  restoreDrafts();
  g.claims.forEach(c => wireClaim(c));
  const add = $('#addClaim');
  if (add) add.onclick = () => openNew({ container_no: g.container || g.key, customer: g.customer, invoice_no: g.invoices[0] || '' });
}

function readCard(el){
  const sel = el.querySelector('.f_unit button.sel');
  return {
    inv: numOf(el.querySelector('.f_inv').value),
    recv: numOf(el.querySelector('.f_recv').value),
    unit: sel ? sel.dataset.u : null,
    rate: numOf(el.querySelector('.f_rate').value),
    rateUnit: el.querySelector('.f_rateUnit').value,
    tol: numOf(el.querySelector('.f_tol').value),
  };
}
function gapLine(ours, asked){
  if (ours === null || asked === null || asked === undefined) return '';
  const d = Math.round((asked - ours) * 100) / 100;
  if (Math.abs(d) < 0.005) return '<span class="s2 good">exactly what they ask</span>';
  return d > 0 ? '<span class="s2 warn">' + money(d) + ' less than they ask</span>' : '<span class="s2 bad">' + money(-d) + ' more than they ask — check the figures</span>';
}
function renderCalc(el){
  const c = STATE.claims.find(x => x.id === el.dataset.cid) || {};
  const f = readCard(el);
  const r = computeWeight(f);
  el.querySelector('.c_w').innerHTML = [
    ['Short by', r.shortage === null ? '—' : r.shortage.toFixed(3) + (f.unit ? ' ' + f.unit : ''), r.shortage===null?'muted':'', r.pct !== null && r.pct >= 2 ? '<span class="s2 warn">' + r.pct.toFixed(2) + '% of what we invoiced</span>' : (r.pct !== null ? '<span class="s2">' + r.pct.toFixed(2) + '% of what we invoiced</span>' : '')],
    ['Claimable after tolerance', r.claimable === null ? '—' : r.claimable.toFixed(3) + ' ' + f.unit, r.claimable===null?'muted':'', r.claimable === null ? '<span class="s2">no tolerance set</span>' : ''],
    ['Fair claim, by our numbers', r.amount === null ? '—' : money(r.amount), r.amount===null?'muted':'hi', gapLine(r.amount, numOf(c.stated_claim_amount))],
  ].map(x => '<div><span class="k">' + x[0] + '</span><span class="v ' + x[2] + '">' + x[1] + '</span>' + x[3] + '</div>').join('');
  const why = !f.unit ? 'Pick the unit first.'
    : (f.inv === null || f.recv === null) ? 'Both weights are needed.'
    : f.rate === null ? 'Without a rate this records the shortage but no amount.' : '';
  el.querySelector('#why').textContent = why;
  el.querySelector('.f_verify').disabled = !f.unit || f.inv === null || f.recv === null;

  /* contamination */
  const pk = pickOf(c);
  const cc = computeContam({ inv: numOf(el.querySelector('.f_cinv').value), pct: numOf(el.querySelector('.f_apct').value), unit: f.unit,
    rate: numOf(el.querySelector('.f_crate').value), rateUnit: el.querySelector('.f_crateUnit').value });
  const ev = STRENGTH[pk.measured_by];
  el.querySelector('.c_c').innerHTML =
    '<div><span class="k">Weight that was not metal</span><span class="v ' + (cc.weight===null?'muted':'') + '">' + (cc.weight === null ? '—' : cc.weight.toFixed(3) + ' ' + f.unit) + '</span></div>' +
    '<div><span class="k">Fair claim, by our numbers</span><span class="v ' + (cc.amount===null?'muted':'hi') + '">' + (cc.amount === null ? '—' : money(cc.amount)) + '</span>' + gapLine(cc.amount, numOf(c.stated_claim_amount)) + '</div>' +
    '<div><span class="k">Evidence strength</span><span class="v ' + (ev ? ev[1] : 'muted') + '">' + (ev ? ev[0] : '—') + '</span><span class="s2">' + (ev ? esc(ev[2]) : 'say how it was measured') + '</span></div>';
  const cWhy = !f.unit ? 'Pick the unit first.' : numOf(el.querySelector('.f_cinv').value) === null ? 'The net weight invoiced is needed.'
    : numOf(el.querySelector('.f_apct').value) === null ? 'Say what share Edge accepts.' : '';
  el.querySelector('.c_why').textContent = cWhy;
  el.querySelector('.f_assess[data-kind="contamination"]').disabled = !!cWhy;

  /* grade */
  const gg = computeGrade({ w: numOf(el.querySelector('.f_gw').value), sold: numOf(el.querySelector('.f_gps').value), recv: numOf(el.querySelector('.f_gpr').value) });
  el.querySelector('.c_g').innerHTML =
    '<div><span class="k">Price gap</span><span class="v ' + (gg.gap===null?'muted':(gg.gap < 0 ? 'bad' : '')) + '">' + (gg.gap === null ? '—' : money(gg.gap) + (f.unit ? ' /' + f.unit : '')) + '</span>' + (gg.gap !== null && gg.gap < 0 ? '<span class="s2 bad">the received grade is worth more — not a downgrade</span>' : '') + '</div>' +
    '<div><span class="k">Fair claim, by our numbers</span><span class="v ' + (gg.amount===null?'muted':'hi') + '">' + (gg.amount === null || gg.gap < 0 ? '—' : money(gg.amount)) + '</span>' + (gg.gap >= 0 ? gapLine(gg.amount, numOf(c.stated_claim_amount)) : '') + '</div>';
  const gWhy = !f.unit ? 'Pick the unit first.' : gg.gap === null ? 'The weight affected and both prices are needed.' : gg.gap < 0 ? 'The prices are the wrong way round.' : '';
  el.querySelector('.g_why').textContent = gWhy;
  el.querySelector('.f_assess[data-kind="grade"]').disabled = !!gWhy;
}

function wireClaim(c){
  const el = document.querySelector('.claim[data-cid="' + c.id + '"]');
  if (!el) return;
  const pk = pickOf(c);
  el.querySelectorAll('input.num,.f_rateUnit,.f_crateUnit').forEach(i => { i.oninput = () => renderCalc(el); i.onchange = () => renderCalc(el); });
  el.querySelectorAll('.f_unit button').forEach(b => b.onclick = () => {
    el.querySelectorAll('.f_unit button').forEach(x => { x.classList.remove('sel'); x.classList.remove('need'); });
    b.classList.add('sel'); pk.unit = b.dataset.u;
    const nf = el.querySelector('[data-flag="unit_not_stated"]'); if (nf) nf.hidden = true;
    renderCalc(el);
  });
  /* switching the arithmetic is remembered for the claim the moment it is saved */
  el.querySelectorAll('.f_as').forEach(b => b.onclick = () => {
    STATE.pick[c.id] = Object.assign(pk, { assessment: b.dataset.a });
    el.querySelectorAll('.f_as').forEach(x => { const on = x === b; x.classList.toggle('sel', on); x.setAttribute('aria-checked', on); });
    el.querySelectorAll('.pane').forEach(p => { p.hidden = p.dataset.pane !== b.dataset.a; });
    renderCalc(el);
  });
  el.querySelectorAll('.f_found button').forEach(b => b.onclick = () => {
    const f = b.dataset.f, i = pk.findings.indexOf(f);
    if (i === -1) pk.findings.push(f); else pk.findings.splice(i, 1);
    b.classList.toggle('sel', i === -1); b.setAttribute('aria-pressed', i === -1);
    el.querySelector('.c_stop').hidden = !pk.findings.includes('sealed_hazard');
  });
  el.querySelectorAll('.f_meas button').forEach(b => b.onclick = () => {
    pk.measured_by = b.dataset.m;
    el.querySelectorAll('.f_meas button').forEach(x => { const on = x === b; x.classList.toggle('sel', on); x.setAttribute('aria-checked', on); });
    renderCalc(el);
  });
  renderCalc(el);

  el.querySelector('.f_verify').onclick = async () => {
    const f = readCard(el);
    try {
      const kind = el.querySelector('.f_kind').value;
      if (kind !== '__new' && kind !== (c.claim_type || '')) await api('/api/claims/' + c.id + '/edit', { claim_type: kind });
      await api('/api/claims/' + c.id + '/verify', { invoice_weight:f.inv, claimed_weight:f.recv, weight_unit:f.unit, sell_price:f.rate, sell_price_unit:f.rateUnit, tolerance_pct: f.tol === null ? '' : f.tol });
      savedClaim(c.id);
      toast('Confirmed. The chase is cancelled and a recovery to-do is raised.', 'ok');
      await load();
    } catch (e) { toast(e.message, 'bad'); }
  };
  el.querySelectorAll('.f_assess').forEach(btn => btn.onclick = async () => {
    const unit = (el.querySelector('.f_unit button.sel') || {}).dataset;
    const body = { assessment: btn.dataset.kind, weight_unit: unit ? unit.u : null };
    if (btn.dataset.kind === 'contamination') Object.assign(body, {
      invoice_weight: numOf(el.querySelector('.f_cinv').value), contam_claimed_pct: numOf(el.querySelector('.f_cpct').value),
      contam_accepted_pct: numOf(el.querySelector('.f_apct').value), sell_price: numOf(el.querySelector('.f_crate').value),
      sell_price_unit: el.querySelector('.f_crateUnit').value, findings: pk.findings.slice(), measured_by: pk.measured_by,
    });
    else Object.assign(body, {
      grade_sold: el.querySelector('.f_gsold').value.trim(), grade_received: el.querySelector('.f_grecv').value.trim(),
      grade_weight: numOf(el.querySelector('.f_gw').value), grade_price_sold: numOf(el.querySelector('.f_gps').value),
      grade_price_received: numOf(el.querySelector('.f_gpr').value),
    });
    try {
      const kind = el.querySelector('.f_kind').value;
      if (kind !== '__new' && kind !== (c.claim_type || '')) await api('/api/claims/' + c.id + '/edit', { claim_type: kind });
      await api('/api/claims/' + c.id + '/assess', body);
      savedClaim(c.id);
      toast(pk.findings.includes('sealed_hazard') ? 'Assessed — and tell the owner about the sealed items before anything else.' : 'Assessed. The chase is cancelled and a recovery to-do is raised.', pk.findings.includes('sealed_hazard') ? 'bad' : 'ok');
      await load();
    } catch (e) { toast(e.message, 'bad'); }
  });
  el.querySelector('.f_kind').onchange = () => {
    const sel = el.querySelector('.f_kind');
    if (sel.value !== '__new') return;
    // Ask inline rather than with a dialog, and add the name to the vocabulary
    // the moment she uses it.
    const row = document.createElement('div');
    row.className = 'actions';
    row.innerHTML = '<input class="k_new" placeholder="what kind of claim is this? two or three words" style="flex:1;height:38px;padding:0 10px;border-radius:4px;border:1px solid var(--border-default);background:var(--bg-base);color:var(--text-body)">' +
      '<button class="btn go k_ok" type="button">Use it</button>';
    sel.closest('.grid').after(row);
    row.querySelector('.k_ok').onclick = async () => {
      const label = row.querySelector('.k_new').value.trim();
      if (!label) { toast('Give it a name first.', 'bad'); return; }
      try { await api('/api/claims/' + c.id + '/edit', { claim_type: label }); toast('Kind set to “' + label + '”.', 'ok'); await load(); }
      catch (e) { toast(e.message, 'bad'); }
    };
    row.querySelector('.k_new').focus();
  };

  /* remarks save themselves — "nothing typed is lost" */
  const rem = el.querySelector('.f_remarks');
  const savedTag = el.querySelector('.saved');
  const saveRemarks = async () => {
    const v = rem.value.trim();
    if (v === String(c.remarks || '').trim()) return;
    try {
      await api('/api/claims/' + c.id + '/edit', { remarks: v });
      c.remarks = v;
      if (STATE.drafts[c.id]) delete STATE.drafts[c.id].values.f_remarks;
      savedTag.hidden = false; setTimeout(() => { savedTag.hidden = true; }, 2200);
    } catch (e) { toast('Remarks not saved — ' + e.message, 'bad'); }
  };
  rem.onblur = saveRemarks;
  el.querySelectorAll('.f_q').forEach(b => b.onclick = () => {
    rem.value = (rem.value.replace(/\s*$/, '') ? rem.value.replace(/\s*$/, '') + ' ' : '') + b.dataset.q + '.';
    saveRemarks();
  });

  el.querySelector('.f_save').onclick = async () => {
    try {
      const k = el.querySelector('.f_kind').value;
      const body = { supplier: el.querySelector('.f_sup').value.trim() };
      if (k !== '__new') body.claim_type = k;
      const sp = numOf(el.querySelector('.f_srate').value);
      if (sp !== null) { body.supplier_price = sp; body.supplier_price_unit = el.querySelector('.f_srateUnit').value; }
      await api('/api/claims/' + c.id + '/edit', body);
      savedClaim(c.id);
      toast('Saved.', 'ok'); await load();
    } catch (e) { toast(e.message, 'bad'); }
  };
  el.querySelector('.f_rec').onclick = async () => {
    const ours = numOf(el.querySelector('.f_ours').value);
    if (ours === null) { toast('Put in what you are recovering from the supplier first.', 'bad'); return; }
    try {
      const sup = el.querySelector('.f_sup').value.trim();
      const patch = {};
      if (sup && sup !== (c.supplier||'')) patch.supplier = sup;
      // The rate goes on the record WITH the figure, because the report
      // prints it and a rate recorded later would not be the one this amount
      // was worked out at.
      const sp = numOf(el.querySelector('.f_srate').value);
      if (sp !== null) { patch.supplier_price = sp; patch.supplier_price_unit = el.querySelector('.f_srateUnit').value; }
      if (Object.keys(patch).length) await api('/api/claims/' + c.id + '/edit', patch);
      await api('/api/claims/' + c.id + '/recovery', { our_claim: ours });
      savedClaim(c.id);
      toast('Recovery raised.', 'ok'); await load();
    } catch (e) { toast(e.message, 'bad'); }
  };
  /* What the purchase bill says this supplier was paid. Read-only: it offers
     the figure, it never writes it. Apsara, 2026-10-03: recovery is valued at
     the supplier's own price, and where the bill holds several grades at
     several rates it says so rather than averaging them. */
  (async () => {
    const box = el.querySelector('.billrate');
    if (!box) return;
    try {
      const p = await api('/api/claims/' + c.id + '/price');
      if (p.price === null) { box.innerHTML = '<b>·</b> No rate from the bill — ' + esc(p.why || 'nothing found') + '.'; return; }
      const at = money(p.price) + '/' + esc(p.unit);
      box.innerHTML = '<b>·</b> ' + esc(p.source) + ': <b>' + at + '</b>' +
        (p.amount !== null ? ' → ' + (p.quantity !== undefined && p.unit !== (c.weight_unit || p.unit)
              ? 'the ' + (c.shortage ?? '?') + ' ' + esc(c.weight_unit || '') + ' short is <b>' + Number(p.quantity).toLocaleString('en-US',{maximumFractionDigits:3}) + ' ' + esc(p.unit) + '</b> at their unit, so '
              : 'the shortage at their rate is ') +
            '<b>' + money(p.amount) + '</b> <button class="btn use_rate" type="button" style="margin-left:6px">Use it</button>'
                           : ' — ' + esc(p.missing || 'nothing to work out yet')) +
        (p.supplierMismatch ? '<br><b>·</b> This claim names <b>' + esc(p.supplierMismatch.onClaim) + '</b> but the bill for this container is from <b>' + esc(p.supplierMismatch.onBill) + '</b>. One of them is wrong.' : '');
      const use = box.querySelector('.use_rate');
      if (use) use.onclick = () => {
        el.querySelector('.f_srate').value = p.price;
        el.querySelector('.f_srateUnit').value = p.unit;
        el.querySelector('.f_ours').value = p.amount;
        toast('Filled from the bill. Nothing is saved until you raise the recovery.', 'ok');
      };
    } catch (e) { box.innerHTML = '<b>·</b> Could not read the purchase bill — ' + esc(e.message); }
  })();

  const doc = el.querySelector('.f_doc');
  if (doc) doc.onchange = async () => {
    const f = doc.files[0];
    if (!f) return;
    doc.disabled = true;
    toast('Filing ' + f.name + '…', 'ok');
    try {
      const b64 = await new Promise((res, rej) => {
        const fr = new FileReader();
        fr.onload = () => res(String(fr.result).replace(/^data:[^,]+,/, ''));
        fr.onerror = () => rej(new Error('that file could not be read on this device'));
        fr.readAsDataURL(f);
      });
      await api('/api/claims/' + c.id + '/evidence', { base64: b64, mimeType: f.type || 'image/jpeg', name: f.name });
      toast('Filed against this claim.', 'ok'); await load();
    } catch (e) { doc.disabled = false; doc.value = ''; toast(e.message, 'bad'); }
  };

  /* Closing is two taps, on purpose: the first arms the choice, the second
     does it. A rejected claim that was meant to be settled is real money. */
  el.querySelectorAll('.f_st').forEach(b => b.onclick = async () => {
    if (!b.classList.contains('armed')) {
      el.querySelectorAll('.f_st').forEach(x => x.classList.remove('armed'));
      b.classList.add('armed');
      const sub = b.querySelector('.sub'); if (sub) { sub.dataset.was = sub.dataset.was || sub.textContent; sub.textContent = 'tap again to mark it ' + b.dataset.st; }
      setTimeout(() => { b.classList.remove('armed'); if (sub && sub.dataset.was) sub.textContent = sub.dataset.was; }, 4000);
      return;
    }
    try { await api('/api/claims/' + c.id + '/status', { status: b.dataset.st }); savedClaim(c.id); toast('Marked ' + b.dataset.st + '.', 'ok'); await load(); }
    catch (e) { toast(e.message, 'bad'); }
  });
}

    '<div class="grid">' +
      '<label class="f">Customer<input id="n_cust" value="' + esc(pre.customer||'') + '"></label>' +
      '<label class="f">Supplier<input id="n_sup"></label>' +
      '<label class="f">Invoice no<input id="n_inv" class="mono" value="' + esc(pre.invoice_no||'') + '"></label>' +
      '<label class="f">Container no<input id="n_cont" class="mono" value="' + esc(pre.container_no||'') + '"></label>' +
      '<label class="f">What they are asking<input id="n_amt" class="num" inputmode="decimal"></label>' +
      '<label class="f">Kind of claim<select id="n_type">' +
        '<option value="">let the kind be worked out from what they said</option>' +
        STATE.kinds.map(k => '<option value="' + esc(k.slug) + '">' + esc(k.label) + '</option>').join('') +
      '</select></label>' +
    '</div>' +
    '<label class="f" style="margin-top:12px">What they are claiming<input id="n_note" placeholder="in their words — this is the evidence for the kind"></label>' +
    '<div class="hint">Weights are left out on purpose — enter them in Confirm the weights, where the unit is recorded with them.</div>' +
    '<div class="actions"><button class="btn go" id="n_save" type="button">Create as unverified</button><button class="btn" id="n_cancel" type="button">Cancel</button></div></div>';

      customer: $('#n_cust', wrap).value.trim(),

      container_no: $('#n_cont', wrap).value.trim(),
      stated_claim_amount: numOf($('#n_amt', wrap).value),
      claim_type: $('#n_type', wrap).value,
