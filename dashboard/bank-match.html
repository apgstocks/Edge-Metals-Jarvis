<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bank — Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Design tokens copied from dashboard/quickbooks.html — standalone page,
   kept in sync by hand, same as the others on this server.

   Layout: Apsara, 2026-10-09, "redesign the bank tab mimicking quickbook but
   in a better way" — account cards across the top, one review queue with
   tabs, and every row saying in words WHY Jarvis thinks what it thinks. */
:root{
  --steel-900:#14181B; --steel-800:#1E2429; --steel-700:#2B3239; --steel-600:#3C454D;
  --steel-500:#57616A; --steel-400:#7E8891; --steel-300:#A7B0B7; --steel-200:#CBD1D6;
  --leaf-300:#7FD172; --leaf-400:#57BE49; --leaf-500:#3DA836; --leaf-600:#2E861F;
  --green-500:#2F8F57; --amber-500:#D99A2B; --amber-300:#F5C04A; --red-500:#C5402F; --blue-500:#3A6EA5;
  --copper-300:#E29C68;
  --bg-base:#0C0E10; --surface-card:#14181B; --surface-sunken:#0F1214; --surface-hover:#181D21;
  --text-strong:#FFFFFF; --text-body:#CBD1D6; --text-muted:#A7B0B7; --text-faint:#7E8891;
  --border-subtle:#1E2429; --border-default:#2B3239; --ring:var(--leaf-500);
  --font-display:'Archivo',sans-serif; --font-sans:'IBM Plex Sans',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:var(--font-sans);color:var(--text-body);background:var(--bg-base);-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3{font-family:var(--font-display);color:var(--text-strong);margin:0;font-weight:900;letter-spacing:-.02em}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.mono{font-family:var(--font-mono)}
[hidden]{display:none!important}

/* ── header: title, date range, refresh ─────────────────────────────── */
header{display:flex;align-items:center;gap:12px 16px;padding:12px 20px;border-bottom:1px solid var(--border-default);background:var(--surface-card);position:sticky;top:0;z-index:10;flex-wrap:wrap}
header h1{font-size:22px;margin-right:4px}
.range{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.range label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted)}
.range input[type=date]{background:var(--surface-sunken);border:1px solid var(--border-default);color:var(--text-strong);border-radius:4px;height:34px;padding:0 8px;font:500 13px var(--font-mono);color-scheme:dark;cursor:pointer}
.range input[type=date]:hover{border-color:var(--steel-500)}
.presets{display:flex;gap:4px;flex-wrap:wrap}
.preset{height:30px;padding:0 10px;border-radius:15px;border:1px solid var(--border-default);background:transparent;color:var(--text-body);font-size:12.5px;font-weight:600}
.preset:hover{border-color:var(--steel-400)}
.preset.on{background:var(--leaf-600);border-color:var(--leaf-600);color:#fff}
.hdr-right{margin-left:auto;display:flex;gap:8px;align-items:center}

main{padding:16px 20px 60px;max-width:1240px;margin:0 auto}

/* ── account cards ──────────────────────────────────────────────────── */
.accts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-bottom:12px}
.acct{background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:6px;padding:12px 14px;min-width:0}
.acct.warn{border-color:#8A6416}
.acct .co{font-family:var(--font-mono);font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--copper-300)}
.acct .bk{color:var(--text-strong);font-weight:700;font-size:14px;margin-top:2px}
.acct .bk .mask{font-family:var(--font-mono);color:var(--text-muted);font-weight:500}
.acct .big{font-family:var(--font-mono);font-size:19px;color:var(--text-strong);font-weight:600;margin-top:6px}
.acct .sub{font-size:12px;color:var(--text-muted);margin-top:2px}
.pill{display:inline-block;margin-top:8px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:10px}
.pill.ok{background:rgba(61,168,54,.16);color:var(--leaf-300)}
.pill.warn{background:rgba(217,154,43,.18);color:var(--amber-300)}
.pill.off{background:rgba(126,136,145,.16);color:var(--steel-300)}

.repair{background:rgba(217,154,43,.10);border:1px solid #8A6416;border-radius:6px;padding:12px 14px;margin-bottom:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.repair .t{color:var(--text-strong);font-weight:600;font-size:14px}
.repair .s{color:var(--text-body);font-size:12.5px}
.btn.amber{background:var(--amber-500);border-color:var(--amber-500);color:#0C0E10;font-weight:700}

.coming{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface-sunken);border:1px solid var(--border-subtle);border-radius:6px;padding:10px 14px;margin-bottom:14px}
.coming .ttl{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}
.coming .tot{font-family:var(--font-mono);color:var(--text-strong);font-weight:600}
.coming .inv{font-size:12px;color:var(--text-body);border:1px solid var(--border-default);border-radius:12px;padding:2px 9px;white-space:nowrap}
.coming .inv .old{color:var(--amber-300)}

/* ── tabs + toolbar ─────────────────────────────────────────────────── */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border-default);margin-bottom:12px;overflow-x:auto}
.tab{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--text-muted);padding:10px 14px;font-weight:600;font-size:13.5px;white-space:nowrap}
.tab:hover{color:var(--text-body)}
.tab.on{color:var(--text-strong);border-bottom-color:var(--leaf-500)}
.tab .n{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);margin-left:4px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--border-default);border-radius:4px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--text-body);padding:6px 12px;font-size:12.5px;font-weight:600}
.seg button+button{border-left:1px solid var(--border-default)}
.seg button.on{background:var(--steel-700);color:#fff}
.search{flex:1;min-width:180px;max-width:340px;height:32px;background:var(--surface-sunken);border:1px solid var(--border-default);color:var(--text-body);border-radius:4px;padding:0 10px;font:inherit;font-size:13px}
.keys{font-size:11px;color:var(--text-faint)}
.keys kbd{font-family:var(--font-mono);border:1px solid var(--border-default);border-bottom-width:2px;border-radius:3px;padding:0 4px;font-size:10.5px;color:var(--text-muted)}

.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:3px;border:1px solid var(--border-default);color:var(--text-muted);background:var(--surface-sunken);white-space:nowrap}
.chip.on{color:var(--leaf-300);border-color:var(--leaf-600);background:rgba(87,190,73,.10)}
.chip.warn{color:var(--amber-500);border-color:#5a4416;background:rgba(217,154,43,.10)}
.chip.bad{color:var(--red-500);border-color:#5c2a22;background:rgba(197,64,47,.10)}
.chip.act{cursor:pointer} .chip.act:hover{border-color:var(--text-body);color:var(--text-body)}

/* ── rows ───────────────────────────────────────────────────────────── */
.card{background:var(--surface-card);border:1px solid var(--border-default);border-radius:6px;padding:12px 14px;margin-bottom:10px}
#list .card,.tcard{border-left:4px solid var(--steel-500)}
#list .card.sure{border-left-color:var(--leaf-500)}
#list .card.likely{border-left-color:var(--amber-500)}
.tcard{border-left-color:var(--blue-500)!important}
.card.focus{outline:2px solid var(--ring);outline-offset:1px}
.lbl{font-family:var(--font-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}
.row1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.amt{font-family:var(--font-mono);font-size:19px;font-weight:600;color:var(--text-strong)}
.amt.in{color:var(--leaf-300)}
.desc{color:var(--text-body);font-size:13px}
.when{font-family:var(--font-mono);font-size:11px;color:var(--text-faint)}
.badge{font-family:var(--font-mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;padding:2px 6px;border-radius:3px;border:1px solid var(--border-default);color:var(--text-muted)}
.badge.good{color:var(--leaf-300);border-color:var(--leaf-600)}
.badge.ask{color:var(--amber-500);border-color:#5a4416}
.badge.none{color:var(--steel-400)}
.badge.blue{color:#9cc3ec;border-color:#2c4f75}
.alloc{margin:8px 0 0;border-top:1px solid var(--border-subtle);padding-top:8px}
.alloc table{width:100%;border-collapse:collapse;font-size:13px}
.alloc td{padding:3px 0;vertical-align:top}
.alloc td.n{text-align:right;font-family:var(--font-mono);white-space:nowrap}
.why{margin:7px 0 0;padding:0 0 0 16px;color:var(--text-muted);font-size:12.5px}
.why li{margin:2px 0}
.hint{margin-top:8px;padding:8px 10px;border-radius:4px;background:rgba(58,110,165,.12);border:1px solid #2c4f75;color:#cfe0f3;font-size:12.5px}
.hint a{color:#9cc3ec}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.btn{background:var(--surface-sunken);border:1px solid var(--border-default);color:var(--text-body);border-radius:4px;padding:6px 11px;font-size:12.5px}
.btn:hover{border-color:var(--text-body)}
.btn.go{border-color:var(--leaf-600);color:var(--leaf-300)}
.btn.go:hover{background:rgba(87,190,73,.10)}
.btn.solid{background:var(--leaf-600);border-color:var(--leaf-600);color:#fff;font-weight:700}
.btn.warn{border-color:#5a4416;color:var(--amber-500)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--text-muted)}
.btn.quiet:hover{color:var(--text-body);border-color:var(--border-default)}
select,input[type=text]{background:var(--surface-sunken);border:1px solid var(--border-default);color:var(--text-body);border-radius:4px;padding:5px 7px;font:inherit;font-size:12.5px}
.empty{color:var(--text-faint);font-size:13px;padding:10px 0}
.note{color:var(--text-muted);font-size:12.5px;margin-top:4px}
.rivals{margin-top:8px;border-left:2px solid #5a4416;padding-left:10px}
.legs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.leg{background:var(--surface-sunken);border:1px solid var(--border-subtle);border-radius:4px;padding:8px 10px;font-size:12.5px;min-width:0}
.leg .when{display:block}
.surebar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:rgba(61,168,54,.08);border:1px solid var(--leaf-600);border-radius:6px;padding:10px 14px;margin-bottom:10px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--surface-card);border:1px solid var(--border-default);color:var(--text-body);padding:9px 14px;border-radius:5px;font-size:13px;z-index:50;max-width:90vw}
.toast.bad{border-color:#5c2a22;color:#f0b4ab}
.toast.good{border-color:var(--leaf-600);color:var(--leaf-300)}
h2.sec{font-size:13px;margin:18px 0 8px;color:var(--text-muted);font-family:var(--font-mono);letter-spacing:.1em;text-transform:uppercase;font-weight:600}
h2.sec .n{color:var(--text-faint);font-weight:400}

@media (max-width:720px){
  header{padding:10px 16px;position:static}
  .coming .inv:nth-of-type(n+7){display:none} /* ttl, total, text, then three invoices */
  header h1{font-size:20px}
  .hdr-right{margin-left:0}
  .range{width:100%}
  .range label{flex:1}
  .range input[type=date]{flex:1;min-width:0}
  main{padding:12px 16px 60px}
  .accts{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
  .acct{flex:none;width:250px;scroll-snap-align:start}
  .legs{grid-template-columns:1fr}
  .keys{display:none}
  .search{max-width:none}
  .acts .btn{min-height:40px}
}
@media print{ header,.tabs,.toolbar,.acts{display:none} }
</style>
</head>
<body>
<header>
  <h1>Bank</h1>
  <!-- Apsara, 2026-10-09: "add a date from,to with date picker. on clicking
       date-it should get selected and picker closes. then this year,last
       year,month". Native date inputs: a click on a day selects it and the
       picker closes on its own, in every browser she uses, with no library.
       The range is sent to every bank route as ?from=&to=. -->
  <div class="range" id="range">
    <label>From <input type="date" id="from" aria-label="From date"></label>
    <label>To <input type="date" id="to" aria-label="To date"></label>
    <div class="presets" id="presets">
      <button type="button" class="preset" data-preset="month">This month</button>
      <button type="button" class="preset" data-preset="lastmonth">Last month</button>
      <button type="button" class="preset" data-preset="year">This year</button>
      <button type="button" class="preset" data-preset="lastyear">Last year</button>
      <button type="button" class="preset" data-preset="all">All dates</button>
    </div>
  </div>
  <div class="hdr-right">
    <button type="button" class="btn" data-plaid="sync" id="pullTop" hidden>↻ Pull new transactions</button>
  </div>
</header>
<main>
  <div id="repair"></div>
  <div id="accounts" class="accts"></div>
  <div id="coming"></div>

  <nav class="tabs" role="tablist" id="tabs">
    <button type="button" class="tab on" role="tab" data-tab="review" aria-selected="true">For review<span class="n" id="n-review"></span></button>
    <button type="button" class="tab" role="tab" data-tab="aside" aria-selected="false">Set aside &amp; recorded<span class="n" id="n-aside"></span></button>
    <button type="button" class="tab" role="tab" data-tab="recon" aria-selected="false">Bank vs books</button>
    <button type="button" class="tab" role="tab" data-tab="setup" aria-selected="false">Connections &amp; rules</button>
  </nav>

  <section data-pane="review">
    <div class="toolbar">
      <div class="seg" id="dir" role="group" aria-label="Show money in or out">
        <button type="button" class="on" data-dir="all">All</button>
        <button type="button" data-dir="in">Money in</button>
        <button type="button" data-dir="out">Money out</button>
      </div>
      <input class="search" id="q" type="search" placeholder="Search name, description or amount" aria-label="Search">
      <span class="keys"><kbd>/</kbd> search · <kbd>J</kbd><kbd>K</kbd> move · <kbd>1</kbd>–<kbd>4</kbd> tabs</span>
    </div>
    <div class="chips" id="chips"></div>
    <div id="feednote"></div>
    <!-- Money between her own companies first: it is never income, and a
         transfer that reached the customer list below would invite exactly
         the wrong click. -->
    <div id="transfers"></div>
    <div id="inblock">
      <h2 class="sec">Money in <span class="n" id="n-in"></span></h2>
      <div id="sure"></div>
      <div id="list"><div class="empty">Loading…</div></div>
    </div>
    <!-- Money OUT. Apsara, 2026-10-08: "i want like pending,posted
         transactions like qb with match,post". -->
    <div id="review"></div>
  </section>

  <section data-pane="aside" hidden>
    <div id="recorded"></div>
    <div id="extras"></div>
  </section>

  <!-- Apsara, 2026-10-08: "so that i dont need to look out for statements
       whether payment received or sent ever again." -->
  <section data-pane="recon" hidden>
    <div id="recon"></div>
  </section>

  <section data-pane="setup" hidden>
    <div id="feed"></div>
    <div id="rules"></div>
    <div class="card"><div class="row1"><span class="desc">Names Jarvis has learned for payers</span>
      <button type="button" class="btn" data-show="aliases">Show them</button></div></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let STATE = { data: null, aliases: [], tab: 'review', dir: 'all', q: '', range: { from: '', to: '', preset: 'all' } };

function toast(msg, cls) {
  const t = document.createElement('div');
  t.className = 'toast ' + (cls || '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), cls === 'bad' ? 9000 : 4000);
}

/* Every field below is her typing or her bank's, and it goes into innerHTML.
   "Carlos G & C" is an ordinary supplier name here. */
function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
const money = (n) => (typeof n === 'number' && isFinite(n))
  ? '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
  : '—';
const COMPANY = { 'edge-metals': 'Edge Metals', 'edge-trading': 'Edge Yard', 'aaa-investment': 'AAA Investment' };

/* ── the date range ─────────────────────────────────────────────────────
   Added to every GET that reads bank figures, in ONE place, so no list on
   this page can quietly show a different window from the one above it. */
const RANGED = /^\/api\/(bank\/(match|review|reconcile|overview)|intercompany\/transfers)$/;
function withRange(url) {
  const { from, to } = STATE.range;
  if (!RANGED.test(url) || (!from && !to)) return url;
  const qs = [from ? 'from=' + from : '', to ? 'to=' + to : ''].filter(Boolean).join('&');
  return url + (url.includes('?') ? '&' : '?') + qs;
}

async function api(url, opts) {
  const o = opts || {};
  const r = await fetch(o.body ? url : withRange(url), o.body
    ? { method: o.method || 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(o.body) }
    : { method: o.method || 'GET' });
  const j = await r.json().catch(() => ({ error: 'bad response' }));
  if (!r.ok) { const e = new Error(j.error || ('HTTP ' + r.status)); e.body = j; e.status = r.status; throw e; }
  return j;
}

const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function presetRange(p) {
  const now = new Date(); const y = now.getFullYear(); const m = now.getMonth();
  if (p === 'month') return { from: ymd(new Date(y, m, 1)), to: ymd(new Date(y, m + 1, 0)) };
  if (p === 'lastmonth') return { from: ymd(new Date(y, m - 1, 1)), to: ymd(new Date(y, m, 0)) };
  if (p === 'year') return { from: `${y}-01-01`, to: `${y}-12-31` };
  if (p === 'lastyear') return { from: `${y - 1}-01-01`, to: `${y - 1}-12-31` };
  return { from: '', to: '' };
}
function paintRange() {
  $('from').value = STATE.range.from || '';
  $('to').value = STATE.range.to || '';
  document.querySelectorAll('[data-preset]').forEach((b) => b.classList.toggle('on', b.dataset.preset === STATE.range.preset));
}
/* The choice is remembered per browser — a convenience, so a failed read
   just means "all dates", which is what the page did before. */
function saveRange() { try { localStorage.setItem('bank.range', JSON.stringify(STATE.range)); } catch (e) { /* private window */ } }
function loadRange() {
  try {
    const r = JSON.parse(localStorage.getItem('bank.range') || 'null');
    if (r && typeof r === 'object') {
      // A remembered preset is recomputed, so "This month" stays this month.
      STATE.range = r.preset && r.preset !== 'custom' ? { ...presetRange(r.preset), preset: r.preset }
        : { from: r.from || '', to: r.to || '', preset: 'custom' };
    }
  } catch (e) { /* nothing remembered */ }
}
function setRange(next) {
  if (next.from && next.to && next.from > next.to) { toast('The From date is after the To date', 'bad'); paintRange(); return; }
  STATE.range = next; saveRange(); paintRange(); load();
}

/* ── the strip of numbers ──────────────────────────────────────────────
   Excluded and pending get their own chips rather than being quietly left
   out of one figure. A screen that shows a single number has to be trusted;
   one that shows what it set aside can be checked. */
function renderChips() {
  const d = STATE.data; if (!d) return;
  const L = d.ledger || {};
  const c = d.counts || {}, t = d.totals || {};
  const bits = [
    `<span class="chip ${c.confident ? 'on' : ''}">${c.confident || 0} ready · ${money(t.confident)}</span>`,
    `<span class="chip ${(c.deposits - (c.confident || 0)) ? 'warn' : ''}">${Math.max(0, (c.deposits || 0) - (c.confident || 0))} need you · ${money(t.needs_you)}</span>`,
    c.ambiguous ? `<span class="chip warn">${c.ambiguous} ambiguous</span>` : '',
    c.no_party ? `<span class="chip warn">${c.no_party} unknown payer</span>` : '',
    `<span class="chip">${d.open_invoices || 0} open invoices · ${d.customers_with_open || 0} customers</span>`,
    (L.excluded && L.excluded.count) ? `<span class="chip act" data-show="excluded" title="Set aside, still counted — click to see them">${L.excluded.count} excluded · ${money(L.excluded.money)}</span>` : '',
    (L.pending && L.pending.count) ? `<span class="chip">${L.pending.count} pending</span>` : '',
    L.drifted ? `<span class="chip bad">${L.drifted} restated by the bank</span>` : '',
    `<span class="chip act" data-show="aliases">${d.learned_names || 0} names learned</span>`,
    (d.balance_disagreements || []).length ? `<span class="chip bad">${d.balance_disagreements.length} balance disagreements</span>` : '',
    `<span class="chip act" data-reload="1">reload</span>`,
  ].filter(Boolean);
  $('chips').innerHTML = bits.join('');
}

const BADGE = {
  proposed: ['good', 'matched'],
  no_party: ['ask', 'who paid?'],
  nothing_open: ['none', 'nothing open'],
  more_than_owed: ['ask', 'more than owed'],
  no_combination: ['ask', 'no combination'],
  not_a_deposit: ['none', 'not a deposit'],
};

function allocTable(p) {
  return `<div class="alloc"><table>${p.allocations.map((a) => `<tr>
      <td>${esc(a.label)}${a.clears ? '' : ` <span class="badge ask">part</span>`}</td>
      <td class="n">${money(a.amount)}</td>
      <td class="n" style="color:var(--text-faint)">${a.shortfall ? 'short ' + money(a.shortfall)
        : (a.clears ? '' : 'leaves ' + money(a.leaves))}</td>
    </tr>`).join('')}</table></div>`;
}

/* Confirm posts to POST /api/sales-receipts — the route the receipts screen
   already uses. There is no second way to mark an invoice paid, so this form
   carries what addReceipt requires: a mode, and a bank when the mode has one. */
function confirmForm(row, p, i) {
  const d = STATE.data;
  const modes = d.modes || ['Wire'];
  const banks = d.banks || [];
  const guess = row.deposit.bank_guess;
  return `<div class="acts">
    <select data-mode="${i}">${modes.map((m) => `<option${m === 'Wire' ? ' selected' : ''}>${esc(m)}</option>`).join('')}</select>
    <select data-bank="${i}">
      <option value="">which account?</option>
      ${banks.map((b) => `<option${b === guess ? ' selected' : ''}>${esc(b)}</option>`).join('')}
    </select>
    <button class="btn solid" data-confirm="${i}">Confirm — record this receipt</button>
    <button class="btn warn" data-exclude="${esc(row.deposit.id)}">Not a customer payment</button>
  </div>`;
}

/* ── the claim hint ─────────────────────────────────────────────────────
   Suggestion only. The server found a claim on the same invoice for about
   what this payment leaves unpaid — the customer most likely deducted it.
   Nothing is settled from here. */
function claimHint(row) {
  const h = row.claim_hint; if (!h) return '';
  return `<div class="hint">Leaves ${money(h.gap)} unpaid on ${esc(h.invoice_no)} — there is a claim on that invoice
    for ${money(h.claim_amount)}${h.status ? ' (' + esc(String(h.status).replace(/_/g, ' ')) + ')' : ''}. The customer probably deducted it.
    <a href="/claims">Open the claim</a></div>`;
}

function sureOf(row) {
  const p = (row.proposals || [])[0];
  return !!(p && row.outcome === 'proposed' && !row.ambiguous && p.score >= 0.95);
}

function renderRow(row, i) {
  const dep = row.deposit;
  const [cls, label] = BADGE[row.outcome] || ['none', esc(row.outcome)];
  const p = (row.proposals || [])[0];
  const rivals = (row.proposals || []).slice(1);

  let body = '';
  if (row.note) body += `<div class="note">${esc(row.note)}</div>`;

  if (row.outcome === 'no_party') {
    const sg = row.suggestions || [];
    body += sg.length
      ? `<div class="acts">${sg.map((s) => `<button class="btn go" data-learn="${esc(s.customer)}" data-desc="${esc(dep.descriptor)}">This is ${esc(s.customer)}</button>`).join('')}
           <span class="note">Answered once, every future deposit from them matches itself.</span></div>`
      : `<div class="acts">
           <input type="text" data-name="${i}" placeholder="type the customer's name" size="26">
           <button class="btn go" data-learnfree="${i}" data-desc="${esc(dep.descriptor)}">Remember this payer</button>
         </div>`;
    body += `<div class="acts"><button class="btn warn" data-exclude="${esc(dep.id)}">Not a customer payment</button>
      ${ruleBtn(dep.descriptor || dep.desc, 'in')}</div>`;
  } else if (p) {
    body += allocTable(p);
    body += `<ul class="why">${p.reasons.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`;
    body += claimHint(row);
    if (row.ambiguous) {
      body += `<div class="rivals"><div class="lbl">the other possibilities</div>
        ${rivals.map((q) => allocTable(q)).join('')}</div>`;
    }
    if (row.truncated) {
      body += `<div class="note">The search stopped early — there may be more combinations than these. Not the same as there being none.</div>`;
    }
    body += confirmForm(row, p, i);
  } else {
    body += `<div class="acts"><button class="btn warn" data-exclude="${esc(dep.id)}">Not a customer payment</button></div>`;
  }

  const tone = sureOf(row) ? 'sure' : (p ? 'likely' : '');
  return `<div class="card ${tone}" data-i="${i}" data-dir="in" data-k="${esc([dep.descriptor, dep.desc, row.party, dep.amount, dep.date].join(' ').toLowerCase())}">
    <div class="row1">
      <span class="amt in">${money(dep.amount)}</span>
      <span class="badge ${cls}">${label}</span>
      ${row.ambiguous ? '<span class="badge ask">needs you</span>' : ''}
      ${p && !row.ambiguous ? `<span class="badge ${p.score >= 0.8 ? 'good' : 'ask'}">${Math.round(p.score * 100)}%</span>` : ''}
      <span class="when">${esc(dep.date)}</span>
      ${row.party ? `<span class="desc">${esc(row.party)}</span>` : ''}
    </div>
    <div class="desc mono" style="font-size:11.5px;color:var(--text-faint);margin-top:2px">${esc(dep.descriptor || dep.desc || '(no description)')}</div>
    ${body}
  </div>`;
}

/* ── "confirm all sure matches" ─────────────────────────────────────────
   Narrow on purpose. Only a row that is one clear answer at 95%+, that
   clears its invoices with nothing short (a shortfall needs the fee-or-
   discount question), whose account is known, and whose description says
   how it came (WIRE or ZELLE) — because the receipt records a mode and a
   wrong mode is a wrong record. Everything else stays a one-at-a-time
   decision. */
function bulkable(row) {
  if (!sureOf(row)) return null;
  const p = row.proposals[0];
  if (p.allocations.some((a) => a.shortfall || !a.clears)) return null;
  if (!row.deposit.bank_guess) return null;
  const modes = (STATE.data.modes || []);
  const desc = String(row.deposit.descriptor || row.deposit.desc || '');
  const mode = /\bZELLE\b/i.test(desc) ? 'Zelle' : (/\bWIRE\b/i.test(desc) ? 'Wire' : null);
  if (!mode || !modes.includes(mode)) return null;
  return mode;
}

function renderExtras() {
  const d = STATE.data; if (!d) return;
  const out = [];

  /* The bank restated a row she had already acted on. Loud, because the
     figure moved under a decision already made. */
  if ((d.ledger || {}).drifted) {
    out.push(`<h2 class="sec">The bank changed its mind about ${d.ledger.drifted} row(s)</h2>
      <div class="card"><div class="note">A row was restated after it had been excluded or categorised. The bank's figure is the one kept — this is here so you know it moved.</div></div>`);
  }

  /* Rule 5. Named rather than silently dropped. */
  if ((d.other_company || []).length) {
    out.push(`<h2 class="sec">Not Edge Metals — ${d.other_company.length} deposit(s) in another company's account</h2>
      <div class="card">${d.other_company.map((x) => `<div class="row1" style="margin:3px 0">
          <span class="amt" style="font-size:14px">${money(x.amount)}</span>
          <span class="when">${esc(x.date)}</span>
          <span class="desc">${esc(x.company)}</span>
          <span class="desc" style="color:var(--text-faint)">${esc(x.desc)}</span>
        </div>`).join('')}
        <div class="note">These are not matched against Edge Metals invoices, because they are a different company.</div></div>`);
  }

  if ((d.not_trade || []).length) {
    out.push(`<h2 class="sec">Not a customer or supplier — ${d.not_trade.length} line(s)</h2>
      <div class="card">${d.not_trade.map((x) => `<div class="row1" style="margin:3px 0">
          <span class="amt" style="font-size:14px">${money(x.amount)}</span>
          <span class="when">${esc(x.date)}</span>
          <span class="desc" style="color:var(--text-faint)">${esc(x.desc)}</span>
          <span class="badge none">${esc(x.why)}</span>
        </div>`).join('')}</div>`);
  }

  if ((d.unknown_account || []).length) {
    out.push(`<h2 class="sec">${d.unknown_account.length} deposit(s) in an account Jarvis cannot place on a company</h2>
      <div class="card"><div class="note">${esc(d.unknown_account_fix || '')}</div></div>`);
  }

  if ((d.balance_disagreements || []).length) {
    out.push(`<h2 class="sec">${d.balance_disagreements.length} invoice balance(s) disagree</h2>
      <div class="card">${d.balance_disagreements.map((x) => `<div class="desc">${esc(x.id)} — the sales screen says ${money(x.sales_js)}, this page computes ${money(x.here)}</div>`).join('')}
      <div class="note">Nothing is matched against these until they agree.</div></div>`);
  }
  $('extras').innerHTML = out.join('');
}

async function render() {
  const d = STATE.data;
  renderChips();
  $('feednote').innerHTML = /none yet/.test(d.feed || '')
    ? `<div class="card"><div class="lbl">no bank feed</div><div class="note">${esc(d.feed)}</div></div>` : '';
  const rows = d.rows || [];
  $('list').innerHTML = rows.length
    ? rows.map(renderRow).join('')
    : `<div class="empty">No deposits to match${/none yet/.test(d.feed || '') ? '.' : ' in these dates.'}</div>`;
  $('n-in').textContent = rows.length ? String(rows.length) : '';

  const bulk = rows.map((r, i) => ({ r, i, mode: bulkable(r) })).filter((x) => x.mode);
  STATE.bulk = bulk;
  $('sure').innerHTML = bulk.length > 1 ? `<div class="surebar">
      <span class="desc"><b style="color:#fff">${bulk.length}</b> deposits are sure matches — each pays its invoices in full, the account and the way it came are known.</span>
      <button class="btn solid" data-sureall="1">Confirm all ${bulk.length}</button>
    </div>` : '';
  renderExtras();
  countTabs();
  applyFilter();
}

/* ── BETWEEN YOUR COMPANIES ────────────────────────────────────────────
   Apsara, 2026-10-09: transfers between Edge Metals, Edge Yard and AAA
   Investment are never income — "put it as loan for now". Recording one
   books a loan on both companies at once (Due from / Due to related
   companies); Undo takes both back out. */
function legHtml(leg, label) {

    <div class="desc mono" style="font-size:11.5px;color:var(--text-faint);overflow-wrap:anywhere">${esc(leg.desc || '(no description)')}</div></div>`;
}

      </div>`).join('') : '<div class="empty">None in these dates.</div>'}</div>`;

function countTabs() {
  const ins = ((STATE.data || {}).rows || []).length;
  const outs = (((STATE.review || {}).queue || {}).rows || []).length;
  const tr = STATE.transfers ? ((STATE.transfers.proposed || []).length + (STATE.transfers.one_sided || []).length) : 0;
  const n = ins + outs + tr;
  $('n-review').textContent = n ? String(n) : '';
  const L = ((STATE.data || {}).ledger || {});
  const aside = ((L.excluded || {}).count || 0) + ((STATE.transfers || {}).recorded || []).length;
  $('n-aside').textContent = aside ? String(aside) : '';
}

/* ── the feed ──────────────────────────────────────────────────────────
   Linking is Plaid's own iframe: her bank password is typed into Plaid,
   never into this server, which is the whole reason to use Link rather
   than ask for credentials. The script is fetched only when she presses
   Connect — in the <head> it would mean a CDN outage shows her a blank
   matching screen, and matching does not need Link at all. */
const PLAID_LINK_JS = 'https://cdn.plaid.com/link/v2/stable/link-initialize.js';
function loadPlaidLink() {
  if (window.Plaid) return Promise.resolve(true);
  return new Promise((resolve) => {
    const s = document.createElement('script');
    s.src = PLAID_LINK_JS;
    s.onload = () => resolve(!!window.Plaid);
    s.onerror = () => resolve(false);
    document.head.appendChild(s);
  });
}

async function renderFeed() {
  let p = null;
  try { p = await api('/api/plaid/status'); } catch (e) { p = { error: e.message }; }
  STATE.plaid = p;

  const items = p.items || [];

  bits.push(`<span class="chip ${p.configured ? 'on' : 'warn'}">${p.configured ? 'keys set' : 'no keys'}</span>`);
  bits.push(`<span class="chip ${p.env === 'production' ? 'on' : 'warn'}">${esc(p.env)}</span>`);
  bits.push(`<span class="chip ${items.length ? 'on' : 'warn'}">${items.length} bank${items.length === 1 ? '' : 's'} linked</span>`);

  const acts = [];
  if (p.configured) {
    acts.push('<button class="btn go" data-plaid="connect">Connect a bank</button>');
    if (items.length) acts.push('<button class="btn" data-plaid="sync">Pull new transactions</button>');
    /* Sandbox only. It is how the whole path — link, sync, match, confirm —
       is provable before Plaid grants production access, which takes a
       review. The server refuses this outside sandbox. */
    if (p.env === 'sandbox') acts.push('<button class="btn" data-plaid="sandbox" title="Links a fake bank with made-up transactions, so the whole path can be tried before Plaid approves production">Link a test bank</button>');
  }

  $('feed').innerHTML = `<div class="card">
    <div class="row1"><div class="lbl" style="margin-right:6px">bank feed</div>${bits.join('')}</div>
    ${p.note ? `<div class="note">${esc(p.note)}</div>` : ''}
    ${items.length ? `<div style="margin-top:8px">${items.map((i) => `<div class="row1" style="margin:5px 0">
        <span class="desc">${esc(i.institution || 'bank')}</span>
        <span class="when">${(i.accounts || []).map((a) => esc((a.name || '') + (a.mask ? ' ····' + a.mask : ''))).join(', ')}</span>
        <span class="when">${i.last_sync_at ? 'pulled ' + esc(String(i.last_sync_at).slice(0, 16).replace('T', ' ')) : 'never pulled'}</span>
        ${i.needs_login ? `<button class="btn amber" data-plaid="reconnect" data-item="${esc(i.item_id)}">Sign in again</button>` : ''}
        <button class="btn" data-unlink="${esc(i.item_id)}">Unlink</button>
      </div>`).join('')}</div>` : ''}
    <div class="acts">${acts.join('')}</div>
    ${items.length ? '<div class="note">If a bank asks you to log in again, use "Sign in again" on that bank — "Connect a bank" would link the same accounts a second time.</div>' : ''}
    ${p.configured ? '' : '<div class="note">Set PLAID_CLIENT_ID and PLAID_SECRET in the server .env — they are on the Plaid dashboard under Developers / Keys.</div>'}
  </div>`;
}

/* ── RULES ──────────────────────────────────────────────────────────────
   "Lines like this are always a bank charge." A rule SETS ASIDE matching
   lines with the rule as the reason — reversible, explained, and it creates
   nothing in the books. Made from a row she is looking at, so it carries
   that row's direction: a money-out rule can never swallow a customer's
   wire. */
function ruleBtn(desc, dir) {
  if (!desc) return '';
  return `<button class="btn quiet" data-rule-desc="${esc(desc)}" data-rule-dir="${esc(dir)}" title="Set aside this line and every future line like it">Always set aside lines like this</button>`;
}
async function renderRules() {
  let r = null;
  try { r = await api('/api/bank/rules'); } catch (e) { r = null; }
  STATE.rules = r;
  if (!r) { $('rules').innerHTML = ''; return; }
  const rows = r.rules || [];
  $('rules').innerHTML = `<h2 class="sec">Rules <span class="n">${rows.length}</span></h2>
    <div class="card">${rows.length ? rows.map((x) => `<div class="row1" style="margin:4px 0">
        <span class="badge ${x.direction === 'in' ? 'good' : 'none'}">money ${esc(x.direction)}</span>
        <span class="desc mono" style="font-size:12px">contains “${esc(x.text)}”</span>
        <span class="desc">→ ${esc(x.label)}</span>
        <span class="when">${esc(String(x.at || '').slice(0, 10))}${x.by ? ' · ' + esc(x.by) : ''}</span>
        <button class="btn quiet" data-rule-del="${esc(x.text)}" data-rule-deldir="${esc(x.direction)}">Delete</button>
      </div>`).join('') : '<div class="empty">No rules yet. Use "Always set aside lines like this" on a row in the review list.</div>'}
      <div class="note">A rule sets lines aside with the rule written as the reason. They stay counted in the bank total and each one can be put back. Deleting a rule leaves what it already set aside where it is.</div></div>`;
}

/* ── DOES THE BANK AGREE WITH THE BOOKS? ──────────────────────────────
   Apsara, 2026-10-08: "so that i dont need to look out for statements
   whether payment received or sent ever again."

   Three rules this block follows, each because the opposite would be worse
   than showing nothing:

   · It says "movement agrees", never "all clear". helpers/bankReconcile.js
     compares what moved inside a window, which is the only figure both
     sides can honestly produce — her ledger and the Plaid feed start on
     different days, so their running totals differ by an opening balance
     for ever. Printing "all clear" would be a claim nobody computed.
   · Money in and money out are separate lines even when they cancel. A
     missing $5,000 receipt and a missing $5,000 payment net to zero, and a
     single figure would read as agreement on the day she most needs to look.
   · An incomplete journal is shown FIRST, because every figure under it is
     a floor rather than a total. */
/* One party per line, biggest first, capped. Sixty rows of "Mario" is one
   supplier and one question; sixty lines is neither — and a list that
   scrolls past the screen is a list nobody reads to the end of. */
const SHOW_GROUPS = 6;
function groupBlock(groups, heading) {
  if (!groups.length) return '';
  const shown = groups.slice(0, SHOW_GROUPS);
  const rest = groups.slice(SHOW_GROUPS);
  const restMoney = rest.reduce((t, g) => t + g.money, 0);
  const restRows = rest.reduce((t, g) => t + g.n, 0);
  return `<div class="note" style="margin-top:10px">${esc(heading)}:</div>
    <table style="width:100%; border-collapse:collapse; font-size:12px; margin-top:4px;">
      ${shown.map((g) => `<tr style="border-bottom:1px solid var(--border-subtle)">
        <td style="padding:4px 8px 4px 0; font-weight:600;">${esc(g.party)}</td>
        <td style="padding:4px 8px; color:var(--text-faint); white-space:nowrap;">${g.n} row${g.n === 1 ? '' : 's'}</td>
        <td style="padding:4px 8px; color:var(--text-faint); white-space:nowrap;">${esc(fmtDay(g.first))}${g.first === g.last ? '' : ' – ' + esc(fmtDay(g.last))}</td>
        <td style="padding:4px 0; text-align:right; font-family:var(--font-mono); white-space:nowrap;">${money(g.money)}</td>
      </tr>`).join('')}
      ${rest.length ? `<tr><td colspan="3" style="padding:4px 0; color:var(--text-faint);">
        and ${rest.length} other part${rest.length === 1 ? 'y' : 'ies'}, ${restRows} row(s)</td>
        <td style="padding:4px 0; text-align:right; font-family:var(--font-mono); color:var(--text-faint);">${money(restMoney)}</td></tr>` : ''}
    </table>`;
}

/* Her payment rows carry both '2026-07-27' and '09/09/2026'. Shown one way
   here whatever is stored, because two date formats in one column is the
   detail that makes a screen look unfinished. */
function fmtDay(d) {
  const s = String(d == null ? '' : d).trim();
  const us = s.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{4})$/);
  const iso = us ? `${us[3]}-${String(us[1]).padStart(2, '0')}-${String(us[2]).padStart(2, '0')}` : s.slice(0, 10);
  return /^\d{4}-\d{2}-\d{2}$/.test(iso) ? iso : s;
}

async function renderReconcile() {
  let d = null;
  try { d = await api('/api/bank/reconcile'); } catch (e) { d = { error: e.message }; }
  STATE.recon = d;
  if (d.error) {
    $('recon').innerHTML = `<div class="card"><div class="lbl">bank vs books</div>
      <div class="note">${esc(d.error)}</div></div>`;
    return;
  }
  const out = [];
  /* ── IS THE FEED ALIVE? FIRST, ABOVE EVERYTHING ────────────────────
     A reconciliation is only as true as the date of the data under it.
     A dead Plaid connection throws nothing — the sync just returns no
     rows — so on a quiet day every figure below would agree perfectly
     about a feed that stopped a fortnight ago. This sits at the top
     because it is the one line that invalidates the rest. */
  const f = d.feed || {};
  if (!f.ok) {
    out.push(`<div class="card"><div class="lbl">the bank feed is not current</div>
      <div class="note">${esc(f.note || 'the feed has not synced recently')}${
        f.lastSyncAt ? ' — last sync ' + esc(String(f.lastSyncAt).slice(0, 10)) : ''}.
      Everything below is computed from whatever was pulled before that, so it cannot tell you
      about anything that has happened since.</div></div>`);
  }
  const j = d.journal || {};
  if (!j.complete) {
    out.push(`<div class="card"><div class="lbl">the books are not complete yet</div>
      <div class="note">${(j.problems || []).length} entr${(j.problems || []).length === 1 ? 'y' : 'ies'} could not be
      posted${j.unplaced ? ' and ' + j.unplaced + ' row(s) sit on no company' : ''}. Every figure below is a
      floor, not a total — fix these first or the agreement means nothing.</div>
      ${(j.problems || []).slice(0, 6).map((p) => `<div class="desc">${esc(p)}</div>`).join('')}</div>`);
  }

  out.push(`<h2 class="sec">${d.nothingNeedsYou
    ? 'Nothing needs you — the bank and the books moved the same money'
    : 'The bank and the books do not agree yet'}</h2>`);

  for (const b of (d.banks || [])) {
    const r = b.reconcile || {};
    if (!r.ok) {
      out.push(`<div class="card"><div class="lbl">${esc(b.bank)}</div><div class="note">${esc(r.problem || '')}</div></div>`);
      continue;
    }
    const u = b.unexplained || {};

    /* ── NOTHING TO COMPARE IS ONE SENTENCE, NOT SIXTY-SIX ROWS ──────
       Apsara, 2026-10-08: "no structure.nothing was there.how can you
       expect a customer to pay me from this."
       She was right, and the fix is not prettier rows. With no feed for
       an account, every payment in her books came back as "the bank
       never did this" — one fact, printed once per payment. */
    if (r.noFeedRows) {
      const w = (u.booksWaiting || {});
      out.push(`<div class="card">
        <div class="row1">
          <span class="lbl">${esc(r.name || b.bank)}</span>
          <span class="chip warn">no bank rows yet</span>
        </div>
        <div class="note" style="margin-top:6px">Jarvis has ${w.count || 0} payment(s) of its own
        against this account, ${money(w.money || 0)} in all, and nothing from the bank to check them
        against. That is not a disagreement — it is one missing side. Link the account, or pull
        transactions, and this becomes a real comparison.</div>
      </div>`);
      continue;
    }

    /* Grouped by party, not listed flat. Sixty rows of "Mario" is one
       supplier and one question; sixty lines is neither. */
    const byParty = (rows, label) => {
      const m = new Map();
      for (const x of rows) {
        const k = x.party || x.desc || x.kind || '(no name)';
        const cur = m.get(k) || { party: k, n: 0, money: 0, first: x.date, last: x.date, kind: x.kind };
        cur.n += 1; cur.money += Number(x.amount) || 0;
        if (String(x.date) < String(cur.first)) cur.first = x.date;
        if (String(x.date) > String(cur.last)) cur.last = x.date;
        m.set(k, cur);
      }
      return [...m.values()].sort((a, c) => c.money - a.money).map((g) => ({ ...g, which: label }));
    };
    const orphans = [].concat(
      byParty((u.bankNotInBooks || {}).in || [], 'arrived, not recorded'),
      byParty((u.bankNotInBooks || {}).out || [], 'left, not recorded'));
    const mine = [].concat(
      byParty((u.booksNotInBank || {}).in || [], 'recorded as received'),
      byParty((u.booksNotInBank || {}).out || [], 'recorded as paid'));

    out.push(`<div class="card">
      <div class="row1">
        <span class="lbl">${esc(r.name || b.bank)}</span>
        <span class="chip ${r.agrees ? 'on' : 'warn'}">${r.agrees ? 'movement agrees' : 'does not agree'}</span>
      </div>
      <div class="row1" style="margin-top:6px">
        <span class="desc">in — bank ${money(r.feed.in)} · books ${money(r.books.in)}</span>
        <span class="amt" style="color:${Math.abs(r.inGap) < 0.005 ? 'var(--text-faint)' : '#EA3323'}">${money(r.inGap)}</span>
      </div>
      <div class="row1">
        <span class="desc">out — bank ${money(r.feed.out)} · books ${money(r.books.out)}</span>
        <span class="amt" style="color:${Math.abs(r.outGap) < 0.005 ? 'var(--text-faint)' : '#EA3323'}">${money(r.outGap)}</span>
      </div>
      ${(r.books.byEntity || []).length > 1 ? `<div class="note">One bank account, several sets of books:
        ${(r.books.byEntity || []).map((e) => esc(e.entity) + ' ' + money(e.net)).join(' · ')}</div>` : ''}
      ${r.feed.pendingHeldBack ? `<div class="note">${r.feed.pendingHeldBack} pending row(s) held back — a pending
        amount still changes and the row can vanish, so counting it would send you looking for a problem that
        resolves itself overnight.</div>` : ''}
      ${r.feed.excluded.count ? `<div class="note">${r.feed.excluded.count} excluded row(s) are still IN the bank
        total above (${money(r.feed.excluded.out)} out, ${money(r.feed.excluded.in)} in) — the money moved
        whatever you decided it was for.</div>` : ''}
      ${groupBlock(orphans, 'The bank moved money Jarvis has no record of')}
      ${groupBlock(mine, 'Jarvis recorded money moving that the bank did not — usually entered twice, or entered before it was sent')}
      <div class="note" style="margin-top:8px">${esc(r.compares)}. ${esc(r.anchorNeeded)}.</div>
    </div>`);
  }
  $('recon').innerHTML = out.join('');
}

/* ── MONEY OUT, LAID OUT THE WAY SHE ALREADY READS ONE ────────────────
   Apsara, 2026-10-08: "i want like pending,posted transactions like qb
   with match,post", then on a mock-up, "add as a carrier bill that is
   also better".

   QuickBooks' shape, her words in the buttons. The states and their
   buttons come from the server — helpers/bankReview.js — so the screen
   cannot invent an action the server will not take. */
async function renderReview() {
  let d = null;
  try { d = await api('/api/bank/review'); } catch (e) { d = { error: e.message }; }
  if (d.error) {
    $('review').innerHTML = `<div class="card"><div class="lbl">money out</div>
      <div class="note">${esc(d.error)}</div></div>`;
    return;
  }
  STATE.review = d;
  const q = d.queue || { rows: [], counts: {} };
  const out = [];

  out.push(`<h2 class="sec">Money out <span class="n">${q.rows.length}</span></h2>`);

  /* Same rule as the reconciliation: an incomplete journal makes every
     figure a floor, and a SHORT queue reads as a quiet morning. */
  if (d.note) out.push(`<div class="card"><div class="note">${esc(d.note)}</div></div>`);

  if (!q.rows.length) {
    out.push('<div class="card"><div class="note">Nothing waiting. Every withdrawal the bank has sent '
      + 'is either matched to a payment you recorded, or set aside.</div></div>');
    $('review').innerHTML = out.join('');
    countTabs();
    return;
  }

  /* The one-press offer covers EXACT MATCHES only. A match creates
     nothing — it ties two existing records together. */
  if (q.canPostAll) {
    out.push(`<div class="surebar">
      <span class="desc">${q.canPostAll} row(s) match a payment you already recorded, to the cent.</span>
      <button class="btn solid" data-reviewall="1">Match all ${q.canPostAll}</button>
      <span class="note" style="margin:0">Only exact matches. Anything combined, approximate or ambiguous stays here.</span>
    </div>`);
  }

  /* ── THE ROWS THAT WOULD CREATE A RECORD GET NO BUTTON YET ──────────
     "Add as a carrier bill" writes a new record into her books. It goes
     through ledgerPlan/ledgerApply — verify, preview, confirm, apply with
     an undo — and that is not wired. So those rows show WHAT Jarvis would
     do, as a label, and no button. A dead button is worse than a missing
     one. */
  const creates = q.rows.filter((r) => r.state === 'add' || r.state === 'choose' || r.state === 'ask');
  if (creates.length) {
    out.push(`<div class="card"><div class="note">${creates.length} row(s) below would CREATE a record
      rather than tie two together. Those go through the plan screen, so you can see what each one does
      to what you owe before it happens — not built yet, so they are listed without a button.</div></div>`);
  }

  out.push(q.rows.map((r) => {
    const warn = r.state === 'choose' ? ' style="color:var(--amber-500)"' : '';
    return `<div class="card" data-dir="out" data-k="${esc([r.descriptor, r.amount, r.date, r.label].join(' ').toLowerCase())}" style="border-left:4px solid ${r.state === 'match' ? 'var(--leaf-500)' : 'var(--steel-500)'}">
      <div class="row1" style="align-items:flex-start;">
        <span class="when" style="min-width:76px">${esc(fmtDay(r.date))}</span>
        <span class="desc" style="flex:1; min-width:0;">
          <span${warn}>${esc(r.descriptor || '(no description)')}</span>
          <div class="note" style="margin:2px 0 0">${esc(r.why || '')}</div>
        </span>
        <span class="amt" style="font-size:15px; white-space:nowrap;">−${money(r.amount)}</span>
      </div>
      <div class="acts" style="margin-top:6px">
        ${r.state === 'match'
          ? `<button class="btn solid" data-reviewmatch="${esc(r.id)}">Match</button>`
          : `<span class="chip ${r.state === 'choose' ? 'warn' : ''}" title="${esc(r.why || '')}">${esc(r.label)}</span>`}
        ${r.state === 'match' ? '' : ruleBtn(r.descriptor, 'out')}
      </div>
    </div>`;
  }).join(''));

  $('review').innerHTML = out.join('');
  countTabs();
  applyFilter();
}

/* ── THE MATCH BUTTON ──────────────────────────────────────────────────
   A match ties two existing records together and creates nothing, which
   is what makes it safe to press in bulk. */
async function doMatch(id) {
  try {
    const r = await api('/api/bank/review/match', { body: { id } });
    toast(`Matched · ${r.matched} payment(s)`, 'good');
    return true;
  } catch (e) {
    /* 409 means the row moved on since the page loaded. The server
       recomputes rather than trusting the screen, so this is the honest
       answer and not a failure. */
    toast(e.message, 'bad');
    return false;
  }
}

/* ── tabs, money in/out, search, keyboard ─────────────────────────────── */
function showTab(name) {
  STATE.tab = name;
  document.querySelectorAll('[data-tab]').forEach((b) => {
    const on = b.dataset.tab === name;
    b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  document.querySelectorAll('[data-pane]').forEach((p) => { p.hidden = p.dataset.pane !== name; });
}
function applyFilter() {
  const q = STATE.q.trim().toLowerCase();
  const dir = STATE.dir;
  document.querySelectorAll('[data-pane="review"] .card[data-dir]').forEach((c) => {
    const d = c.dataset.dir;
    const dirOk = dir === 'all' || d === dir || d === 'both';
    const qOk = !q || (c.dataset.k || '').includes(q) || c.textContent.toLowerCase().includes(q);
    c.hidden = !(dirOk && qOk);
  });
  $('inblock').hidden = dir === 'out';
  $('review').hidden = dir === 'in';
}
function moveFocus(step) {
  const cards = [...document.querySelectorAll('[data-pane="review"] .card[data-dir]')].filter((c) => !c.hidden);
  if (!cards.length) return;
  let i = cards.findIndex((c) => c.classList.contains('focus'));
  cards.forEach((c) => c.classList.remove('focus'));
  i = Math.max(0, Math.min(cards.length - 1, i + step));
  cards[i].classList.add('focus');
  cards[i].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
document.addEventListener('keydown', (ev) => {
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test((ev.target && ev.target.tagName) || '');
  if (typing || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (ev.key === '/') { ev.preventDefault(); showTab('review'); $('q').focus(); return; }
  const tabs = ['review', 'aside', 'recon', 'setup'];
  if (/^[1-4]$/.test(ev.key)) { showTab(tabs[Number(ev.key) - 1]); return; }
  if (ev.key === 'j') moveFocus(1);
  if (ev.key === 'k') moveFocus(-1);
});
$('q').addEventListener('input', (ev) => { STATE.q = ev.target.value || ''; applyFilter(); });

/* A click anywhere on the box opens the calendar (where the browser allows
   it), and picking a day selects it and closes the calendar by itself. */
for (const id of ['from', 'to']) {
  const el = $(id);
  el.addEventListener('click', () => { try { if (el.showPicker) el.showPicker(); } catch (e) { /* not allowed here */ } });
  el.addEventListener('change', () => setRange({ ...STATE.range, [id]: el.value || '', preset: 'custom' }));
}

document.addEventListener('click', async (ev) => {
  const tab = ev.target.closest('[data-tab]');
  if (tab) return showTab(tab.dataset.tab);
  const pre = ev.target.closest('[data-preset]');
  if (pre) return setRange({ ...presetRange(pre.dataset.preset), preset: pre.dataset.preset });
  const dirb = ev.target.closest('[data-dir]');
  if (dirb && dirb.closest('#dir')) {
    STATE.dir = dirb.dataset.dir;
    document.querySelectorAll('#dir [data-dir]').forEach((b) => b.classList.toggle('on', b === dirb));
    return applyFilter();
  }

  const one = ev.target.closest('[data-reviewmatch]');
  if (one) {
    one.disabled = true;
    if (await doMatch(one.getAttribute('data-reviewmatch'))) renderReview();
    else { one.disabled = false; renderReview(); }
    return;
  }
  const all = ev.target.closest('[data-reviewall]');
  if (all) {
    all.disabled = true;
    /* One at a time, deliberately — bankLedger.markMatched is one row, one
       lock, one atomic write. A failure half way leaves the ones before it
       genuinely matched and SAYS SO. */
    const ids = ((STATE.review && STATE.review.queue.rows) || [])
      .filter((r) => r.state === 'match').map((r) => r.id);
    let ok = 0;
    for (const id of ids) { if (await doMatch(id)) ok += 1; else break; }
    toast(ok === ids.length ? `Matched all ${ok}` : `Matched ${ok} of ${ids.length} — stopped at the first problem`,
      ok === ids.length ? 'good' : 'bad');
    renderReview();
    return;
  }

  /* Record a transfer between her companies as a loan. */
  const tr = ev.target.closest('[data-transfer]');
  if (tr) {
    const t = STATE.transfers || {};
    const p = [...(t.proposed || []), ...(t.one_sided || [])].find((x) => x.id === tr.dataset.transfer);
    if (!p) return;
    tr.disabled = true; tr.textContent = 'Recording…';
    try {
      await api('/api/intercompany/transfers', { body: { from: p.from, to: p.to, amount: p.amount,
        out_id: p.out_row ? p.out_row.id : null, in_id: p.in_row ? p.in_row.id : null, treatment: 'loan' } });
      toast(`Recorded as a loan: ${COMPANY[p.from]} → ${COMPANY[p.to]} ${money(p.amount)}`, 'good');
      load();
    } catch (e) { tr.disabled = false; tr.textContent = 'Record as a loan'; toast(e.message, 'bad'); }
    return;
  }
  const un = ev.target.closest('[data-untransfer]');
  if (un) {
    if (!confirm('Undo this transfer? The loan comes off both companies\' books and the bank lines go back in the review list.')) return;
    try { await api('/api/intercompany/transfers', { method: 'DELETE', body: { id: un.dataset.untransfer } });
      toast('Undone', 'good'); load(); } catch (e) { toast(e.message, 'bad'); }
    return;
  }

  /* A rule from a row: say what it is, see how many lines it covers, then
     decide. Nothing happens before the second answer. */
  const rb = ev.target.closest('[data-rule-desc]');
  if (rb) {
    const dir = rb.dataset.ruleDir;
    const guess = String(rb.dataset.ruleDesc || '').toUpperCase().replace(/[#:]?\b[\dA-Z]*\d{3,}[\dA-Z]*\b/g, ' ').replace(/\s+/g, ' ').trim();
    const text = prompt('Set aside every money-' + dir + ' line whose description contains:', guess);
    if (text === null) return;
    const labels = ((STATE.rules || {}).labels || ['Bank charge']);
    const label = prompt('What are these lines? (for example: ' + labels.join(', ') + ')', labels[0]);
    if (label === null) return;
    try {
      const dry = await api('/api/bank/rules', { body: { text, direction: dir, label, dry: true } });
      if (!confirm(`This sets aside ${dry.would} line(s) now (${money(dry.money)}), and every future money-${dir} line containing “${dry.rule.text}”, as "${dry.rule.label}".\n\nEach one can be put back. Go ahead?`)) return;
      const r = await api('/api/bank/rules', { body: { text, direction: dir, label } });
      toast(`Rule saved · ${r.applied} line(s) set aside`, 'good');
      load();
    } catch (e) { toast(e.message, 'bad'); }
    return;
  }
  const rd = ev.target.closest('[data-rule-del]');
  if (rd) {
    try { await api('/api/bank/rules', { method: 'DELETE', body: { text: rd.dataset.ruleDel, direction: rd.dataset.ruleDeldir } });
      toast('Rule deleted — lines it already set aside stay set aside', 'good'); renderRules(); } catch (e) { toast(e.message, 'bad'); }
    return;
  }

  /* Confirm every sure deposit, one receipt at a time, stopping at the
     first refusal — the same discipline as "Match all" above. */
  const sa = ev.target.closest('[data-sureall]');
  if (sa) {
    const list = STATE.bulk || [];
    if (!confirm(`Record ${list.length} receipts? Each pays its invoices in full.`)) return;
    sa.disabled = true;
    let ok = 0;
    for (const { r, mode } of list) {
      const p = r.proposals[0];
      try {
        await api('/api/sales-receipts', { body: {
          date: r.deposit.date, amount: r.deposit.amount, mode, bank: r.deposit.bank_guess,
          customer: r.party, ref: r.deposit.id, note: 'matched from the bank feed',
          allocations: p.allocations.map((a) => ({ sale_id: a.doc_id, amount: a.amount })) } });
        ok += 1;
      } catch (e) { toast(`Stopped at ${r.party} ${money(r.deposit.amount)}: ${e.message}`, 'bad'); break; }
    }
    toast(ok === list.length ? `Recorded all ${ok}` : `Recorded ${ok} of ${list.length}`, ok === list.length ? 'good' : 'bad');
    load();
  }
});

}

function showExcluded() {
  const L = (STATE.data || {}).ledger || {};
  showTab('aside');
  renderExtras();
  $('extras').insertAdjacentHTML('afterbegin', `<h2 class="sec">Excluded — set aside, still counted</h2>
    <div class="card"><div class="row1"><span class="amt">${money((L.excluded || {}).money)}</span>
      <span class="desc">${(L.excluded || {}).count || 0} row(s)</span></div>
      <div class="note">Excluded rows leave this worklist but stay in the ledger with their total, and any one of them can be put back. Nothing is deleted.</div></div>`);
}

document.addEventListener('click', async (ev) => {
  const t = ev.target.closest('[data-reload],[data-show],[data-learn],[data-learnfree],[data-forget],[data-exclude],[data-confirm],[data-plaid],[data-unlink]');
  if (!t) return;

  if (t.dataset.reload) return load();

  if (t.dataset.unlink) {
    if (!confirm('Unlink this bank? Jarvis stops pulling new transactions. The ones already pulled stay.')) return;
    try { await api('/api/plaid/item', { method: 'DELETE', body: { item_id: t.dataset.unlink } });
      toast('Unlinked', 'good'); load(); } catch (e) { toast(e.message, 'bad'); }
    return;
  }

  if (t.dataset.plaid === 'sync') {
    t.disabled = true; const was = t.textContent; t.textContent = 'Pulling…';
    try {
      const r = await api('/api/plaid/sync', { body: {} });
      /* Partial failure comes back as a 200 with errors in it, because one
         bank needing re-authentication must not throw away the other
         bank's deposits. So both halves are reported. */
      const parts = [`${r.added} new`, r.modified ? `${r.modified} corrected` : '', (r.removed || []).length ? `${r.removed.length} removed by the bank` : '',
        (r.rules && r.rules.applied) ? `${r.rules.applied} set aside by your rules` : ''].filter(Boolean);
      toast(parts.join(', ') || 'nothing new', 'good');
      for (const e of (r.errors || [])) toast(`${e.institution || e.item_id}: ${e.error}`, 'bad');
      if (r.truncated) toast('Stopped early — press again to keep pulling', 'bad');
      load();
    } catch (e) { toast(e.message, 'bad'); }
    t.disabled = false; t.textContent = was;
    return;
  }

  if (t.dataset.plaid === 'sandbox') {
    try { await api('/api/plaid/sandbox-link', { body: {} }); toast('Test bank linked — now press Pull', 'good'); load(); }
    catch (e) { toast(e.message, 'bad'); }
    return;
  }

  /* Sign in again to a bank already linked — Plaid's update mode. Same
     link, same history; nothing to exchange afterwards, so the server just
     clears the flag and pulls. */
  if (t.dataset.plaid === 'reconnect') {
    const item = t.dataset.item;
    let token = null;
    try { token = (await api('/api/plaid/link-token', { body: { item_id: item } })).link_token; }
    catch (e) { return toast(e.message, 'bad'); }
    const ok = await loadPlaidLink();
    if (!ok) return toast('Could not load Plaid Link from the internet — check the server can reach cdn.plaid.com', 'bad');
    window.Plaid.create({
      token,
      onSuccess: async () => {
        try {
          const r = await api('/api/plaid/reconnected', { body: { item_id: item } });
          toast(`Signed in again · ${r.added || 0} new line(s)`, 'good');
          load();
        } catch (e) { toast(e.message, 'bad'); }
      },
      onExit: (err) => { if (err) toast('Sign-in closed: ' + (err.display_message || err.error_code || 'cancelled'), 'bad'); },
    }).open();
    return;
  }

  if (t.dataset.plaid === 'connect') {
    let token = null;
    try { token = (await api('/api/plaid/link-token', { body: {} })).link_token; }
    catch (e) { return toast(e.message, 'bad'); }
    const ok = await loadPlaidLink();
    /* Said out loud rather than failing silently: a blocked CDN is a
       different problem from a wrong key, and they need different fixes. */
    if (!ok) return toast('Could not load Plaid Link from the internet — check the server can reach cdn.plaid.com', 'bad');
    window.Plaid.create({
      token,
      onSuccess: async (publicToken, meta) => {
        try {
          await api('/api/plaid/exchange', { body: { public_token: publicToken,
            institution: (meta && meta.institution && meta.institution.name) || null } });
          toast('Bank linked — now press Pull', 'good');
          load();
        } catch (e) { toast(e.message, 'bad'); }
      },
      onExit: (err) => { if (err) toast('Link closed: ' + (err.display_message || err.error_code || 'cancelled'), 'bad'); },
    }).open();
    return;
  }
  if (t.dataset.show === 'aliases') return showAliases();
  if (t.dataset.show === 'excluded') return showExcluded();

  if (t.dataset.learn || t.dataset.learnfree != null) {
    const customer = t.dataset.learn
      || (($(`list`).querySelector(`[data-name="${t.dataset.learnfree}"]`) || {}).value || '').trim();
    if (!customer) return toast('Whose payment is it?', 'bad');
    try {
      await api('/api/bank/aliases', { body: { descriptor: t.dataset.desc, customer, why: 'confirmed on the bank matching screen' } });
      toast(`Remembered: ${customer}`, 'good');
      load();
    } catch (e) { toast(e.message, 'bad'); }
    return;
  }

  if (t.dataset.forget) {
    try {
      await api('/api/bank/aliases', { method: 'DELETE', body: { descriptor: t.dataset.forget } });
      toast('Forgotten', 'good');
      showAliases(); load();
    } catch (e) { toast(e.message, 'bad'); }
    return;
  }

  /* Excluding asks for a reason. "Why is this excluded" is a question asked
     months later by someone who was not here. */
  if (t.dataset.exclude) {
    const reason = prompt('Why is this not a customer payment?\n(a card fee, an owner draw, a transfer between your own accounts…)');
    if (reason === null) return;
    try {
      await api('/api/bank/exclude', { body: { id: t.dataset.exclude, reason } });
      toast('Set aside — still counted, and reversible', 'good');
      load();
    } catch (e) { toast(e.message, 'bad'); }
    return;
  }

  if (t.dataset.confirm != null) {
    const i = Number(t.dataset.confirm);
    const row = (STATE.data.rows || [])[i];
    const p = (row.proposals || [])[0];
    if (!row || !p) return;
    const card = t.closest('.card');
    const mode = (card.querySelector(`[data-mode="${i}"]`) || {}).value || '';
    const bank = (card.querySelector(`[data-bank="${i}"]`) || {}).value || '';

    /* The shortfall is a deduction, not a rounding. salesReceipts.js keeps
       them apart because a bank charge is a cost to Edge Metals and a
       discount reduces what was earned. If there is one, she says which —
       and if it looks like her customer's claim, the question says so. */
    const short = p.allocations.reduce((s, a) => s + (a.shortfall || 0), 0);
    let reason = null;
    if (short > 0.005) {
      const h = row.claim_hint;
      const hint = h ? `\n\nIt is close to the claim on ${h.invoice_no} (${money(h.claim_amount)}) — if the customer deducted their claim, that is a "discount".` : '';
      const ans = prompt(`This deposit is ${money(short)} short of the invoice total.\n\nType "fee" if the bank took it in transit, or "discount" if you agreed to take less.${hint}`);
      if (ans === null) return;
      reason = /^f/i.test(ans) ? 'bank_charge' : (/^d/i.test(ans) ? 'discount' : null);
      if (!reason) return toast('Not recorded — a shortfall has to be a fee or a discount', 'bad');
    }

    t.disabled = true; t.textContent = 'Recording…';
    try {
      await api('/api/sales-receipts', { body: {
        date: row.deposit.date, amount: row.deposit.amount, mode, bank,
        customer: row.party, ref: row.deposit.id,
        note: 'matched from the bank feed',
        allocations: p.allocations.map((a) => ({
          sale_id: a.doc_id, amount: a.amount,
          ...(a.shortfall ? { deduction_amount: a.shortfall, deduction_reason: reason } : {}),
        })),
      } });
      toast('Receipt recorded', 'good');
      load();
    } catch (e) {
      t.disabled = false; t.textContent = 'Confirm — record this receipt';
      toast(e.message, 'bad');
    }
  }
});

loadRange();
paintRange();
load();
</script>
<!-- The app's sidebar on this page too (Apsara 2026-10-08: "i want the sidebar to appear in all pages").
     dashboard/sidebar.js; hidden when printing. -->
<script src="/sidebar.js" data-page="bank" defer></script>
</body>
