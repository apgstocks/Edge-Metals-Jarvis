/* ── A PLAN FOR A CARRIER PAYMENT ───────────────────────────────────────
   Apsara, 2026-10-13: "plan screen should be there... apply for Jarvis only."
   Anyone who is an admin can build and PREVIEW a plan (it writes nothing); only
   the Jarvis profile can APPLY one. The plan here is two steps: add the carrier's
   bill, then mark it paid by this bank line. Neither step can be undone (the carrier
   store has no delete or un-pay), and the preview says so before the button. */
function carrierOf(desc) { const m = /\b(ntg|tql|schneider)\b/i.exec(String(desc || '')); return m ? m[1].toLowerCase() : ''; }
function planHtml(r) {
  const car = carrierOf(r.descriptor);
  return `<div class="plan" data-plan="${esc(r.id)}" data-plan-amount="${esc(r.amount)}" data-plan-date="${esc(r.date)}" data-plan-bank="${esc(r.bank || '')}"
      style="margin-top:10px;padding:10px 12px;border:1px solid var(--line, #2B3239);border-radius:8px">
    <div class="row1" style="gap:8px;flex-wrap:wrap;align-items:center">
      <strong>Add the carrier bill and mark it paid</strong>
      <select data-plan-carrier aria-label="Carrier">
        <option value=""${car ? '' : ' selected'}>Which carrier?</option>
        ${['tql', 'ntg', 'schneider'].map((c) => `<option value="${c}"${c === car ? ' selected' : ''}>${c.toUpperCase()}</option>`).join('')}
      </select>
      <input data-plan-ref placeholder="Their invoice number" aria-label="Invoice number" style="min-width:160px">
      <button class="btn" data-plan-preview="${esc(r.id)}">Preview plan</button>
    </div>
    <div class="note" style="margin-top:6px">${money(r.amount)} on ${esc(r.date)}. Nothing is written until the Jarvis profile applies it.</div>
    <div data-plan-out></div>
  </div>`;
}
/* The preview, however the plan was made: steps in words, what is wrong with it if
   anything, what each supplier is owed before and after, the warning that a step cannot
   be undone, and Apply only for the Jarvis profile. */
function preHtml(p, key) {
  const irreversible = ((p.undo || {}).irreversible || []);
  const diff = p.diff || [];
  return `<ol style="margin:8px 0 0 18px">${(p.steps || []).map((s) => `<li>${esc(typeof s === 'string' ? s : (s.says || JSON.stringify(s)))}</li>`).join('')}</ol>
    ${(p.problems || []).length ? `<div class="note" style="color:var(--bad, #C5402F)">${p.problems.map((x) => esc((x.step ? 'Step ' + x.step + ': ' : '') + (x.why || x))).join('<br>')}</div>` : ''}
    ${p.ok && diff.length ? `<table style="margin-top:8px;width:100%;font-size:12.5px"><thead><tr><th align="left">Supplier</th><th align="right">Owed before</th><th align="right">Owed after</th></tr></thead><tbody>
      ${diff.map((d) => `<tr><td>${esc(d.supplier)}</td><td align="right">${money((d.owed || {}).before)}</td><td align="right"><strong>${money((d.owed || {}).after)}</strong></td></tr>`).join('')}</tbody></table>` : ''}
    ${p.ok && (p.carrierDiff || []).length ? `<div class="note">${(p.carrierDiff || []).map((d) => esc(d.carrier ? `${String(d.carrier).toUpperCase()}: ${JSON.stringify(d)}` : JSON.stringify(d))).join('<br>')}</div>` : ''}
    ${p.ok && irreversible.length ? `<div class="note" style="color:var(--amber-500)"><strong>This cannot be undone.</strong> ${esc(irreversible.map((x) => x.why).filter(Boolean)[0] || 'A mistake here is corrected by hand.')}</div>` : ''}
    ${p.ok ? (IS_SUPER
      ? `<div class="acts" style="margin-top:8px"><button class="btn solid" data-plan-apply="${esc(key)}">Apply plan</button></div>`
      : `<div class="note" style="margin-top:8px">Applying needs the <strong>Jarvis profile</strong>. Sign in with it to apply; you can preview as an admin.</div>`) : ''}`;
}

/* ── A PLAN FROM A SENTENCE ─────────────────────────────────────────────
   Her words go to /api/ledger/plan/propose; what comes back is a PROPOSAL, shown with
   anything Jarvis could not tell (as questions, not guesses), anything it assumed, and
   anything it refused to include. It reaches the books only through Apply. */
async function sentencePlan() {
  const out = $('planOut'), text = $('planText').value.trim();
  if (text.length < 8) { out.innerHTML = '<div class="note">Say what you want changed.</div>'; return; }
  $('planGo').disabled = true; out.innerHTML = '<div class="note">Reading the books…</div>';
  await loadMe();
  try {
    const r = await api('/api/ledger/plan/propose', { body: { sentence: text } });
    STATE.sentence = { plan: r.plan, pre: r.preview, planId: 'sentence-' + Date.now(), asked: r.asked };
    out.innerHTML = `
      ${(r.questions || []).length ? `<div class="note" style="border-left:3px solid var(--amber-500)"><strong>Jarvis needs you to say:</strong><br>${r.questions.map(esc).join('<br>')}</div>` : ''}
      ${(r.assumptions || []).length ? `<div class="note"><strong>Jarvis assumed — check these:</strong><br>${r.assumptions.map(esc).join('<br>')}</div>` : ''}
      ${(r.dropped || []).length ? `<div class="note">Left out: ${r.dropped.map(esc).join('; ')}</div>` : ''}
      ${r.error ? `<div class="note" style="color:var(--bad, #C5402F)">${esc(r.error)}</div>` : ''}
      ${r.preview ? preHtml(r.preview, 'sentence') : (r.error || (r.questions || []).length ? '' : '<div class="note">No plan could be made from that.</div>')}
      ${r.considered ? `<div class="note" style="opacity:.7">Looked at ${r.considered.bills} bill(s), ${r.considered.payments} payment(s) and ${r.considered.carriers} carrier bill(s) that your words pointed to.</div>` : ''}`;
  } catch (e) { out.innerHTML = `<div class="note" style="color:var(--bad, #C5402F)">${esc(e.message)}</div>`; }
  $('planGo').disabled = false;
}
async function sentenceApply(btn) {
  const s = STATE.sentence;
  if (!s || !s.pre || !s.pre.ok) return;
  const part = ((s.pre.undo || {}).irreversible || []).length ? '\n\nPart of it cannot be undone.' : '';
  if (!confirm('Apply this plan?\n\n' + (s.pre.steps || []).map((x) => '• ' + (x.says || x)).join('\n') + part)) return;
  btn.disabled = true;
  try {
    await api('/api/ledger/plan/apply', { body: { plan: s.plan, planId: s.planId, asked: s.asked, approvedDiff: s.pre.approvedDiff, approvedCarrierDiff: s.pre.approvedCarrierDiff } });
    toast('Applied. It is in the list below.', 'good');
    $('planOut').innerHTML = '<div class="note">Applied.</div>'; STATE.sentence = null;
    renderPlans(); renderReview();
  } catch (e) { btn.disabled = false; toast(e.message, 'bad'); }
}

function planSteps(box) {
  const carrier = box.querySelector('[data-plan-carrier]').value, ref = box.querySelector('[data-plan-ref]').value.trim();
  const amount = Number(box.dataset.planAmount), date = box.dataset.planDate;
  return [
    { op: 'create-carrier-invoice', carrier, ref, amount, invoice_date: date },
    { op: 'pay-carrier-invoice', carrier_invoice_id: '#1', amount, date, mode: 'Bank transfer', bank: box.dataset.planBank || null,
      note: 'from bank line ' + box.dataset.plan },
  ];
}
async function planPreview(box) {
  const out = box.querySelector('[data-plan-out]');
  const plan = planSteps(box);
  if (!plan[0].carrier) { out.innerHTML = '<div class="note">Pick the carrier.</div>'; return; }
  if (!plan[0].ref) { out.innerHTML = '<div class="note">Type the carrier\'s invoice number — the bank line does not carry it.</div>'; return; }
  try {
    const p = await api('/api/ledger/plan/preview', { body: { plan } });
    box._plan = plan; box._pre = p;
    box._planId = box._planId || ('bankrow-' + box.dataset.plan + '-' + Date.now());
    out.innerHTML = preHtml(p, box.dataset.plan);
  } catch (e) { out.innerHTML = `<div class="note" style="color:var(--bad, #C5402F)">${esc(e.message)}</div>`; }
}
async function planApply(box, btn) {
  if (!box._plan || !box._pre || !box._pre.ok) return;
  if (!confirm('Apply this plan?\n\n' + (box._pre.steps || []).map((s) => '• ' + (typeof s === 'string' ? s : (s.says || ''))).join('\n') + '\n\nIt cannot be undone.')) return;
  btn.disabled = true;
  try {
    const r = await api('/api/ledger/plan/apply', { body: { plan: box._plan, planId: box._planId, asked: 'Add carrier bill and mark paid, from bank line ' + box.dataset.plan,
      approvedDiff: box._pre.approvedDiff, approvedCarrierDiff: box._pre.approvedCarrierDiff } });
    toast('Applied. The bank line should now show as a Match.', 'good');
    renderReview().then(renderBooked).then(renderPlans);
  } catch (e) { btn.disabled = false; toast(e.message, 'bad'); }
}
async function renderPlans() {
  if (!IS_SUPER) { $('plans').innerHTML = ''; return; }
  let d = null;
  try { d = await api('/api/ledger/plan/log'); } catch (e) { d = null; }
  if (!d) { $('plans').innerHTML = ''; return; }
  const rows = (d.rows || []).filter((x) => x.applied);
  $('plans').innerHTML = `<h2 class="sec">Plans applied <span class="n">${rows.length}</span></h2>
    <div class="card">${rows.length ? rows.map((x) => `<div class="row1" style="margin:4px 0;flex-wrap:wrap">
        <span class="when">${esc(String(x.at || '').slice(0, 16).replace('T', ' '))}</span>
        <span class="desc">${esc(x.actor || '')}</span>
        <span class="desc" style="flex:1;min-width:160px">${esc(x.asked || (x.steps || []).map((s) => (typeof s === 'string' ? s : (s.says || ''))).join('; '))}</span>
        ${(x.irreversible || []).length ? '<span class="badge ask">cannot be undone</span>' : ''}
      </div>`).join('') : '<div class="empty">None yet.</div>'}
      <div class="note">Every applied plan is kept here with who applied it and what it was asked. Undoing from this screen is not built yet; a reversible plan can be undone by asking for the opposite change in a new sentence.</div></div>`;
}

async function renderBooked() {
  let d = null;
  try { d = await api('/api/bank/review/categorised'); } catch (e) { d = null; }
  if (!d) { $('booked').innerHTML = ''; return; }
  const rows = (d.entries || []).filter((e) => inAcct(e.account_id));
  $('booked').innerHTML = `<h2 class="sec">Booked from this screen <span class="n">${rows.length}</span></h2>
    <div class="card">${rows.length ? rows.map((e) => `<div class="row1" style="margin:4px 0">
        <span class="amt" style="font-size:14px">−${money(e.amount)}</span>
        <span class="when">${esc(e.date)}</span>
        <span class="desc">${esc(e.account)} · ${esc(e.account_name || '')}</span>
        <span class="desc" style="color:var(--text-faint);flex:1;min-width:120px">${esc(e.descriptor || '')}</span>
        <button class="btn quiet" data-uncat="${esc(e.bank_row_id)}">Undo</button>
      </div>`).join('') : '<div class="empty">Nothing yet. Open a withdrawal in For review, pick a category and Post.</div>'}
      <div class="note">Undo takes the entry out of the books and puts the line back in For review.</div></div>`;
}

async function renderReview() {
  await loadCats();
  await loadMe();
  let d = null;
  try { d = await api('/api/bank/review'); } catch (e) { d = { error: e.message }; }
  if (d.error) {
    $('review').innerHTML = `<div class="card"><div class="lbl">money out</div>
      <div class="note">${esc(d.error)}</div></div>`;
    STATE.outCards = '';
    mergeOut();
    return;
  }
  STATE.review = d;
  const q = d.queue || { rows: [], counts: {} };
  const out = [];

  /* Same rule as the reconciliation: an incomplete journal makes every
     figure a floor, and a SHORT queue reads as a quiet morning. */
  if (d.note) out.push(`<div class="card"><div class="note">${esc(d.note)}</div></div>`);

  if (!q.rows.length) {
    // No withdrawals waiting is not news on a list that also holds the
    // deposits — the empty list says it. Only a note from the server shows.
    $('review').innerHTML = out.join('');
    STATE.outCards = '';
    mergeOut();
    countTabs();
    applyFilter();
    return;
  }

  /* The one-press offer covers EXACT MATCHES only. A match creates
     nothing — it ties two existing records together. */
  const sureOut = q.rows.filter((r) => r.state === 'match' && inAcct(r.account_id)).length;
  if (sureOut) {
    out.push(`<div class="surebar">
      <span class="desc">${sureOut} row(s) match a payment you already recorded, to the cent.</span>
      <button class="btn solid" data-reviewall="1">Match all ${sureOut}</button>
      <span class="note" style="margin:0">Only exact matches. Anything combined, approximate or ambiguous stays here.</span>
    </div>`);
  }

  /* ── THE ROWS THAT WOULD CREATE A RECORD GET NO BUTTON YET ──────────
     "Add as a carrier bill" writes a new record into her books. It goes
     through ledgerPlan/ledgerApply — verify, preview, confirm, apply with
     an undo — and that is not wired. So those rows show WHAT Jarvis would
     do, as a label, and no button. A dead button is worse than a missing
     one. */
  const creates = q.rows.filter((r) => r.state === 'add' || r.state === 'choose' || r.state === 'ask');
  if (creates.length) {
    out.push(`<div class="card"><div class="note">${creates.length} row(s) below would CREATE a record rather than tie two
      together. Open a row: a withdrawal can be <strong>categorised</strong> (pick the account, then Post), and a
      carrier payment (TQL, NTG, Schneider) opens a <strong>plan</strong> you preview first; only the Jarvis profile can
      apply a plan. Rows with several exact fits, and deposits that match no invoice, still have no action.</div></div>`);
  /* Withdrawals Jarvis cannot tie to a record DO have an action now: open the row,
     pick a category, Post. The banner above was written before that existed. */
  }

  // The rows join the deposits in the one list (mergeOut); only the bars
  // and notes above stay here.
  STATE.outCards = q.rows.map((r) => {
    const warn = r.state === 'choose' ? ' style="color:var(--amber-500)"' : '';
    /* A row that would CREATE a record shows what Jarvis would do as a
       muted label, not a button-shaped box: there is nothing to press until
       the plan screen exists, and a box that looks pressable is the one
       she would press. */
    return `<div class="card row" data-dir="out" data-acct="${esc(r.account_id || '')}" data-date="${esc(r.date || '')}" data-k="${esc([r.descriptor, r.amount, r.date, r.label].join(' ').toLowerCase())}" style="border-left:4px solid ${r.state === 'match' ? 'var(--leaf-500)' : 'var(--steel-500)'}">
      <div class="sum" data-toggle="1" role="button" tabindex="0" aria-expanded="false">
        <span class="when">${esc(fmtDay(r.date))}</span>
        <span class="who"><strong${warn}>${esc(r.descriptor || '(no description)')}</strong></span>
        <span class="sug">${esc(r.why || '')}</span>
        <span class="conf"></span>
        <span class="amt">−${money(r.amount)}</span>
        <span class="go">${r.state === 'match'
          ? `<button class="btn solid" data-reviewmatch="${esc(r.id)}">Match</button>`
          : `<span class="needs" title="${esc(r.why || '')}">${esc(r.label)}</span>`}</span>
        <span class="chev">▶</span>
      </div>
      <div class="detail">
        ${bankTextHtml(r.bank_text, r.descriptor)}
        <div class="note" style="margin-top:10px">${esc(r.why || '')}</div>
        ${r.state === 'match' ? '' : (r.kind === 'carrier-bill' ? planHtml(r) : categoriseHtml(r))}
        <div class="acts">${r.state === 'match' ? '' : ruleBtn(r.descriptor, 'out')}</div>
      </div>
    </div>`;
  }).join('');

  $('review').innerHTML = out.join('');
  mergeOut();
  countTabs();
  applyFilter();
}

/* ── THE MATCH BUTTON ──────────────────────────────────────────────────
   A match ties two existing records together and creates nothing, which
   is what makes it safe to press in bulk. */
async function doMatch(id) {
  try {
    const r = await api('/api/bank/review/match', { body: { id } });
    toast(`Matched · ${r.matched} payment(s)`, 'good');
    return true;
  } catch (e) {
    /* 409 means the row moved on since the page loaded. The server
       recomputes rather than trusting the screen, so this is the honest
       answer and not a failure. */
    toast(e.message, 'bad');
    return false;
  }
}

/* ── tabs, money in/out, search, keyboard ─────────────────────────────── */
function showTab(name) {
  STATE.tab = name;
  document.querySelectorAll('[data-tab]').forEach((b) => {
    const on = b.dataset.tab === name;
    b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  document.querySelectorAll('[data-pane]').forEach((p) => { p.hidden = p.dataset.pane !== name; });
}
// ── ONE LIST, BY DATE ────────────────────────────────────────────────────
// Deposits are drawn by render() from /api/bank/match and withdrawals by
// renderReview() from /api/bank/review, at different moments. Each time
// either redraws, the withdrawals are put back into #list and the whole list
// is put in date order, newest first — both servers already send newest
// first, and a stable sort keeps their order within a day. Click handling is
// unchanged: every control finds its row by attribute, not by position.
const isoDay = (v) => {
  const s = String(v || '');
  const us = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s);
  return us ? `${us[3]}-${us[1].padStart(2, '0')}-${us[2].padStart(2, '0')}` : s.slice(0, 10);
};
function mergeOut() {
  const list = $('list');
  if (!list) return;
  list.querySelectorAll('.card[data-dir="out"]').forEach((n) => n.remove());
  if (STATE.outCards) list.insertAdjacentHTML('beforeend', STATE.outCards);
  const cards = [...list.querySelectorAll(':scope > .card[data-dir]')];
  if (cards.length) list.querySelectorAll(':scope > .empty').forEach((n) => n.remove());
  cards.map((c, i) => ({ c, i, d: isoDay(c.dataset.date) }))
    .sort((a, b) => b.d.localeCompare(a.d) || a.i - b.i)
    .forEach(({ c }) => list.appendChild(c));
}

// Filter FIRST, then page: the search and the in/out switch look at every
// transaction, and the pages are cut from what matched. Paging first would
// make a search answer "nothing" for a row that is simply on page 3.
// Transfers between her own companies are never paged — they sit above both
// lists and are few.
const PAGED = { in: '#list' };
/* ── ONE BANK AT A TIME (2026-10-14) ───────────────────────────────────────
   Apsara: "Make it like a toggle between banks. I will connect all the banks.
   When I click one bank that particular bank's details should come." STATE.acct
   is the chosen account card's key (null = all banks). Every row carries its
   account, so choosing filters the queue, the counts, set-aside, booked and the
   bulk buttons together — a bulk "Match all" must never act on rows you cannot
   see. */
STATE.acct = loadAcct();
function loadAcct() { try { return localStorage.getItem('bank.acct') || null; } catch (e) { return null; } }
function saveAcct() { try { if (STATE.acct) localStorage.setItem('bank.acct', STATE.acct); else localStorage.removeItem('bank.acct'); } catch (e) { /* the choice just is not remembered */ } }
function acctIds() {
  if (!STATE.acct) return null;
  const a = ((STATE.overview || {}).accounts || []).find((x) => x.key === STATE.acct);
  return a ? (a.ids || []) : null;
}
function inAcct(id) { const ids = acctIds(); return !ids || ids.includes(id); }
async function pickAcct(key) {
  STATE.acct = key || null; saveAcct();
  resetPages();
  paintOverview();
  await render();          // deposits + the "sure" bar
  renderReview(); renderAside(); renderBooked(); renderTransfers();
  paintRecon();
}
function applyFilter() {
  const q = STATE.q.trim().toLowerCase();
  const dir = STATE.dir;
  const matches = (c) => {
    const d = c.dataset.dir;
    const dirOk = dir === 'all' || d === dir || d === 'both';
    const qOk = !q || (c.dataset.k || '').includes(q) || c.textContent.toLowerCase().includes(q);
    /* ONE BANK AT A TIME: a row with no account on it is not shown under a
       chosen bank (it cannot be said to belong to it); "All banks" shows it. */
    const ids = acctIds();
    const aOk = !ids || (c.dataset.acct || '').split(' ').some((x) => x && ids.includes(x));
    return dirOk && qOk && aOk;
  };
  document.querySelectorAll('[data-pane="review"] .card[data-dir]').forEach((c) => {
    if (!c.closest('#list')) c.hidden = !matches(c);
  });
  for (const [key, sel] of Object.entries(PAGED)) {
    const cards = [...document.querySelectorAll(`${sel} .card[data-dir]`)];
    const hit = cards.filter(matches);
    const size = STATE.pageSize;
    const pages = Math.max(1, Math.ceil(hit.length / size));
    STATE.page[key] = Math.min(Math.max(1, STATE.page[key] || 1), pages);
    const start = (STATE.page[key] - 1) * size;
    const shown = new Set(hit.slice(start, start + size));
    cards.forEach((c) => { c.hidden = !shown.has(c); });
    paintPager(key, hit.length, start, Math.min(start + size, hit.length), pages);
    if (key === 'in') $('n-in').textContent = hit.length ? String(hit.length) : '';
  }
  // The list always shows; the switch filters it. Each direction's bar goes
  // with its direction.
  $('sure').hidden = dir === 'out';
  $('review').hidden = dir === 'in';
}
function paintPager(key, total, from, to, pages) {
  const el = $('pager-' + key);
  if (!el) return;
  // One page and nothing to choose: no bar at all, like QuickBooks.
  if (total <= PAGE_SIZES[0]) { el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  const p = STATE.page[key];
  el.innerHTML = `<span class="of">${from + 1}–${to} of ${total}</span>
    <button type="button" data-pg="${key}" data-go="first" ${p <= 1 ? 'disabled' : ''} aria-label="First page">«</button>
    <button type="button" data-pg="${key}" data-go="prev" ${p <= 1 ? 'disabled' : ''}>‹ Previous</button>
    <span>Page ${p} of ${pages}</span>
    <button type="button" data-pg="${key}" data-go="next" ${p >= pages ? 'disabled' : ''}>Next ›</button>
    <button type="button" data-pg="${key}" data-go="last" ${p >= pages ? 'disabled' : ''} aria-label="Last page">»</button>
    <label>Rows <select data-pgsize="1">${PAGE_SIZES.map((n) => `<option value="${n}" ${n === STATE.pageSize ? 'selected' : ''}>${n}</option>`).join('')}</select></label>`;
}
function goPage(key, where) {
  const box = $('list');
  if (where === 'first') STATE.page[key] = 1;
  else if (where === 'prev') STATE.page[key] -= 1;
  else if (where === 'next') STATE.page[key] += 1;
  else if (where === 'last') STATE.page[key] = 1e9;   // clamped in applyFilter
  applyFilter();
  if (box) box.scrollTop = 0;
}
function resetPages() { STATE.page = { in: 1, out: 1 }; }
function moveFocus(step) {
  const cards = [...document.querySelectorAll('[data-pane="review"] .card[data-dir]')].filter((c) => !c.hidden);
  if (!cards.length) return;
  let i = cards.findIndex((c) => c.classList.contains('focus'));
  cards.forEach((c) => c.classList.remove('focus'));
  // Past the last card of a page, J turns the page (K the other way) — the
  // keyboard should not stop dead at row 50 of 812.
  const key = 'in';
  if (i + step >= cards.length || (i >= 0 && i + step < 0)) {
    const before = STATE.page[key];
    STATE.page[key] += step > 0 ? 1 : -1;
    applyFilter();
    if (STATE.page[key] !== before) {
      const now = [...document.querySelectorAll(`${PAGED[key]} .card[data-dir]`)].filter((c) => !c.hidden);
      const t = step > 0 ? now[0] : now[now.length - 1];
      if (t) { t.classList.add('focus'); t.scrollIntoView({ block: 'nearest' }); }
      return;
    }
  }
  i = Math.max(0, Math.min(cards.length - 1, i + step));
  cards[i].classList.add('focus');
  cards[i].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
document.addEventListener('keydown', (ev) => {
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test((ev.target && ev.target.tagName) || '');
  if (typing || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (ev.key === '/') { ev.preventDefault(); showTab('review'); $('q').focus(); return; }
  const tabs = ['review', 'aside', 'recon', 'setup', 'plan'];
  if (/^[1-5]$/.test(ev.key)) { showTab(tabs[Number(ev.key) - 1]); return; }
  if (ev.key === 'Enter' || ev.key === 'o') {
    const f = document.querySelector('[data-pane="review"] .card.focus.row');
    if (f) { ev.preventDefault(); toggleRow(f); return; }
  }
  if (ev.key === 'j') moveFocus(1);
  if (ev.key === 'k') moveFocus(-1);
});
$('q').addEventListener('input', (ev) => { STATE.q = ev.target.value || ''; resetPages(); applyFilter(); });
document.addEventListener('change', (ev) => {
  const cbox = ev.target.closest && ev.target.closest('[data-cat]');
  if (cbox && (ev.target.matches('[data-cat-sel]') || ev.target.matches('[data-cat-co]'))) { catPreview(cbox); return; }
  const ps = ev.target.closest && ev.target.closest('[data-pgsize]');
  if (!ps) return;
  STATE.pageSize = Number(ps.value) || 50;
  try { localStorage.setItem('bank.pageSize', String(STATE.pageSize)); } catch (e) { /* private window */ }
  resetPages(); applyFilter();
});

/* A click anywhere on the box opens the calendar (where the browser allows
   it), and picking a day selects it and closes the calendar by itself. */
/* Custom keeps whatever dates are in the boxes and opens the From calendar;
   every other choice fills both boxes and reloads. */
$('preset').addEventListener('change', () => {
  const p = $('preset').value;
  if (p === 'custom') {
    STATE.range = { ...STATE.range, preset: 'custom' }; saveRange(); paintRange();
    try { if ($('from').showPicker) $('from').showPicker(); } catch (e) { $('from').focus(); }
    return;
  }
  setRange({ ...presetRange(p), preset: p });
});
for (const id of ['from', 'to']) {
  const el = $(id);
  el.addEventListener('click', () => { try { if (el.showPicker) el.showPicker(); } catch (e) { /* not allowed here */ } });
  el.addEventListener('change', () => setRange({ ...STATE.range, [id]: el.value || '', preset: 'custom' }));
}

document.addEventListener('click', async (ev) => {
  const ap = ev.target.closest('[data-acctpick]');
  if (ap) { await pickAcct(ap.getAttribute('data-acctpick')); return; }
  const pg = ev.target.closest('[data-pg]');
  if (pg) { if (!pg.disabled) goPage(pg.dataset.pg, pg.dataset.go); return; }
  // Opening a row: a click anywhere on its line except a control on it.
  const opener = ev.target.closest('[data-open]');
  if (opener) { toggleRow(opener.closest('.row')); return; }
  const line = ev.target.closest('[data-toggle]');
  if (line && !ev.target.closest('button, select, input, a, label')) { toggleRow(line.closest('.row')); return; }

  const inc = ev.target.closest('[data-include]');
  if (inc) {
    inc.disabled = true;
    try { await api('/api/bank/include', { body: { id: inc.dataset.include } });
      toast('Put back in the review list', 'good'); load(); }
    catch (e) { inc.disabled = false; toast(e.message, 'bad'); }
    return;
  }

  const tab = ev.target.closest('[data-tab]');
  if (tab) return showTab(tab.dataset.tab);
  const dirb = ev.target.closest('[data-dir]');
  if (dirb && dirb.closest('#dir')) {
    STATE.dir = dirb.dataset.dir;
    document.querySelectorAll('#dir [data-dir]').forEach((b) => b.classList.toggle('on', b === dirb));
    resetPages();
    return applyFilter();
  }

  /* Post a categorised withdrawal. The preview is asked again at the moment of the
     press, so what she confirms is what the server would book now. */
  const pp = ev.target.closest('[data-plan-preview]');
  if (pp) { planPreview(pp.closest('[data-plan]')); return; }
  const pa = ev.target.closest('[data-plan-apply]');
  if (pa) { if (pa.dataset.planApply === 'sentence') sentenceApply(pa); else planApply(pa.closest('[data-plan]'), pa); return; }
  if (ev.target.closest('#planGo')) { sentencePlan(); return; }
  const cp = ev.target.closest('[data-cat-post]');
  if (cp) {
    const box = cp.closest('[data-cat]');
    cp.disabled = true;
    const p = await catPreview(box);
    if (!p || !p.ok) return;
    if (!confirm(`Post this?\n\n${p.effect}\n\nJarvis's books only. You can undo it under Posted.`)) { cp.disabled = false; return; }
    const sel = box.querySelector('[data-cat-sel]'), co = box.querySelector('[data-cat-co]');
    try {
      await api('/api/bank/review/categorise', { body: { id: box.dataset.cat, account: sel.value, entity: co.value || null } });
      toast('Posted — ' + p.effect, 'good');
      renderReview().then(renderBooked);
    } catch (e) { cp.disabled = false; toast(e.message, 'bad'); }
    return;
  }
  const uc = ev.target.closest('[data-uncat]');
  if (uc) {
    if (!confirm('Undo this? It comes out of the books and the line goes back in For review.')) return;
    try { await api('/api/bank/review/categorise/undo', { body: { id: uc.dataset.uncat } });
      toast('Undone', 'good'); renderReview().then(renderBooked); } catch (e) { toast(e.message, 'bad'); }
    return;
  }

  const one = ev.target.closest('[data-reviewmatch]');
  if (one) {
    one.disabled = true;
    if (await doMatch(one.getAttribute('data-reviewmatch'))) renderReview();
    else { one.disabled = false; renderReview(); }
    return;
  }
  const all = ev.target.closest('[data-reviewall]');
  if (all) {
    all.disabled = true;
    /* One at a time, deliberately — bankLedger.markMatched is one row, one
       lock, one atomic write. A failure half way leaves the ones before it
       genuinely matched and SAYS SO. */
    const ids = ((STATE.review && STATE.review.queue.rows) || [])
      .filter((r) => r.state === 'match' && inAcct(r.account_id)).map((r) => r.id);
    let ok = 0;
    for (const id of ids) { if (await doMatch(id)) ok += 1; else break; }
    toast(ok === ids.length ? `Matched all ${ok}` : `Matched ${ok} of ${ids.length} — stopped at the first problem`,
      ok === ids.length ? 'good' : 'bad');
    renderReview();
    return;
  }

  /* Record a transfer between her companies as a loan. */
  const tr = ev.target.closest('[data-transfer]');
  if (tr) {
    const t = STATE.transfers || {};
    const p = [...(t.proposed || []), ...(t.one_sided || [])].find((x) => x.id === tr.dataset.transfer);
    if (!p) return;
    tr.disabled = true; tr.textContent = 'Recording…';
    try {
      await api('/api/intercompany/transfers', { body: { from: p.from, to: p.to, amount: p.amount,
        out_id: p.out_row ? p.out_row.id : null, in_id: p.in_row ? p.in_row.id : null, treatment: 'loan' } });
      toast(`Recorded as a loan: ${COMPANY[p.from]} → ${COMPANY[p.to]} ${money(p.amount)}`, 'good');
      load();
    } catch (e) { tr.disabled = false; tr.textContent = 'Record as a loan'; toast(e.message, 'bad'); }
    return;
  }
  const un = ev.target.closest('[data-untransfer]');
  if (un) {
    if (!confirm('Undo this transfer? The loan comes off both companies\' books and the bank lines go back in the review list.')) return;
    try { await api('/api/intercompany/transfers', { method: 'DELETE', body: { id: un.dataset.untransfer } });
      toast('Undone', 'good'); load(); } catch (e) { toast(e.message, 'bad'); }
    return;
  }

  /* A rule from a row: say what it is, see how many lines it covers, then
     decide. Nothing happens before the second answer. */
  const rb = ev.target.closest('[data-rule-desc]');
  if (rb) {
    const dir = rb.dataset.ruleDir;
    const guess = String(rb.dataset.ruleDesc || '').toUpperCase().replace(/[#:]?\b[\dA-Z]*\d{3,}[\dA-Z]*\b/g, ' ').replace(/\s+/g, ' ').trim();
    const text = prompt('Set aside every money-' + dir + ' line whose description contains:', guess);
    if (text === null) return;
    const labels = ((STATE.rules || {}).labels || ['Bank charge']);
    const label = prompt('What are these lines? (for example: ' + labels.join(', ') + ')', labels[0]);
    if (label === null) return;
    try {
      const dry = await api('/api/bank/rules', { body: { text, direction: dir, label, dry: true } });
      if (!confirm(`This sets aside ${dry.would} line(s) now (${money(dry.money)}), and every future money-${dir} line containing “${dry.rule.text}”, as "${dry.rule.label}".\n\nEach one can be put back. Go ahead?`)) return;
      const r = await api('/api/bank/rules', { body: { text, direction: dir, label } });
      toast(`Rule saved · ${r.applied} line(s) set aside`, 'good');
      load();
    } catch (e) { toast(e.message, 'bad'); }
    return;
  }
  const rd = ev.target.closest('[data-rule-del]');
  if (rd) {
    try { await api('/api/bank/rules', { method: 'DELETE', body: { text: rd.dataset.ruleDel, direction: rd.dataset.ruleDeldir } });
      toast('Rule deleted — lines it already set aside stay set aside', 'good'); renderRules(); } catch (e) { toast(e.message, 'bad'); }
    return;
  }

  /* Confirm every sure deposit, one receipt at a time, stopping at the
     first refusal — the same discipline as "Match all" above. */
  const sa = ev.target.closest('[data-sureall]');
  if (sa) {
    const list = (STATE.bulk || []).filter((x) => inAcct((x.r.deposit || {}).account_id));
    if (!confirm(`Record ${list.length} receipts? Each pays its invoices in full.`)) return;
    sa.disabled = true;
    let ok = 0;
    for (const { r, mode } of list) {
      const p = r.proposals[0];
      try {
        await api('/api/sales-receipts', { body: {
          date: r.deposit.date, amount: r.deposit.amount, mode, bank: r.deposit.bank_guess,
          customer: r.party, ref: r.deposit.id, note: 'matched from the bank feed',
          allocations: p.allocations.map((a) => ({ sale_id: a.doc_id, amount: a.amount })) } });
        ok += 1;
      } catch (e) { toast(`Stopped at ${r.party} ${money(r.deposit.amount)}: ${e.message}`, 'bad'); break; }
    }
    toast(ok === list.length ? `Recorded all ${ok}` : `Recorded ${ok} of ${list.length}`, ok === list.length ? 'good' : 'bad');
    load();
  }
});

async function load() {
  resetPages();
  try {
    STATE.data = await api('/api/bank/match');
    await render();
    renderOverview();
    renderTransfers();
    renderFeed();
    renderReconcile();
    renderReview();
    renderBooked();
    renderPlans();
    renderRules();
    renderAside();
  } catch (e) {
    $('list').innerHTML = `<div class="card"><div class="lbl">could not load</div><div class="note">${esc(e.message)}</div></div>`;
  }
}

async function showAliases() {
  try {
    const { aliases } = await api('/api/bank/aliases');
    showTab('aside');
    $('extras').innerHTML = `<h2 class="sec">${aliases.length} name(s) you have taught it</h2>
      <div class="card">${aliases.length ? aliases.map((a) => `<div class="row1" style="margin:4px 0">
          <span class="desc mono" style="font-size:11.5px">${esc(a.descriptor)}</span>
          <span class="desc">&rarr; ${esc(a.customer)}</span>
          <span class="when">${esc(String(a.at || '').slice(0, 10))}${a.by ? ' · ' + esc(a.by) : ''}</span>
          <button class="btn" data-forget="${esc(a.descriptor)}">Forget</button>
        </div>`).join('') : '<div class="empty">Nothing learned yet.</div>'}
      <div class="note">A wrong name here would misallocate every future deposit from that payer, so each one can be forgotten.</div></div>`;
  } catch (e) { toast(e.message, 'bad'); }
}

function showExcluded() {
  showTab('aside');
  renderExtras();
  renderAside();
  try { $('asidelist').scrollIntoView({ block: 'start' }); } catch (e) { /* jsdom */ }
}

/* ── SET ASIDE, ONE LINE EACH, WITH PUT BACK ───────────────────────────
   Until now this tab showed a total and nothing else, so a line set aside
   by hand or by a rule could not be found again or put back from the
   screen. Each one keeps its reason, and Put back returns it to the queue. */
async function renderAside() {
  let x = null;
  try { x = await api('/api/bank/set-aside'); } catch (e) { x = null; }
  if (!x) { $('asidelist').innerHTML = ''; return; }
  const rows = (x.rows || []).filter((r) => inAcct(r.account_id));
  $('asidelist').innerHTML = `<h2 class="sec">Set aside <span class="n">${x.count} · ${money(x.money)}</span></h2>
    <div class="card">${rows.length ? rows.map((r) => `<div class="xrow">
        <span class="when">${esc(fmtDay(r.date))}</span>
        <span class="d">${esc(r.desc || '(no description)')}</span>
        <span class="why2" title="${esc(r.reason || '')}">${esc(r.reason || 'no reason given')}${r.by ? ' · ' + esc(r.by) : ''}</span>
        <span class="a">${r.direction === 'out' ? '−' : '+'}${money(r.amount)}</span>
        <button class="btn quiet" data-include="${esc(r.id)}">Put back</button>
      </div>`).join('') : '<div class="empty">Nothing set aside in these dates.</div>'}
      ${x.truncated ? `<div class="note">Showing the latest 300 of ${x.count}. Narrow the dates to see the rest.</div>` : ''}
      <div class="note">Set-aside lines leave the review list but stay in the bank total, because the money still moved. Nothing is deleted.</div></div>`;
}

/* The bank's own words, in full, wrapped — the summary line is clipped to one
   line, and for a wire the part that says which invoice it pays comes last. */
function bankTextHtml(text, shown) {
  const t = String(text || '').trim();
  if (!t || t === String(shown || '').trim()) return '';
  return `<div class="desc mono" style="margin-top:10px;font-size:11.5px;color:var(--text-faint);overflow-wrap:anywhere;white-space:normal"><b>Bank says:</b> ${esc(t)}</div>`;
}

function toggleRow(card) {
  if (!card) return;
  const open = !card.classList.contains('open');
  card.classList.toggle('open', open);
  const sum = card.querySelector('.sum'); if (sum) sum.setAttribute('aria-expanded', open ? 'true' : 'false');
}

document.addEventListener('click', async (ev) => {
  const t = ev.target.closest('[data-reload],[data-show],[data-learn],[data-learnfree],[data-forget],[data-exclude],[data-confirm],[data-plaid],[data-unlink]');
  if (!t) return;

  if (t.dataset.reload) return load();

  if (t.dataset.unlink) {
    if (!confirm('Unlink this bank? Jarvis stops pulling new transactions. The ones already pulled stay.')) return;
    try { await api('/api/plaid/item', { method: 'DELETE', body: { item_id: t.dataset.unlink } });
      toast('Unlinked', 'good'); load(); } catch (e) { toast(e.message, 'bad'); }
    return;
  }

  if (t.dataset.plaid === 'sync') {
    t.disabled = true; const was = t.textContent; t.textContent = 'Pulling…';
    try {
      const r = await api('/api/plaid/sync', { body: {} });
      /* Partial failure comes back as a 200 with errors in it, because one
         bank needing re-authentication must not throw away the other
         bank's deposits. So both halves are reported. */
      const parts = [`${r.added} new`, r.modified ? `${r.modified} corrected` : '', (r.removed || []).length ? `${r.removed.length} removed by the bank` : '',
        (r.rules && r.rules.applied) ? `${r.rules.applied} set aside by your rules` : ''].filter(Boolean);
      toast(parts.join(', ') || 'nothing new', 'good');
      for (const e of (r.errors || [])) toast(`${e.institution || e.item_id}: ${e.error}`, 'bad');
      if (r.truncated) toast('Stopped early — press again to keep pulling', 'bad');
      load();
    } catch (e) { toast(e.message, 'bad'); }
    t.disabled = false; t.textContent = was;
    return;
  }

  if (t.dataset.plaid === 'sandbox') {
    try { await api('/api/plaid/sandbox-link', { body: {} }); toast('Test bank linked — now press Pull', 'good'); load(); }
    catch (e) { toast(e.message, 'bad'); }
    return;
  }

  /* Sign in again to a bank already linked — Plaid's update mode. Same
     link, same history; nothing to exchange afterwards, so the server just
     clears the flag and pulls. */
  if (t.dataset.plaid === 'reconnect') {
    const item = t.dataset.item;
    let token = null;
    try { token = (await api('/api/plaid/link-token', { body: { item_id: item } })).link_token; }
    catch (e) { return toast(e.message, 'bad'); }
    const ok = await loadPlaidLink();
    if (!ok) return toast('Could not load Plaid Link from the internet — check the server can reach cdn.plaid.com', 'bad');
    window.Plaid.create({
      token,
      onSuccess: async () => {
        try {
          const r = await api('/api/plaid/reconnected', { body: { item_id: item } });
          toast(`Signed in again · ${r.added || 0} new line(s)`, 'good');
          load();
        } catch (e) { toast(e.message, 'bad'); }
      },
      onExit: (err) => { if (err) toast('Sign-in closed: ' + (err.display_message || err.error_code || 'cancelled'), 'bad'); },
    }).open();
    return;
  }

  if (t.dataset.plaid === 'connect') {
    let token = null;
    try { token = (await api('/api/plaid/link-token', { body: {} })).link_token; }
    catch (e) { return toast(e.message, 'bad'); }
    const ok = await loadPlaidLink();
    /* Said out loud rather than failing silently: a blocked CDN is a
       different problem from a wrong key, and they need different fixes. */
    if (!ok) return toast('Could not load Plaid Link from the internet — check the server can reach cdn.plaid.com', 'bad');
    window.Plaid.create({
      token,
      onSuccess: async (publicToken, meta) => {
        try {
          await api('/api/plaid/exchange', { body: { public_token: publicToken,
            institution: (meta && meta.institution && meta.institution.name) || null } });
          /* Which account she pressed Connect on, when she pressed it on a
             card. The exchange joins Plaid's accounts to hers by the last
             four digits (helpers/bankLedger.joinPlaidAccounts), so if she
             picked a different account at the bank this one stays unlinked
             — and the re-render below is what tells her, honestly, rather
             than a message claiming success. */
          const want = t.dataset.mask
              ? ` — ${t.dataset.bank || 'that bank'} ••${t.dataset.mask} should now show Connected`
              : '';
          toast('Bank linked' + want + ' — now press Pull', 'good');
          load();
        } catch (e) { toast(e.message, 'bad'); }
      },
      onExit: (err) => { if (err) toast('Link closed: ' + (err.display_message || err.error_code || 'cancelled'), 'bad'); },
    }).open();
    return;
  }
  if (t.dataset.show === 'aliases') return showAliases();
  if (t.dataset.show === 'excluded') return showExcluded();

  if (t.dataset.learn || t.dataset.learnfree != null) {
    const customer = t.dataset.learn
      || (($(`list`).querySelector(`[data-name="${t.dataset.learnfree}"]`) || {}).value || '').trim();
    if (!customer) return toast('Whose payment is it?', 'bad');
    try {
      await api('/api/bank/aliases', { body: { descriptor: t.dataset.desc, customer, why: 'confirmed on the bank matching screen' } });
      toast(`Remembered: ${customer}`, 'good');
      load();
    } catch (e) { toast(e.message, 'bad'); }
    return;
  }

  if (t.dataset.forget) {
    try {
      await api('/api/bank/aliases', { method: 'DELETE', body: { descriptor: t.dataset.forget } });
      toast('Forgotten', 'good');
      showAliases(); load();
    } catch (e) { toast(e.message, 'bad'); }
    return;
  }

  /* Excluding asks for a reason. "Why is this excluded" is a question asked
     months later by someone who was not here. */
  if (t.dataset.exclude) {
    const reason = prompt('Why is this not a customer payment?\n(a card fee, an owner draw, a transfer between your own accounts…)');
    if (reason === null) return;
    try {
      await api('/api/bank/exclude', { body: { id: t.dataset.exclude, reason } });
      toast('Set aside — still counted, and reversible', 'good');
      load();
    } catch (e) { toast(e.message, 'bad'); }
    return;
  }

  if (t.dataset.confirm != null) {
    const i = Number(t.dataset.confirm);
    const row = (STATE.data.rows || [])[i];
    const p = (row.proposals || [])[0];
    if (!row || !p) return;
    const card = t.closest('.card');
    const mode = (card.querySelector(`[data-mode="${i}"]`) || {}).value || '';
    const bank = (card.querySelector(`[data-bank="${i}"]`) || {}).value || '';

    /* The shortfall is a deduction, not a rounding. salesReceipts.js keeps
       them apart because a bank charge is a cost to Edge Metals and a
       discount reduces what was earned. If there is one, she says which —
       and if it looks like her customer's claim, the question says so. */
    const short = p.allocations.reduce((s, a) => s + (a.shortfall || 0), 0);
    let reason = null;
    if (short > 0.005) {
      const h = row.claim_hint;
      const hint = h ? `\n\nIt is close to the claim on ${h.invoice_no} (${money(h.claim_amount)}) — if the customer deducted their claim, that is a "discount".` : '';
      const ans = prompt(`This deposit is ${money(short)} short of the invoice total.\n\nType "fee" if the bank took it in transit, or "discount" if you agreed to take less.${hint}`);
      if (ans === null) return;
      reason = /^f/i.test(ans) ? 'bank_charge' : (/^d/i.test(ans) ? 'discount' : null);
      if (!reason) return toast('Not recorded — a shortfall has to be a fee or a discount', 'bad');
    }

    t.disabled = true; t.textContent = 'Recording…';
    try {
      await api('/api/sales-receipts', { body: {
        date: row.deposit.date, amount: row.deposit.amount, mode, bank,
        customer: row.party, ref: row.deposit.id,
        note: 'matched from the bank feed',
        allocations: p.allocations.map((a) => ({
          sale_id: a.doc_id, amount: a.amount,
          ...(a.shortfall ? { deduction_amount: a.shortfall, deduction_reason: reason } : {}),
        })),
      } });
      toast('Receipt recorded', 'good');
      load();
    } catch (e) {
      t.disabled = false; t.textContent = 'Confirm — record this receipt';
      toast(e.message, 'bad');
    }
  }
});

loadRange();
paintRange();
load();
</script>
<button type="button" id="toTop" class="totop" aria-label="Back to top" title="Back to top" hidden>↑</button>
<script>
/* TWO things scroll on this page: the window, and the review list (#list is a
   capped box). A button that reset only one would leave her mid-list. Both go
   to 0 in one step — behavior 'instant', not the page's smooth scrolling. */
(function () {
  const btn = document.getElementById('toTop');
  if (!btn) return;
  const SHOW_AT = 300;
  const winY = () => window.pageYOffset || document.documentElement.scrollTop || 0;
  const listEl = () => document.getElementById('list');
  function sync() {
    const l = listEl();
    btn.hidden = !(winY() > SHOW_AT || (l && l.scrollTop > SHOW_AT));
  }
  function goTop() {
    const l = listEl();
    if (l) l.scrollTop = 0;
    try { window.scrollTo({ top: 0, left: 0, behavior: 'instant' }); } catch (e) { window.scrollTo(0, 0); }
    document.documentElement.scrollTop = 0; document.body.scrollTop = 0;
    btn.hidden = true;
  }
  btn.addEventListener('click', goTop);
  window.addEventListener('scroll', sync, { passive: true });
  // scroll does not bubble: the list needs its own listener, and #list is
  // re-created by renders only as a CHILD swap, so one listener on it holds.
  const l = listEl(); if (l) l.addEventListener('scroll', sync, { passive: true });
  sync();
})();
</script>

<script src="/sidebar.js" data-page="bank" defer></script>
