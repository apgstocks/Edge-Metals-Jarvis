<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuickBooks — Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Design tokens copied from dashboard/edge-inventory.html — standalone page,
   kept in sync by hand, same as the others. */
:root{
  --steel-900:#14181B; --steel-800:#1E2429; --steel-700:#2B3239; --steel-600:#3C454D;
  --steel-500:#57616A; --steel-400:#7E8891; --steel-300:#A7B0B7; --steel-200:#CBD1D6;
  --leaf-300:#7FD172; --leaf-400:#57BE49; --leaf-500:#3DA836; --leaf-600:#2E861F;
  --copper-300:#E29C68; --copper-400:#D77E3D;
  --green-500:#2F8F57; --amber-500:#D99A2B; --red-500:#C5402F; --blue-500:#3A6EA5;
  --bg-base:#0C0E10; --surface-card:#14181B; --surface-sunken:#0F1214; --surface-hover:#181D21;
  --text-strong:#FFFFFF; --text-body:#CBD1D6; --text-muted:#A7B0B7; --text-faint:#7E8891;
  --border-subtle:#1E2429; --border-default:#2B3239; --ring:var(--leaf-500);
  --font-display:'Archivo',sans-serif; --font-sans:'IBM Plex Sans',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:var(--font-sans);color:var(--text-body);background:var(--bg-base);-webkit-font-smoothing:antialiased;height:100vh;display:flex;flex-direction:column;overflow:hidden}
h1,h2,h3{font-family:var(--font-display);color:var(--text-strong);margin:0;font-weight:900;letter-spacing:-.02em}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.mono{font-family:var(--font-mono)}
/* ── top bar ─────────────────────────────────────────────────────────── */
header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--border-default);background:var(--surface-card);flex:none}
header h1{font-size:17px}
header .back{color:var(--steel-400);font-size:13px;text-decoration:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center}
.chip{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:3px;border:1px solid var(--border-default);color:var(--text-muted);background:var(--surface-sunken);white-space:nowrap}
.chip.on{color:var(--leaf-300);border-color:var(--leaf-600);background:rgba(87,190,73,.10)}
.chip.warn{color:var(--amber-500);border-color:#5a4416;background:rgba(217,154,43,.10)}
.chip.off{color:var(--steel-400)}
.chip.act{cursor:pointer} .chip.act:hover{border-color:var(--text-body);color:var(--text-body)}
.lock{display:flex;align-items:center;gap:7px;padding:5px 11px;border-radius:4px;border:1px solid var(--border-default);background:var(--surface-sunken);color:var(--text-muted);font-size:12.5px;font-weight:600}
.lock.open{border-color:var(--red-500);color:#f0b3aa;background:rgba(197,64,47,.12)}
/* ── layout ──────────────────────────────────────────────────────────── */
main{flex:1;display:grid;grid-template-columns:288px 1fr;min-height:0}
aside{border-right:1px solid var(--border-default);background:var(--surface-sunken);display:flex;flex-direction:column;min-height:0}
.search{padding:9px;border-bottom:1px solid var(--border-subtle)}
.search input{width:100%;padding:7px 9px;border-radius:4px;border:1px solid var(--border-default);background:var(--bg-base);color:var(--text-body);font-size:13px}
.tabsel{display:flex;gap:4px;padding:0 9px 9px}
.tabsel button{flex:1;padding:5px;border-radius:4px;border:1px solid var(--border-default);background:transparent;color:var(--text-muted);font-size:11.5px;font-weight:600}
.tabsel button.sel{background:rgba(87,190,73,.14);border-color:var(--leaf-600);color:var(--leaf-300)}
.plist{overflow-y:auto;flex:1}
.prow{width:100%;text-align:left;padding:8px 11px;border:0;border-bottom:1px solid var(--border-subtle);background:transparent;color:var(--text-body);display:block}
.prow:hover{background:var(--surface-hover)}
.prow.sel{background:rgba(87,190,73,.10);box-shadow:inset 2px 0 0 var(--leaf-500)}
.prow .nm{font-size:13px;font-weight:600;color:var(--text-strong);display:flex;justify-content:space-between;gap:8px}
.prow .sub{font-size:11px;color:var(--text-faint);font-family:var(--font-mono);margin-top:2px;display:flex;justify-content:space-between;gap:8px}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}
.dot.ok{background:var(--green-500)} .dot.no{background:var(--red-500)} .dot.skip{background:var(--steel-500)}
/* ── detail ──────────────────────────────────────────────────────────── */
section{display:flex;flex-direction:column;min-height:0}
.dhead{padding:13px 18px;border-bottom:1px solid var(--border-default);background:var(--surface-card)}
.dhead .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dhead h2{font-size:20px}
.mapline{font-size:12px;color:var(--text-faint)}
.mapline b{color:var(--copper-300);font-weight:600}
.stats{display:flex;gap:22px;margin-top:10px;flex-wrap:wrap}
.stat .k{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint)}
.stat .v{font-size:16px;font-weight:700;color:var(--text-strong);font-family:var(--font-mono)}
.stat .v.warn{color:var(--amber-500)} .stat .v.bad{color:var(--red-500)} .stat .v.good{color:var(--leaf-300)}
.tabs{display:flex;gap:2px;padding:0 18px;border-bottom:1px solid var(--border-default);background:var(--surface-card)}
.tabs button{padding:8px 12px;border:0;background:transparent;color:var(--text-muted);font-size:12.5px;font-weight:600;border-bottom:2px solid transparent}
.tabs button.sel{color:var(--text-strong);border-bottom-color:var(--leaf-500)}
.tabs .count{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);margin-left:5px}
.body{overflow-y:auto;flex:1;padding:0 18px 18px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);font-weight:500;padding:9px 8px;border-bottom:1px solid var(--border-default);position:sticky;top:0;background:var(--bg-base)}
td{padding:7px 8px;border-bottom:1px solid var(--border-subtle);vertical-align:top}
td.num{text-align:right;font-family:var(--font-mono)}
tr:hover td{background:var(--surface-hover)}
.pill{font-family:var(--font-mono);font-size:10px;padding:2px 6px;border-radius:3px;border:1px solid var(--border-default);color:var(--text-faint)}
.pill.in{color:var(--leaf-300);border-color:var(--leaf-600)}
.pill.out{color:var(--amber-500);border-color:#5a4416}
.pill.bad{color:var(--red-500);border-color:#5b2a23}
.act{padding:3px 8px;border-radius:3px;border:1px solid var(--border-default);background:transparent;color:var(--text-muted);font-size:11px}
.act:hover:not(:disabled){border-color:var(--leaf-500);color:var(--leaf-300)}
.act:disabled{opacity:.35;cursor:not-allowed}
.empty{padding:26px 8px;color:var(--text-faint);font-size:13px}
h3.sec{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);font-weight:500;margin:18px 0 4px;padding:0 8px}
h3.sec:first-child{margin-top:4px}
h3.sec .count{color:var(--amber-500);margin-left:6px}
tr.click{cursor:pointer} td.r{text-align:right;font-family:var(--font-mono)}
/* ── ask jarvis ──────────────────────────────────────────────────────── */
.ask{flex:none;border-top:1px solid var(--border-default);background:var(--surface-card);padding:10px 18px}
.askrow{display:flex;gap:8px}
.askrow input{flex:1;padding:9px 11px;border-radius:5px;border:1px solid var(--border-default);background:var(--bg-base);color:var(--text-body);font-size:13px}
.askrow button{padding:9px 16px;border-radius:5px;border:1px solid var(--leaf-600);background:rgba(87,190,73,.16);color:var(--leaf-300);font-weight:700;font-size:13px}
.answer{margin-top:9px;font-size:13px;color:var(--text-body);line-height:1.55;max-height:132px;overflow-y:auto}
.answer .follow{display:block;margin-top:6px;color:var(--copper-300);font-size:12.5px}
.answer .you{color:var(--text-faint);font-size:11.5px;font-family:var(--font-mono);margin-bottom:3px}
.toast{position:fixed;right:16px;bottom:16px;padding:11px 14px;border-radius:5px;border:1px solid var(--border-default);background:var(--surface-card);color:var(--text-body);font-size:12.5px;max-width:420px;box-shadow:0 8px 28px rgba(0,0,0,.5);z-index:40;white-space:pre-wrap}
.toast.bad{border-color:var(--red-500)} .toast.good{border-color:var(--leaf-600)}

/* ── THE MATCH PICKER (2026-09-26) ────────────────────────────────────────
   Apsara, on a screenshot of the old one: "this box looks out of sync from
   my website design". It was window.prompt() — drawn by the operating
   system, in the OS's own font and colours, and impossible to style at all.
   No amount of CSS could have reached it.
   It was also the wrong control for the job. The answer is almost always
   "the one with the same name", and it was asking her to READ a numbered
   list and then TYPE a digit. Now the candidates are rows she clicks. */
.pk-back{position:fixed;inset:0;background:rgba(6,8,10,.66);display:flex;align-items:flex-start;justify-content:center;padding:64px 20px;z-index:60;overflow-y:auto}
.pk{background:var(--surface-card);border:1px solid var(--border-default);border-radius:7px;width:100%;max-width:520px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.pk-head{padding:15px 18px 12px;border-bottom:1px solid var(--border-subtle)}
.pk-head h3{margin:0;font-family:var(--font-display);font-size:15px;font-weight:700;color:var(--text-strong)}
.pk-head p{margin:5px 0 0;font-size:12px;color:var(--text-faint)}
.pk-list{max-height:46vh;overflow-y:auto;padding:7px}
.pk-opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 11px;border-radius:4px;border:1px solid transparent;background:transparent;color:var(--text-body);font-size:13px}
.pk-opt:hover,.pk-opt:focus-visible{background:var(--surface-hover);border-color:var(--border-default);outline:none}
.pk-opt .pk-id{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--text-faint)}
.pk-opt .pk-why{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--leaf-300);border:1px solid var(--leaf-600);border-radius:3px;padding:2px 6px}
.pk-none{padding:14px 12px;font-size:12.5px;color:var(--text-faint)}
.pk-foot{padding:12px 18px 15px;border-top:1px solid var(--border-subtle);display:flex;flex-direction:column;gap:9px}
.pk-foot label{font-size:11.5px;color:var(--text-faint)}
.pk-foot input{width:100%;padding:8px 10px;border-radius:4px;border:1px solid var(--border-default);background:var(--surface-sunken);color:var(--text-body);font:inherit;font-size:13px}
.pk-foot input:focus{outline:none;border-color:var(--ring)}
.pk-btns{display:flex;gap:8px;justify-content:flex-end}
.pk-btns button{padding:7px 13px;border-radius:4px;border:1px solid var(--border-default);background:var(--surface-sunken);color:var(--text-body);font-size:12.5px}
.pk-btns button:hover{background:var(--surface-hover)}
.pk-btns .pk-go{border-color:var(--leaf-600);color:var(--leaf-300)}
@media (max-width:900px){ main{grid-template-columns:1fr} aside{display:none} aside.show{display:flex;position:absolute;inset:52px 0 0;z-index:20} }
</style>
</head>
<body>
<header>
  <a class="back" href="/">← Jarvis</a>
  <h1>QuickBooks</h1>
  <div class="chips" id="chips"></div>
  <button class="lock" id="lock" title="Unlock to change mappings, push records or undo">🔒 Locked</button>
</header>

<main>
  <aside id="aside">
    <div class="search"><input id="q" placeholder="Search supplier or customer…" autocomplete="off"></div>
    <div class="tabsel">
      <button data-kind="" class="sel">All</button>
      <button data-kind="vendor">Suppliers</button>
      <button data-kind="customer">Customers</button>
    </div>
    <div class="plist" id="plist"><div class="empty" style="padding:14px">Loading…</div></div>
  </aside>

  <section>
    <div class="dhead" id="dhead">
      <div class="top"><h2 id="dname">Pick a supplier or customer</h2></div>
      <div class="mapline" id="dmap">Everything Jarvis knows about one party, on one screen.</div>
      <div class="stats" id="dstats"></div>
    </div>
    <div class="tabs" id="dtabs"></div>
    <div class="body" id="dbody"><div class="empty">The list on the left is every name in Jarvis's ledgers. A red dot means it has no QuickBooks match yet.</div></div>
    <div class="ask">
      <div class="askrow">
        <input id="ask" placeholder="Ask Jarvis — “how much did I wire him?”, “why is this blocked?”, “what's not in QB yet?”">
        <button id="asksend">Ask</button>
      </div>
      <div class="answer" id="answer"></div>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const money = (n) => (n === null || n === undefined || n === '') ? '—' : '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
let STATE = { unlocked: false, parties: [], kind: '', sel: null, detail: null, tab: 'bills', status: null };

function toast(msg, cls) {
  const t = document.createElement('div');
  t.className = 'toast ' + (cls || '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), cls === 'bad' ? 9000 : 5000);
}
async function api(url, body) {
  const r = await fetch(url, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...body, unlock: STATE.unlocked }) } : {});
  const j = await r.json().catch(() => ({ error: 'bad response' }));
  // A refusal often carries more than a sentence — the name that is taken,
  // a suggestion, the impact she was shown. Keep it on the error so the
  // caller can offer the fix instead of only reporting the failure.
  if (!r.ok) { const err = new Error(j.error || j.note || ('HTTP ' + r.status)); err.body = j; err.status = r.status; throw err; }
  return j;
}

/* ── status strip: the things that decide whether a write can happen ── */
async function loadStatus() {
  try {
    const s = await api('/api/qb/status');
    STATE.status = s;
    $('chips').innerHTML = [
      `<span class="chip ${s.env === 'production' ? 'on' : 'warn'}">${s.env}</span>`,
      `<span class="chip ${s.connected ? 'on' : 'warn'}">${s.connected ? 'connected' : 'not connected'}</span>`,
      `<span class="chip ${s.writes ? 'on' : 'off'}">writes ${s.writes ? 'on' : 'off'}</span>`,
      `<span class="chip ${s.autoSync ? 'on' : 'off'}">auto-sync ${s.autoSync ? 'on' : 'off'}</span>`,
      cutChip('bills', s.cutover.bills, s.cutover.billsFrom),
      cutChip('invoices', s.cutover.invoices, s.cutover.invoicesFrom),
      `<span class="chip ${(s.nightly || {}).writes ? 'on' : 'off'}" title="Every night at midnight Los Angeles, after the 11:15pm sheet sync. It enters everything dated on or after the cutover that is not in QuickBooks yet, and emails what went in, what is stuck, and what it left alone.">nightly ${(s.nightly || {}).writes ? '00:00' : 'dry run'}</span>`,
      `<span class="chip act" data-run="1" title="Run that same sweep now">run now</span>`,
      `<span class="chip">${s.counts.journal} journal · ${s.counts.standing} standing</span>`,
      `<span class="chip act" data-todo="1" title="Everything QuickBooks is waiting on">what needs you</span>`,
      `<span class="chip act" data-books="1" title="The year, what is owed both ways, and the bank balances — read live from QuickBooks">the books</span>`,
      `<span class="chip act" data-find="1" title="Find a document in QuickBooks by number, container or amount">find</span>`,
      `<span class="chip act" data-agent="1" title="What is not yet right in the books, and who can fix each one">QB Agent</span>`,
      `<span class="chip act" data-bank="1" title=""The CSV you export from the Banking screen, matched line by line to what is open">bank lines</span>`,
      `<span class="chip act" data-allocate="1" title=""Payments that were never matched to a bill — the biggest single thing wrong with the books">place payments</span>`,
      `<span class="chip act" data-dupes="1" title=""The same money entered twice, per supplier and customer, and payments never applied">duplicates</span>`,
      `<span class="chip act" data-miscoded="1" title="Cheques posted straight to cost of goods sold instead of against a bill — the agent has listed them every morning and there was nowhere to look at them">miscoded cheques</span>`,
      `<span class="chip act" data-missing="1" title=""Your live sheet against your live books — what neither side has">sheet vs books</span>`,
      `<span class="chip act" data-older="1" title="Enter a reviewed list of rows from before the cutover">enter an older list</span>`,
      `<span class="chip ${s.connected ? '' : 'warn'} act" data-connect="1" title="${s.connected ? 'Reconnect QuickBooks — needed when the token is refused' : 'QuickBooks is not connected — nothing can be read or written until it is'}">${s.connected ? 'reconnect' : 'connect QuickBooks'}</span>`,
      ...s.roles.map(r => r.qbId
        ? `<span class="chip act" data-role="${r.role}" title="${r.why || ''} — now ${r.qbName || ('#' + r.qbId)}. Click to change.">${r.role} ✓</span>`
        : `<span class="chip warn act" data-role="${r.role}" title="${r.why || ''} — nothing answers this yet, so any write needing it is blocked. Click to set it.">${r.role}: unmapped</span>`),
    ].join('');
  } catch (e) { $('chips').innerHTML = `<span class="chip warn">status: ${e.message}</span>`; }
}

/* ── THE SAME DIALOG, EVERYWHERE (2026-09-26) ────────────────────────
   Apsara's complaint about window.prompt was that it is drawn by the
   operating system and looks nothing like her site — so the match picker
   replaced it. Anything new on this page has to meet the same bar, or the
   page goes back to looking half-finished. These two reuse the picker's
   own markup and CSS: one asks for a line of text, one asks her to choose
   from a list. Escape and a backdrop click cancel, exactly like the picker. */
function pkEsc(v) { return String(v == null ? '' : v).replace(/[&<>"]/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m])); }
function pkShell(title, sub, inner) {
  const back = document.createElement('div');
  back.className = 'pk-back';
  back.innerHTML = `<div class="pk" role="dialog" aria-modal="true" aria-label="${pkEsc(title)}">
      <div class="pk-head"><h3>${pkEsc(title)}</h3>${sub ? `<p>${pkEsc(sub)}</p>` : ''}</div>${inner}</div>`;
  return back;
}
function pkOpen(back, resolve) {
  let done = false;
  const finish = (v) => { if (done) return; done = true; document.removeEventListener('keydown', onKey); back.remove(); resolve(v); };
  const onKey = (e) => { if (e.key === 'Escape') finish(null); };
  back.addEventListener('click', (e) => { if (e.target === back) finish(null); });
  document.addEventListener('keydown', onKey);
  document.body.appendChild(back);
  return finish;
}
/* one line of text; resolves the string, or null if she backed out */
function askText(title, sub, label, value, okLabel) {
  return new Promise((resolve) => {
    const back = pkShell(title, sub, `<div class="pk-foot">
        <label for="pkIn">${pkEsc(label)}</label>
        <input id="pkIn" autocomplete="off" value="${pkEsc(value || '')}">
        <div class="pk-btns"><button type="button" class="pk-cancel">Cancel</button>
          <button type="button" class="pk-go">${pkEsc(okLabel || 'OK')}</button></div>
      </div>`);
    const finish = pkOpen(back, resolve);
    const input = back.querySelector('#pkIn');
    const go = () => finish(input.value.trim() || null);
    back.querySelector('.pk-cancel').addEventListener('click', () => finish(null));
    back.querySelector('.pk-go').addEventListener('click', go);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
    input.focus(); input.select();
  });
}
/* one of a list; rows are { label, why, id }. Resolves the row, or null */
function pickRow(title, sub, rows, emptyText) {
  return new Promise((resolve) => {
    const back = pkShell(title, sub, `<div class="pk-list">${rows.length ? rows.map((r, i) => `
        <button type="button" class="pk-opt" data-i="${i}">
          <span>${pkEsc(r.label)}</span>${r.why ? `<span class="pk-why">${pkEsc(r.why)}</span>` : ''}
          ${r.id ? `<span class="pk-id">#${pkEsc(r.id)}</span>` : ''}
        </button>`).join('') : `<div class="pk-none">${pkEsc(emptyText || 'Nothing to choose from.')}</div>`}</div>
      <div class="pk-foot"><div class="pk-btns"><button type="button" class="pk-cancel">Cancel</button></div></div>`);
    const finish = pkOpen(back, resolve);
    back.querySelector('.pk-cancel').addEventListener('click', () => finish(null));
    back.querySelectorAll('.pk-opt').forEach((b) => b.addEventListener('click', () => finish(rows[+b.dataset.i])));
    const first = back.querySelector('.pk-opt'); if (first) first.focus();
  });
}

/* ── HER BOOKS, ON THIS PAGE ─────────────────────────────────────────
   The year as QuickBooks itself reports it, what is still owed both ways
   with its age, and the bank balances. Read live and read-only. Where two
   figures disagree — the open bills add up to more than the A/P account,
   say — both are shown: that disagreement is information, and hiding it
   behind one number is how a page starts lying politely. */
async function loadBooks() {
  STATE.sel = null; renderList();
  $('dname').textContent = 'The books';
  $('dmap').textContent = 'Read live from QuickBooks a moment ago. Nothing here changes anything.';
  $('dstats').innerHTML = ''; $('dtabs').innerHTML = '';
  $('dbody').innerHTML = '<div class="empty">Reading your books…</div>';
  try {
    const b = await api('/api/qb/books');
    STATE.books = b;
    const pl = b.pl || {};

    $('dbody').innerHTML = broken

      if (name) openParty(kind, decodeURIComponent(name));

  } catch (e) { $('dbody').innerHTML = `<div class="empty">${e.message}</div>`; }

/* ── A STUCK ROW, AND WHERE IT IS ACTUALLY FIXED ──────────────────────
   Apsara, 2026-10-05: "Improve jarvis specifically in qb area as of now".

   Every stuck row used to do the same thing on click:
       openParty(kind, name)   // the supplier's QuickBooks NAME mapping
   On 4 October, 21 of the 24 were a price missing on a BILL. The mapping was
   correct and had nothing to do with it; she clicked, landed somewhere fine
   and irrelevant, and learned nothing. Opening the wrong screen costs more
   than opening none.

   `fix` comes from the SERVER (helpers/quickbooks/stuckFix.js) so the page
   and the nightly mail describe a row the same way. There is deliberately no
   deep link into Bills — dashboard/index.html has no openTab(), so a link
   would be invented rather than used. It names the destination; it does not
   pretend to be one. */
function stuckRow(x) {
  const f = x.fix || {};
  const clickable = f.where === 'party' || f.where === 'item';
  const open = clickable
    ? ` class="click" data-open="${x.kind === 'invoice' ? 'customer' : 'vendor'}|${encodeURIComponent(x.who || '')}"`
    : '';
  // esc() ON EVERY FIELD. Caught by tests/quickbooks-run-render.js section B,
  // which exists because "Carlos G & C" went into innerHTML raw once already.
  // These strings are supplier names, container numbers and grade names — all
  // typed by hand — so a name that looks like markup is an injection through
  // her own data, and the fix is not to trust the shape of her typing.
  const where = f.title
    ? `<span class="pill">${esc(f.title)}</span> <span style="color:var(--text-faint)">${esc(f.detail || '')}</span>`
    : `<span style="color:var(--text-faint)">${esc(x.why || '')}</span>`;
  return `<tr${open}><td class="mono">${esc(x.kind)}</td><td>${esc(x.who || '—')}</td>`
    + `<td class="mono">${esc(x.what || '')}</td><td>${where}</td></tr>`;
}

/* NINETEEN ROWS, ONE JOB. That morning's list read as nineteen separate
   failures; it was one — yard grades bought without a price. Shown above the
   table so the size of the actual job is the first thing on screen. */
function stuckJobs(rows) {
  const by = new Map();
  for (const x of (rows || [])) {
    const f = x.fix || {};
    if (!f.where || f.where === 'unknown') continue;
    const key = `${f.where}|${(f.detail || '').replace(/\d+/g, 'N').replace(/\([^)]*\)/g, '')}`;
    const g = by.get(key) || { label: f.label || f.title, detail: f.detail, n: 0, where: f.where };
    g.n += 1;
    by.set(key, g);
  }
  const jobs = [...by.values()].sort((a, b) => b.n - a.n).filter((g) => g.n > 1);
  if (!jobs.length) return '';
  return `<div class="sub" style="margin:2px 0 8px">`
    + jobs.map(g => `<span class="pill" style="margin-right:6px">${g.n}× ${esc(g.label)}</span>`).join('')
    + `<span style="color:var(--text-faint)">— same fix, same screen</span></div>`;
}

/* ── A CHANGE THAT CANNOT BE TAKEN BACK ──────────────────────────────
   Apsara, 2026-09-26: "Ensure the impact before changing any section."
   So every one of these opens with what it will do — not a yes/no box —
   and the confirmation is the document's own number, typed. You cannot
   agree to this one by reflex, and you cannot agree to the wrong one. */
function confirmImpact({ title, sub, bodyHtml, mustType, okLabel }) {
  return new Promise((resolve) => {
    const back = pkShell(title, sub, `<div class="pk-list" style="max-height:52vh">${bodyHtml}</div>
      <div class="pk-foot">
        <label for="pkYes">${mustType ? `Type <b>${pkEsc(mustType)}</b> to go ahead` : 'Go ahead?'}</label>
        ${mustType ? '<input id="pkYes" autocomplete="off" placeholder="' + pkEsc(mustType) + '">' : ''}
        <div class="pk-btns"><button type="button" class="pk-cancel">Leave it alone</button>
          <button type="button" class="pk-go">${pkEsc(okLabel || 'Go ahead')}</button></div>
      </div>`);
    const finish = pkOpen(back, resolve);
    back.querySelector('.pk-cancel').addEventListener('click', () => finish(false));
    back.querySelector('.pk-go').addEventListener('click', () => {
      if (!mustType) return finish(true);
      const typed = back.querySelector('#pkYes').value.trim();
      if (typed !== mustType) { toast(`Type ${mustType} exactly, or leave it alone.`, 'bad'); return; }
      finish(true);
    });
    const inp = back.querySelector('#pkYes'); if (inp) inp.focus();
  });
}

/* Void or delete one document in her books. */
async function voidDoc(type, id) {
  if (!STATE.unlocked) return toast('Open the padlock first.', 'bad');
  try {
    const im = await api(`/api/qb/impact?type=${encodeURIComponent(type)}&id=${encodeURIComponent(id)}`);
    const d = im.doc;
    const op = im.canVoid ? 'void' : 'delete';
    const warn = im.warnings.length
      ? im.warnings.map(w => `<div class="pk-none" style="color:var(--amber-500)">${w}</div>`).join('')
      : '<div class="pk-none">Nothing else in your books depends on this one.</div>';
    const lines = (d.lines || []).map(l => `<div class="pk-opt"><span>${l.what || '—'}</span><span class="pk-id">${money(l.amount)}</span></div>`).join('');
    const ok = await confirmImpact({
      title: `${op === 'void' ? 'Void' : 'Delete'} ${type} ${d.doc || '#' + im.id}`,
      sub: `${d.party || ''} · ${d.date} · ${money(d.total)}${d.balance !== null ? ` · ${money(d.balance)} still open` : ''}`,
      bodyHtml: `${warn}${lines}<div class="pk-none">${op === 'void'
        ? 'Voiding keeps the document and sets it to zero. QuickBooks stamps it Voided. It cannot be un-voided.'
        : 'Deleting removes the document from your books entirely. It cannot be undone.'}</div>`,
      mustType: d.doc || `#${im.id}`,
      okLabel: op === 'void' ? 'Void it' : 'Delete it',
    });
    if (!ok) return toast('Left alone. Nothing changed.', 'good');
    const reason = await askText('Why?', 'It stays in the journal beside this, for whoever asks later.', 'Reason', '', op === 'void' ? 'Void it' : 'Delete it');
    if (!reason) return toast('Left alone — no reason given.', 'good');
    const out = await api('/api/qb/void', { type, id, op, reason, stamp: im.stamp, confirm: d.doc || `#${im.id}` });

}

/* Two records for one company. QuickBooks will not merge over its API —
   proved against her own books — so Jarvis shows what the merge moves,
   gives the steps, and repairs its own mappings afterwards. */
async function mergeParty() {
  if (!STATE.unlocked) return toast('Open the padlock first.', 'bad');
  const d = STATE.detail;
  if (!d.mapping.qbId || d.mapping.qbId === 'SKIP') return toast('Match this one to QuickBooks first.', 'bad');
  try {
    const c = await api(`/api/qb/candidates?kind=${d.kind}&name=${encodeURIComponent(d.name)}`);
    const typed = await askText('Merge two QuickBooks records', `"${d.mapping.qbName}" (#${d.mapping.qbId}) is the one Jarvis uses. Which other record is the same company?`,
      'Type part of the other name', '', 'Search');
    if (!typed) return;
    const pool = (c.all || []).filter(x => x.name.toLowerCase().includes(typed.toLowerCase()) && String(x.Id) !== String(d.mapping.qbId));
    const other = await pickRow('Which one is the duplicate?', 'The one you pick is the record that will DISAPPEAR.',
      pool.slice(0, 25).map(x => ({ label: x.name, id: String(x.Id) })), `Nothing else matches "${typed}".`);
    if (!other) return;
    const im = await api(`/api/qb/merge-impact?kind=${d.kind}&loser=${other.id}&winner=${d.mapping.qbId}`);
    const body = `${im.warnings.map(w => `<div class="pk-none" style="color:var(--amber-500)">${w}</div>`).join('')}
      <div class="pk-opt"><span>Disappears: ${im.loser.name}</span><span class="pk-id">#${im.loser.id} · ${im.loser.documents || 0} docs · ${money(im.loser.balance)}</span></div>
      <div class="pk-opt"><span>Survives: ${im.winner.name}</span><span class="pk-id">#${im.winner.id} · ${im.winner.documents || 0} docs · ${money(im.winner.balance)}</span></div>
      <div class="pk-none">Balance afterwards: ${money(im.moves.afterwards)}</div>
      <div class="pk-none" style="color:var(--amber-500)">${im.why}</div>
      ${im.howTo.map((h, i) => `<div class="pk-opt"><span>${i + 1}. ${h}</span></div>`).join('')}`;
    const done = await confirmImpact({ title: 'Merge in QuickBooks', sub: 'Jarvis cannot do this one for you — these are the steps, and then it repairs its own side.',
      bodyHtml: body, mustType: null, okLabel: 'I merged them' });
    if (!done) return;
    const out = await api('/api/qb/merged', { kind: d.kind, deadId: im.loser.id, survivorId: im.winner.id, reason: `merged ${im.loser.name} into ${im.winner.name}` });
    toast(out.note, out.status === 'adopted' ? 'good' : 'bad');
    if (out.status === 'adopted') { await loadParties(); await openParty(d.kind, d.name); }
  } catch (e) { toast(e.message, 'bad'); }
}

/* a file off her machine, as base64 — the same shape every upload here uses */
function pickFile(accept, many) {
  return new Promise((resolve) => {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = accept || ''; input.multiple = !!many;
    input.onchange = async () => {
      const list = [...(input.files || [])];
      if (!list.length) return resolve(many ? [] : null);
      const read = (f) => new Promise((done) => {
        const fr = new FileReader();
        fr.onload = () => done({ name: f.name, base64: String(fr.result).split(',')[1] });
        fr.onerror = () => done(null);
        fr.readAsDataURL(f);
      });
      const out = (await Promise.all(list.map(read))).filter(Boolean);
      resolve(many ? out : out[0] || null);
    };
    input.click();
  });
}

/* Which account answers a role. Was scripts/qb-accounts.js role. */
async function setRole(role) {
  if (!STATE.unlocked) return toast('Open the padlock first.', 'bad');
  const why = ((STATE.status && STATE.status.roles) || []).find(r => r.role === role);
  const like = await askText(`Which account answers "${role}"?`, why && why.why ? why.why : '',
    'Type part of the account name to search your chart of accounts', '', 'Search');
  if (like === null) return;
  try {
    const r = await api(`/api/qb/accounts?like=${encodeURIComponent(like)}`);
    const rows = r.accounts.slice(0, 40).map(a => ({ label: `${a.name} — ${a.type}${a.sub ? ' / ' + a.sub : ''}`, id: a.id, name: a.name }));
    const chosen = await pickRow(`${role} → which account?`, `${r.total} match "${like}"`, rows, `No account matches "${like}". Try a shorter word.`);
    if (!chosen) return;
    await api('/api/qb/role', { role, qbId: chosen.id, qbName: chosen.name });
    toast(`${role} → ${chosen.name}. The next write uses it.`, 'good');
    await loadStatus(); if (!STATE.sel) await loadTodo();
  } catch (e) { toast(e.message, 'bad'); }
}

/* A name that is in no QuickBooks record at all. Jarvis never invents one
   on its own — this is her saying yes, without the terminal. */
async function createParty(kind, jarvisName) {
  const qbName = await askText(`Create a new ${kind} in QuickBooks`,
    `Jarvis will keep calling it "${jarvisName}".`, 'Name it should carry in QuickBooks', jarvisName, 'Next');
  if (!qbName) return;
  const contact = await askText('Contact person', 'The person, when the record carries a company name. Leave blank for none.',
    `Contact on "${qbName}"`, '', 'Create it');
  if (contact === null && !confirm(`Create ${kind} "${qbName}" with no contact name?`)) return;
  try {
    const out = await api('/api/qb/create-party', { kind, name: qbName, jarvisName, contact: contact || '' });
    toast(out.note, 'good');
    await loadParties(); await openParty(kind, jarvisName);
  } catch (e) {
    // QuickBooks keeps ONE name list for customers, vendors and employees,
    // so a company she both buys from and sells to cannot carry the same
    // name twice. Offer the fix rather than the error.
    const taken = e.body && e.body.status === 'name-taken' ? e.body : null;
    if (!taken) return toast(e.message, 'bad');
    const again = await askText('That name is taken in QuickBooks', taken.note,
      `Name for this ${kind}`, taken.suggestion, 'Create it');
    if (!again) return toast('Left alone. Nothing was created.', 'good');
    try {
      const out2 = await api('/api/qb/create-party', { kind, name: again, jarvisName, contact: contact || '' });
      toast(out2.note, 'good');
      await loadParties(); await openParty(kind, jarvisName);
    } catch (e2) { toast(e2.message, 'bad'); }
  }
}

/* ── the period lock ─────────────────────────────────────────────────
   This used to be a date rule the code insisted on, and in production an
   unset one refused everything. Both are gone (2026-10-02). It is now a lock
   she may choose, normally OFF, and off is the healthy state: 2026 is open
   and the evidence gates decide each row. The rolling boundary she asked for
   is the other half and is not a setting at all — nothing dated after today
   is entered, today being today, every day. */
function cutChip(which, date, from) {
  const pinned = from === 'env', unset = from === 'unset' || !date;
  const st = STATE.status && STATE.status.cutover || {};
  const rolling = which === 'bills' ? st.billsRolling : st.invoicesRolling;
  const tip = unset ? `No period locked — ${which} from any date in 2026 can be entered, and each row is judged on evidence (already in QuickBooks? cost already on a cheque?). This is the normal state. Click to lock a closed period.`
    : rolling ? `Set to "today" (${date}), and it moves every day — so NOTHING back-dated can ever be entered, including last week\'s ${which}. Click to change it.`
    : pinned ? `Locked before ${date} by .env on this machine — remove that line for this to be editable here.`
    : `Locked: nothing dated before ${date} is entered. Click to move it, or set "none" to unlock.`;
  const label = unset ? `${which}: no lock` : rolling ? `${which} locked ≥ today` : `${which} locked < ${date}`;
  return `<span class="chip ${rolling ? 'warn' : unset ? 'good' : ''} ${pinned ? '' : 'act'}" ${pinned ? '' : `data-cut="${which}"`} title="${tip}">${label}${pinned ? ' (.env)' : ''}</span>`;
}
async function moveCutover(which) {
  if (!STATE.unlocked) return toast('Open the padlock first.', 'bad');
  const now = (STATE.status && STATE.status.cutover && STATE.status.cutover[which]) || '';
  const next = await askText(`Lock the ${which === 'bills' ? 'bill' : 'invoice'} period before a date`,
    'Leave this at “none” unless you have genuinely closed a period — 2026 is open by default and every row is already checked against QuickBooks and against the cheques, which is the real protection. Nothing dated after today is ever entered, whatever you put here. Typing “today” locks everything back-dated out, including last week.',
    'Date (YYYY-MM-DD), “today”, or “none”', now, 'Save');
  if (!next || next === now) return;
  try {
    const out = await api('/api/qb/cutover', { [which]: next });
    toast(out.note || 'Saved.', /still wins/.test(out.note || '') ? 'bad' : 'good');
    await loadStatus();
  } catch (e) { toast(e.message, 'bad'); }
}

/* The nightly run, on demand. Same sweep, same checks, same journal. */
async function runNow() {
  if (!STATE.unlocked) return toast('Open the padlock first.', 'bad');
  const live = confirm('Run the nightly QuickBooks sweep NOW and enter what it finds?\n\nOK = enter it for real.\nCancel = check only (nothing written).');
  toast(live ? 'Running — entering what it finds…' : 'Running — checking only…');
  try {
    const out = await api('/api/qb/run', { dryRun: !live });
    renderRun(out);
    const s = out.summary || {};
    toast(`${out.dryRun ? 'Checked' : 'Entered'} ${s.made || 0}${s.blocked ? `, ${s.blocked} stuck` : ''}${s.asked ? `, ${s.asked} need you` : ''}${s.left ? `, ${s.left} older than the cutover` : ''}`, s.blocked || s.errored ? 'bad' : 'good');
    await loadStatus();
  } catch (e) { toast(e.message, 'bad'); }
}

/* ── WHAT THE RUN FOUND ───────────────────────────────────────────────
   Apsara, 2026-10-02, with a screenshot: "on clicking run now in qb,its
   coming like this ugly".

   It was. The result went to $('answer') as textContent — and `.answer` is
   the ASK JARVIS box: 13px, max-height 132px, and no white-space rule. The
   string it was given is the NIGHTLY EMAIL BODY, which separates everything
   with newlines. HTML collapses newlines, so forty stuck containers arrived
   as one unbroken grey paragraph inside a box four lines tall, and the only
   way to read any of it was to drag-select — which is exactly what her
   screenshot shows her having done.

   Three things were wrong and only one of them was cosmetic:
     · an email body is not a UI. It is written to survive a mail client,
       which is why it repeats the cutover explanation every single run.
     · the Ask box is the wrong home. It is sized for one answer to one
       question and it is where she looks for a REPLY, not a report.
     · the page already draws this exact shape well. "What needs you" lists
       stuck rows as a table with the reason in its own column, and she has
       never once complained about that panel.

   So the run result goes where it belongs — the detail pane, in the same
   section/table idiom — and the Ask box is left to answer questions.
   reportText() on the server is untouched: the nightly email wants to stay
   plain text, and scheduler.js prints it too. */
function renderRun(out) {
  // The Ask box must not keep yesterday's answer underneath a fresh run —
  // two unrelated results stacked in one view is how a stale line gets read
  // as part of this morning's.
  $('answer').style.display = 'none';
  STATE.sel = null; renderList();

  if (out.error) {
    $('dname').textContent = 'The run could not finish';
    $('dmap').textContent = 'Nothing further was written.';
    $('dstats').innerHTML = ''; $('dtabs').innerHTML = '';
    $('dbody').innerHTML = `<div class="empty" style="padding:14px">${esc(out.error)}</div>`;
    return;
  }

  const s = out.summary || {};
  const dry = out.dryRun;

  $('dname').textContent = dry ? 'Checked — nothing was written' : 'Entered in QuickBooks';
  $('dmap').textContent = dry
    ? 'A dry run. This is what WOULD have happened; your books are untouched.'
    : `Live run against ${out.env || 'QuickBooks'}. Click any line to open that name.`;

  /* The four numbers, as the page's own stat blocks rather than a sentence.
     "stuck" is the one she acts on, so it is not buried in a paragraph. */
  /* .stat / .k / .v with the page's own tone classes — good, warn, bad.
     Not hand-rolled colours: the P&L block above uses exactly this and a
     second private style for the same idea is how a palette drifts. */
  const stat = (label, v, tone) => !v ? '' :
    `<div class="stat"><div class="k">${label}</div><div class="v ${tone || ''}">${v}</div></div>`;
  $('dstats').innerHTML =
      (stat(dry ? 'would enter' : 'entered', s.made || 0, 'good')
    + stat('stuck', s.blocked || 0, 'bad')
    + stat('need you', s.asked || 0, 'warn')
    + stat('older than cutover', s.left || 0, '')
    + stat('errored', s.errored || 0, 'bad'))
    || '<div class="sub">Nothing to do — everything was already in QuickBooks.</div>';
  $('dtabs').innerHTML = '';

  const sec = [];

  /* ── STUCK ───────────────────────────────────────────────────────────
     Same columns as "what needs you", because it is the same information
     and she should not have to learn two layouts for one fact. */
  if ((out.blocked || []).length) {
    sec.push(`<h3 class="sec">Stuck — Jarvis would not enter these <span class="count">${out.blocked.length}</span></h3>
      ${stuckJobs(out.blocked)}
      <table><tbody>${out.blocked.slice(0, 40).map(stuckRow).join('')}</tbody></table>`
      + (out.blocked.length > 40 ? `<div class="sub" style="padding:6px 2px">…and ${out.blocked.length - 40} more. The full list is on "what needs you".</div>` : ''));
  } else if (s.blocked) {
    /* HONEST ABOUT THE GAP. run() only reads the journal for per-row reasons
       on a LIVE run, so a dry run knows the count and not the why. Saying so
       beats drawing an empty table under a heading that promises rows. */
    sec.push(`<h3 class="sec">Stuck <span class="count">${s.blocked}</span></h3>
      <div class="sub" style="padding:6px 2px">A dry run counts these but does not record why each one stopped.
      Open "what needs you" for the reasons, or run it live.</div>`);
  }

  if ((out.asked || []).length) {
    sec.push(`<h3 class="sec">Needs you — the same money may already be there <span class="count">${out.asked.length}</span></h3>
      <table><tbody>${out.asked.slice(0, 40).map(a => `<tr class="click" data-open="${a.kind === 'invoice' ? 'customer' : 'vendor'}|${encodeURIComponent(a.who || '')}">
        <td class="mono">${esc(a.kind)}</td><td>${esc(a.who) || '—'}</td>
        <td class="mono">${esc(a.what)}</td><td>${esc(a.why)}</td></tr>`).join('')}</tbody></table>`);
  }

  /* ── WHAT THE CUTOVER WALKED PAST ────────────────────────────────────
     Kept, and kept visible. A run that skipped everything used to read
     exactly like a quiet night — that is how days of sheet-sync rows went
     unnoticed, and the email grew this section for that reason. */
  const la = out.leftAlone;
  if (la && s.left) {
    const byKind = ['bill', 'sale', 'billpayment', 'receipt'].filter(k => la[k])
      .map(k => `${la[k]} ${k}${la[k] === 1 ? '' : 's'}`).join(', ');
    const why = Object.entries(la.why || {}).map(([w, n]) => `<tr><td class="mono r">${n}</td><td>${esc(w)}</td></tr>`).join('');
    // "Period lock", matching what the nightly email and the rest of the page
    // now call it — the same boundary under two names is how a question gets
    // asked twice.
    sec.push(`<h3 class="sec">Held back by the period lock <span class="count">${s.left}</span></h3>
      <div class="sub" style="padding:4px 2px 8px">${byKind}${la.from ? `, dated ${esc(la.from)}${la.to && la.to !== la.from ? ` to ${esc(la.to)}` : ''}` : ''}.
      Deliberate — your books already hold that period. Move the lock with the date chips above.</div>
      ${why ? `<table><tbody>${why}</tbody></table>` : ''}`);
  }

  /* The per-kind counts last: useful, but never the thing she needs first. */
  const kindRows = Object.entries(out.kinds || {})
    .filter(([k, v]) => k !== 'leftAlone' && v && typeof v === 'object' && Object.keys(v).length)
    .map(([k, v]) => `<tr><td class="mono"><b>${esc(k)}</b></td><td>${Object.entries(v)
      .map(([st, n]) => `${esc(st)} ${n}`).join(' · ')}</td></tr>`).join('');
  if (kindRows) sec.push(`<h3 class="sec">By record type</h3><table><tbody>${kindRows}</tbody></table>`);

  $('dbody').innerHTML = sec.length ? sec.join('')
    : `<div class="empty" style="padding:14px">${dry ? 'Nothing would have been entered' : 'Nothing needed entering'} — everything is already in QuickBooks.</div>`;

  $('dbody').querySelectorAll('tr.click').forEach(tr => {
    const [kind, name] = (tr.dataset.open || '').split('|');
    if (name) tr.onclick = () => openParty(kind, decodeURIComponent(name));
  });
}

/* A reason string comes from QuickBooks and from her own data — a supplier
   named with an "&" is ordinary here, and it was being written into innerHTML
   raw. Escaped at the point of use. */
function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

/* ── the party list ─────────────────────────────────────────────────── */
async function loadParties() {
  try {
    const { parties } = await api('/api/qb/parties');
    STATE.parties = parties;
    renderList();
  } catch (e) { $('plist').innerHTML = `<div class="empty" style="padding:14px">${e.message}</div>`; }
}
function renderList() {
  const q = ($('q').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const rows = STATE.parties.filter(p => (!STATE.kind || p.kind === STATE.kind)

    const dot = p.skipped ? 'skip' : (p.mapped ? 'ok' : 'no');

    const n = p.kind === 'vendor' ? `${p.bills} bills` : `${p.invoices} invoices`;

      <span class="nm"><span><span class="dot ${dot}"></span>${p.name}</span><span class="mono" style="color:var(--text-muted)">${money(value)}</span></span>
      <span class="sub"><span>${p.kind === 'vendor' ? 'supplier' : 'customer'} · ${n}${p.advances ? ` · ${p.advances} wires` : ''}</span><span>${p.qbBalance !== null && p.qbBalance !== undefined ? 'QB ' + money(p.qbBalance) : (p.mapped ? '' : 'no QB match')}</span></span>
    </button>`;
  }).join('') : '<div class="empty" style="padding:14px">Nothing matches.</div>';
  [...document.querySelectorAll('.prow')].forEach(b => b.onclick = () => openParty(b.dataset.kind, decodeURIComponent(b.dataset.name)));
}

/* ── one party ──────────────────────────────────────────────────────── */
async function openParty(kind, name) {
  STATE.sel = { kind, name };
  STATE.tab = kind === 'vendor' ? 'bills' : 'invoices';
  renderList();
  $('dname').textContent = name;
  $('dbody').innerHTML = '<div class="empty">Reading Jarvis and QuickBooks…</div>';
  try {
    const d = await api(`/api/qb/party?kind=${kind}&name=${encodeURIComponent(name)}`);
    STATE.detail = d;
    renderDetail();
  } catch (e) { $('dbody').innerHTML = `<div class="empty">${e.message}</div>`; }
}
function renderDetail() {
  const d = STATE.detail, t = d.totals;
  const mp = d.mapping || {};
  $('dmap').innerHTML = (mp.qbId && mp.qbId !== 'SKIP')
    ? `in QuickBooks as <b>${mp.qbName || ''}</b> <span class="mono" style="color:var(--text-faint)">#${mp.qbId}</span>${mp.status === 'exact' ? ' <span style="color:var(--text-faint)">(same name — matched automatically)</span>' : ''} · <button class="act" id="remap">change</button> · <button class="act" id="mergeit" title="Two QuickBooks records for one company">merge a duplicate</button>`
    : mp.status === 'skip'
      ? `not a QuickBooks party — ${mp.note || 'you marked it as not one'} · <button class="act" id="remap">change</button>`
      : mp.status === 'new'
        ? `you marked this as not in QuickBooks · <button class="act" id="remap">change</button>`
        // ── AND A WAY TO CREATE IT (2026-10-03, #152) ──────────────────
        // /api/qb/create-party has existed all along, and so has
        // createParty() below. The only way to reach either was: open the
        // party, press "match it", wait for the candidate list to load, then
        // press "create it in QuickBooks" inside that dialog. Three steps and
        // a network round-trip to tell Jarvis something she already knew
        // when she opened the row.
        //
        // The two are different answers to different questions, so they sit
        // side by side rather than one inside the other:
        //   match it   — it IS in QuickBooks, under some other spelling
        //   create it  — it is NOT in QuickBooks, put it there
        //
        // Still never automatic. createParty asks for the QuickBooks name and
        // the contact, and the route refuses to make a twin — Jarvis does not
        // invent a party in her books, she does.
        : `<span style="color:var(--red-500)">no QuickBooks match yet</span>`
          + ` · <button class="act" id="remap">match it</button>`
          + ` · <button class="act" id="makeparty" title="It is not in QuickBooks — add it">create it in QuickBooks</button>`;
  const gap = (d.qbBalance !== null && d.qbBalance !== undefined) ? null : null;
  $('dstats').innerHTML = [
    d.kind === 'vendor' ? ['Bills', money(t.bills), ''] : ['Invoices', money(t.invoices), ''],
    d.kind === 'vendor' ? ['Advanced', money(t.advances), t.advancesUnapplied > 0 ? 'warn' : ''] : null,
    d.kind === 'vendor' ? ['Not applied yet', money(t.advancesUnapplied), t.advancesUnapplied > 0 ? 'warn' : 'good'] : null,
    ['QuickBooks balance', money(d.qbBalance), ''],
    ['In QuickBooks', `${t.inQuickBooks}`, 'good'],
    ['Not yet', `${t.notInQuickBooks}`, t.notInQuickBooks ? 'warn' : 'good'],
  ].filter(Boolean).map(([k, v, cls]) => `<div class="stat"><div class="k">${k}</div><div class="v ${cls}">${v}</div></div>`).join('');
  const tabs = d.kind === 'vendor'
    ? [['bills', 'Bills', d.bills.length], ['advances', 'Wires & advances', d.advances.length], ['qb', 'In QuickBooks', ''], ['journal', 'What Jarvis did', d.journal.length]]
    : [['invoices', 'Invoices', d.invoices.length], ['qb', 'In QuickBooks', ''], ['journal', 'What Jarvis did', d.journal.length]];
  $('dtabs').innerHTML = tabs.map(([id, label, n]) => `<button data-tab="${id}" class="${STATE.tab === id ? 'sel' : ''}">${label}<span class="count">${n}</span></button>`).join('');
  [...$('dtabs').querySelectorAll('button')].forEach(b => b.onclick = () => { STATE.tab = b.dataset.tab; renderDetail(); });
  const rm = $('remap'); if (rm) rm.onclick = remap;
  // Same idiom as remap: the element only exists on an unmatched party, so
  // it is looked up and guarded rather than assumed.
  const mk = $('makeparty');
  if (mk) mk.onclick = () => createParty(STATE.detail.kind, STATE.detail.name);
  const mg = $('mergeit'); if (mg) mg.onclick = mergeParty;
  renderTable();
}
function qbLink(id, kind) {

/* ── WHAT QUICKBOOKS ITSELF HOLDS ────────────────────────────────────
   Apsara, 2026-09-26: "jarvis should be supreme of qb." Every other tab

        <td><button class="act" data-void="${x.kind === 'expense' ? 'purchase' : x.kind === 'receipt' ? 'salesreceipt' : x.kind === 'credit' ? (d.kind === 'vendor' ? 'vendorcredit' : 'creditmemo') : x.kind === 'payment' ? (d.kind === 'vendor' ? 'billpayment' : 'payment') : x.kind}:${x.id}" ${STATE.unlocked ? '' : 'disabled'}>void</button></td></tr>`).join('')}</tbody></table>`;

function renderTable() {
  const d = STATE.detail;
  if (STATE.tab === 'qb') return renderQbTab();
  const rows = STATE.tab === 'bills' ? d.bills : STATE.tab === 'invoices' ? d.invoices : STATE.tab === 'advances' ? d.advances : d.journal;
  if (!rows.length) { $('dbody').innerHTML = '<div class="empty">Nothing here yet.</div>'; return; }
  if (STATE.tab === 'journal') {
    $('dbody').innerHTML = `<table><thead><tr><th>When</th><th>What</th><th>Record</th><th class="num">Amount</th><th>Why</th><th></th></tr></thead><tbody>${
      rows.map(e => `<tr><td class="mono">${(e.at || '').slice(0, 16).replace('T', ' ')}</td>
        <td><span class="pill ${e.action === 'created' ? 'in' : e.action === 'blocked' ? 'bad' : 'out'}">${e.action}</span> ${e.kind}</td>
        <td>${e.qb && e.qb.id ? qbLink(e.qb.id, e.kind) : '—'}</td>
        <td class="num">${e.qb && e.qb.total != null ? money(e.qb.total) : '—'}</td>
        <td style="color:var(--text-faint)">${(e.reason || '').slice(0, 90)}</td>
        <td>${e.action === 'created' ? `<button class="act" data-undo="${e.id}" ${STATE.unlocked ? '' : 'disabled'}>undo</button>` : ''}</td></tr>`).join('')}</tbody></table>`;
    [...document.querySelectorAll('[data-undo]')].forEach(b => b.onclick = () => undo(b.dataset.undo));
    return;
  }
  if (STATE.tab === 'advances') {
    $('dbody').innerHTML = `<table><thead><tr><th>Date</th><th>Mode</th><th class="num">Amount</th><th class="num">Applied</th><th>QuickBooks</th><th></th></tr></thead><tbody>${
      rows.map(a => `<tr><td class="mono">${a.date}</td><td>${a.mode || ''} ${a.bank || ''} <span class="pill">${a.kind}</span></td>
        <td class="num">${money(a.amount)}</td><td class="num" style="color:${a.applied ? 'var(--leaf-300)' : 'var(--amber-500)'}">${money(a.applied)}</td>
        <td>${a.qbId ? qbLink(a.qbId, 'expense') : '<span class="pill out">not in QB</span>'}</td>
        <td>${a.qbId ? '' : `<button class="act" data-push="advance:${a.id}" ${STATE.unlocked ? '' : 'disabled'}>send</button>`}</td></tr>`).join('')}</tbody></table>`;
  } else {
    const kind = STATE.tab === 'bills' ? 'bill' : 'invoice';
    $('dbody').innerHTML = `<table><thead><tr><th>Date</th><th>No.</th><th>Container</th><th class="num">Amount</th><th>QuickBooks</th><th></th></tr></thead><tbody>${
      rows.map(b => `<tr><td class="mono">${b.date}</td><td class="mono">${b.no || '—'}</td><td class="mono" style="color:var(--text-muted)">${b.container || '—'}</td>
        <td class="num">${money(b.amount)}</td>
        <td>${b.qbId ? qbLink(b.qbId, kind) : `<span class="pill ${b.blocked ? 'bad' : 'out'}">${b.blocked || 'not in QB'}</span>`}</td>
        <td>${b.qbId ? '' : `<button class="act" data-check="${kind}:${b.id}">check</button> <button class="act" data-push="${kind}:${b.id}" ${STATE.unlocked ? '' : 'disabled'}>send</button>`}</td></tr>`).join('')}</tbody></table>`;
  }
  [...document.querySelectorAll('[data-push]')].forEach(b => b.onclick = () => send(b.dataset.push, false));
  [...document.querySelectorAll('[data-check]')].forEach(b => b.onclick = () => send(b.dataset.check, true));
}

/* ── the three things the padlock allows ────────────────────────────── */
async function send(spec, dryRun) {
  const [kind, id] = spec.split(':');
  if (!dryRun && !confirm(`Send this ${kind} to QuickBooks ${STATE.status ? '(' + STATE.status.env + ')' : ''}?\n\nIt goes through the same checks as the nightly run and is recorded in the journal.`)) return;
  try {
    const out = await api('/api/qb/push', { kind, id, dryRun });
    const bits = [out.status, out.qbId ? 'QB #' + out.qbId : '', (out.problems || []).join('; '), out.note || ''].filter(Boolean);
    toast((dryRun ? 'Check: ' : '') + bits.join(' — '), out.status === 'created' || out.status === 'would-create' ? 'good' : 'bad');
    if (!dryRun) { await openParty(STATE.sel.kind, STATE.sel.name); loadStatus(); }
  } catch (e) { toast(e.message, 'bad'); }
}
async function undo(journalId) {
  const reason = await askText('Undo this in QuickBooks', 'The reason goes in the journal beside the undo, so the books can be explained later.',
    'Why is it coming back out?', '', 'Continue');
  if (!reason) return;
  try {
    const dry = await api('/api/qb/undo', { journalId, reason, dryRun: true });
    if (!confirm(`${dry.status}: ${dry.note || dry.why || ''}\n\nGo ahead?`)) return;
    const out = await api('/api/qb/undo', { journalId, reason, dryRun: false });
    toast(`${out.status} ${out.why || ''}`, out.status === 'refused' ? 'bad' : 'good');
    await openParty(STATE.sel.kind, STATE.sel.name);
  } catch (e) { toast(e.message, 'bad'); }
}
/* ── PICKING THE QUICKBOOKS MATCH ───────────────────────────────────────
   Replaces window.prompt(). Resolves to the SAME four things prompt() gave
   back — a 1-based index as a string, a typed QuickBooks name, 'SKIP', or
   null for cancel — so remap()'s parsing below is unchanged. That is
   deliberate: this is a change of appearance and of input method, not of
   what gets written to the mapping.

   The exact-name row keeps the words "same name, almost certainly this one"
   because tests/quickbooks-page.js asserts that phrase is on the page — it
   is the tell that the candidates route put the exact match at the head of
   the list, and losing the wording would lose that check. */
function pickMatch(d, c) {
  return new Promise((resolve) => {
    const cands = c.candidates || [];
    const back = document.createElement('div');
    back.className = 'pk-back';
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
    back.innerHTML = `
      <div class="pk" role="dialog" aria-modal="true" aria-label="Match to a QuickBooks ${esc(d.kind)}">
        <div class="pk-head">
          <h3>Match &ldquo;${esc(d.name)}&rdquo;</h3>
          <p>to a QuickBooks ${esc(d.kind)}</p>
        </div>
        <div class="pk-list">${cands.length ? cands.map((x, i) => `
          <button type="button" class="pk-opt" data-i="${i + 1}">
            <span>${esc(x.DisplayName || x.name)}</span>
            ${x.exact ? '<span class="pk-why">same name, almost certainly this one</span>' : ''}
            <span class="pk-id">#${esc(x.Id)}</span>
          </button>`).join('') : '<div class="pk-none">No near matches. Type the exact QuickBooks name below.</div>'}
        </div>
        <div class="pk-foot">
          <label for="pkTyped">Not listed? Type the exact QuickBooks name</label>
          <input id="pkTyped" list="pkAll" autocomplete="off" placeholder="exact name as it appears in QuickBooks">
          <datalist id="pkAll">${(c.all || []).slice(0, 2000).map((x) => `<option value="${esc(x.name)}"></option>`).join('')}</datalist>
          <div class="pk-btns">
            <button type="button" class="pk-cancel">Cancel</button>
            <button type="button" class="pk-skip">Skip</button>
            <button type="button" class="pk-new" title="It is in none of your QuickBooks records — create it there and match it">NEW to create it in QuickBooks</button>
            <button type="button" class="pk-go">Use typed name</button>
          </div>
        </div>
      </div>`;

    let done = false;
    const finish = (v) => {
      if (done) return;
      done = true;
      document.removeEventListener('keydown', onKey);
      back.remove();
      resolve(v);
    };
    // Escape cancels and a click on the backdrop cancels — both leave the
    // mapping exactly as it was, same as dismissing the old prompt.
    const onKey = (e) => {
      if (e.key === 'Escape') finish(null);
      if (e.key === 'Enter' && document.activeElement === back.querySelector('#pkTyped')) {
        const t = back.querySelector('#pkTyped').value.trim();
        if (t) finish(t);
      }
    };
    back.addEventListener('click', (e) => { if (e.target === back) finish(null); });
    back.querySelectorAll('.pk-opt').forEach((b) => b.addEventListener('click', () => finish(b.dataset.i)));
    back.querySelector('.pk-cancel').addEventListener('click', () => finish(null));
    back.querySelector('.pk-skip').addEventListener('click', () => finish('SKIP'));
    // Nothing in her books is this party. Jarvis never invents one on its
    // own, so this is her saying create it — the answer remap() turns into
    // createParty(), which refuses to make a twin.
    back.querySelector('.pk-new').addEventListener('click', () => finish('NEW'));
    back.querySelector('.pk-go').addEventListener('click', () => {
      const t = back.querySelector('#pkTyped').value.trim();
      // An empty box is not a choice. Saying so beats closing on nothing and
      // leaving her wondering whether it saved.
      if (!t) { toast('Type a QuickBooks name, or pick one from the list.', 'bad'); return; }
      finish(t);
    });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(back);
    // The exact match is almost always the answer, so it is what the keyboard
    // lands on. Enter confirms it without touching the mouse.
    const first = back.querySelector('.pk-opt') || back.querySelector('#pkTyped');
    if (first) first.focus();
  });
}

async function remap() {
  if (!STATE.unlocked) return toast('Open the padlock first.', 'bad');
  const d = STATE.detail;
  try {
    const c = await api(`/api/qb/candidates?kind=${d.kind}&name=${encodeURIComponent(d.name)}`);
    // Returns exactly what prompt() returned — a number as a string, a typed
    // name, 'SKIP', or null for cancel — so everything below is untouched.
    const pick = await pickMatch(d, c);
    if (!pick) return;
    let qbId = null, qbName = null;
    if (pick.trim().toUpperCase() === 'NEW') return createParty(d.kind, d.name);
    if (pick.trim().toUpperCase() === 'SKIP') { qbId = 'SKIP'; }
    else if (/^\d+$/.test(pick.trim()) && c.candidates[+pick.trim() - 1]) {
      const chosen = c.candidates[+pick.trim() - 1]; qbId = chosen.Id; qbName = chosen.DisplayName || chosen.name;
    } else {
      const found = (c.all || []).find(x => x.name.toLowerCase() === pick.trim().toLowerCase());
      if (!found) return toast('No QuickBooks name matches that exactly. Nothing changed.', 'bad');
      qbId = found.Id; qbName = found.name;
    }
    await api('/api/qb/map', { kind: d.kind, jarvisName: d.name, qbId, qbName, reason: 'matched on the QuickBooks page' });
    toast('Saved. Commit qb-settings so the other machine has it too.', 'good');
    await loadParties(); await openParty(d.kind, d.name);
  } catch (e) { toast(e.message, 'bad'); }
}

/* ── ask jarvis ─────────────────────────────────────────────────────── */
async function ask() {
  const q = $('ask').value.trim();
  if (!q) return;
  $('answer').innerHTML = `<div class="you">${q}</div><div style="color:var(--text-faint)">Jarvis is looking…</div>`;
  $('ask').value = '';
  try {
    const out = await api('/api/qb/ask', { question: q, kind: STATE.sel && STATE.sel.kind, name: STATE.sel && STATE.sel.name });
    $('answer').innerHTML = `<div class="you">${q}</div>${out.answer}<span class="follow">${out.followUp || ''}</span>`;
  } catch (e) { $('answer').innerHTML = `<div class="you">${q}</div><span style="color:var(--red-500)">${e.message}</span>`; }
}

$('lock').onclick = () => {
  STATE.unlocked = !STATE.unlocked;
  $('lock').className = 'lock' + (STATE.unlocked ? ' open' : '');
  $('lock').textContent = STATE.unlocked ? '🔓 Unlocked — changes reach QuickBooks' : '🔒 Locked';
  if (STATE.detail) renderDetail();
};
$('q').oninput = renderList;
[...document.querySelectorAll('.tabsel button')].forEach(b => b.onclick = () => {
  STATE.kind = b.dataset.kind;
  [...document.querySelectorAll('.tabsel button')].forEach(x => x.classList.toggle('sel', x === b));
  renderList();
});
/* the status strip is clickable: the cutover chips and "run now" */
$('chips').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  if (chip.dataset.cut) moveCutover(chip.dataset.cut);
  else if (chip.dataset.run) runNow();
  else if (chip.dataset.role) setRole(chip.dataset.role);
  else if (chip.dataset.todo) { STATE.sel = null; renderList(); loadTodo(); }
  else if (chip.dataset.books) loadBooks();
  else if (chip.dataset.find) findDoc();
  else if (chip.dataset.missing) loadMissing();
  else if (chip.dataset.dupes) loadDuplicates();
  else if (chip.dataset.miscoded) loadMiscoded();
  else if (chip.dataset.allocate) allocatePayments(null);
  else if (chip.dataset.bank) bankReview();
  else if (chip.dataset.agent) loadAgent();
  else if (chip.dataset.older) pushOlderList();
  else if (chip.dataset.connect) connectQb();
});
$('asksend').onclick = ask;
$('ask').addEventListener('keydown', (e) => { if (e.key === 'Enter') ask(); });

loadStatus();
loadParties();
loadTodo();
</script>
